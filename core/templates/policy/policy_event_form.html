{% extends "base.html" %}

{% block title %}新增政策事件 - AgomTradePro{% endblock %}

{% block content %}
<div role="status" style="margin: 0 auto 16px; max-width: 900px; padding: 12px 16px; border: 1px solid #bfdbfe; background: #eff6ff; color: #1e3a8a;">
    政策事件创建已迁入 TUI，并仅对管理员开放。
    <a href="/tui/?screen=policy.workbench&amp;action=policy.event-create" style="color:#1d4ed8; font-weight:700;">打开 TUI 创建任务</a>。
    当前 Classic 页面仅在兼容期内保留。
</div>
<div style="max-width: 900px; margin: 0 auto; padding: 24px;">
    <h1>新增政策事件</h1>
    <p style="color: #64748b;">使用业务页面创建政策事件，不依赖 Django Admin。</p>

    <form method="post" style="background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px;">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="margin-top: 16px; display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="{% url 'policy:events-page' %}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
