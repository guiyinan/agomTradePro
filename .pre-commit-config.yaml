repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 5.11.3
    hooks:
      - id: isort

  - repo: local
    hooks:
      - id: data-center-governance-projections
        name: check generated Data Center governance projections
        entry: python scripts/check_data_center_governance_projections.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
