components:
  schemas:
    AIProviderConfig:
      type: object
      description: Read serializer for provider payloads.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        scope:
          type: string
          readOnly: true
        owner_user_id:
          type: integer
          readOnly: true
          nullable: true
        owner_username:
          type: string
          readOnly: true
          nullable: true
        provider_type:
          type: string
          readOnly: true
        provider_type_label:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        priority:
          type: integer
          readOnly: true
        base_url:
          type: string
          format: uri
          readOnly: true
        api_key:
          type: string
          description: Return a fixed mask without decrypting or fingerprinting the
            credential.
          readOnly: true
        api_key_configured:
          type: boolean
          readOnly: true
        default_model:
          type: string
          readOnly: true
        api_mode:
          type: string
          readOnly: true
        fallback_enabled:
          type: boolean
          readOnly: true
        daily_budget_limit:
          type: number
          format: double
          readOnly: true
          nullable: true
        monthly_budget_limit:
          type: number
          format: double
          readOnly: true
          nullable: true
        extra_config:
          readOnly: true
        description:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        today_requests:
          type: integer
          readOnly: true
        today_cost:
          type: number
          format: double
          readOnly: true
        month_requests:
          type: integer
          readOnly: true
        month_cost:
          type: number
          format: double
          readOnly: true
    AIStrategyConfig:
      type: object
      description: AI策略配置序列化器
      properties:
        id:
          type: integer
          readOnly: true
        strategy:
          type: integer
          title: 所属策略
        prompt_template:
          type: integer
          nullable: true
          title: Prompt模板
        chain_config:
          type: integer
          nullable: true
          title: 链配置
        ai_provider:
          type: integer
          nullable: true
          title: AI服务商
        temperature:
          type: number
          format: double
          maximum: 2.0
          minimum: 0.0
          title: 温度参数
        max_tokens:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          title: 最大Token数
        approval_mode:
          allOf:
          - $ref: '#/components/schemas/ApprovalModeEnum'
          title: 审核模式
        confidence_threshold:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
          title: 自动执行置信度阈值
          description: 置信度高于此值时自动执行
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 更新时间
      required:
      - strategy
    AIStrategyConfigRequest:
      type: object
      description: AI策略配置序列化器
      properties:
        strategy:
          type: integer
          title: 所属策略
        prompt_template:
          type: integer
          nullable: true
          title: Prompt模板
        chain_config:
          type: integer
          nullable: true
          title: 链配置
        ai_provider:
          type: integer
          nullable: true
          title: AI服务商
        temperature:
          type: number
          format: double
          maximum: 2.0
          minimum: 0.0
          title: 温度参数
        max_tokens:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          title: 最大Token数
        approval_mode:
          allOf:
          - $ref: '#/components/schemas/ApprovalModeEnum'
