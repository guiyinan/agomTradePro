  /api/account/accounts/{account_id}/trades/:
    get:
      operationId: api_account_accounts_by_account_id_trades_get
      description: 获取指定账户的交易记录（支持过滤）
      summary: 获取账户交易记录
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: asset_code
        schema:
          type: string
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeListResponse'
          description: ''
  /api/account/accounts/{account_id}/valuation-snapshot/:
    get:
      operationId: api_account_accounts_by_account_id_valuation_snapshot_get
      description: GET /api/simulated-trading/accounts/{account_id}/valuation-snapshot/
      summary: 账户时点持仓估值表
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      - in: query
        name: as_of_date
        schema:
          type: string
        required: true
      tags:
      - Account Performance
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValuationSnapshotResponse'
          description: ''
  /api/account/accounts/{account_id}/valuation-timeline/:
    get:
      operationId: api_account_accounts_by_account_id_valuation_timeline_get
      description: GET /api/simulated-trading/accounts/{account_id}/valuation-timeline/
      summary: 账户净值时间线
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      - in: query
        name: end_date
        schema:
          type: string
      - in: query
        name: start_date
        schema:
          type: string
      tags:
      - Account Performance
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValuationTimelineResponse'
          description: ''
  /api/account/accounts/batch-delete/:
    post:
      operationId: api_account_accounts_batch_delete_post
      description: 批量删除当前用户拥有的账户，并返回逐项失败原因。
      summary: 批量删除账户
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountBatchDeleteRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountBatchDeleteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountBatchDeleteRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBatchDeleteResponse'
          description: ''
  /api/account/admin/mcp/tokens/{token_id}/revoke/:
    post:
      operationId: api_account_admin_mcp_tokens_by_token_id_revoke_post
      description: Admin revokes one specific MCP token by id.
      parameters:
      - in: path
        name: token_id
        schema:
          type: integer
        required: true
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/account/admin/mcp/users/:
    get:
      operationId: api_account_admin_mcp_users_get
      description: Admin MCP governance list for all users.
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/account/admin/mcp/users/{user_id}/:
    get:
      operationId: api_account_admin_mcp_users_by_user_id_get
      description: Admin MCP detail for one specific user.
      parameters:
