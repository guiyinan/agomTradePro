  /api/account/capital-flows/:
    get:
      operationId: api_account_capital_flows_get
      description: |-
        资金流水 API ViewSet

        提供以下接口:
        - GET /api/account/capital-flows/ - 获取资金流水列表
        - POST /api/account/capital-flows/ - 创建资金流水
        - GET /api/account/capital-flows/{id}/ - 获取流水详情
        - DELETE /api/account/capital-flows/{id}/ - 删除流水
      parameters:
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCapitalFlowList'
          description: ''
    post:
      operationId: api_account_capital_flows_post
      description: |-
        资金流水 API ViewSet

        提供以下接口:
        - GET /api/account/capital-flows/ - 获取资金流水列表
        - POST /api/account/capital-flows/ - 创建资金流水
        - GET /api/account/capital-flows/{id}/ - 获取流水详情
        - DELETE /api/account/capital-flows/{id}/ - 删除流水
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapitalFlowCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CapitalFlowCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CapitalFlowCreateRequest'
        required: true
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapitalFlowCreate'
          description: ''
  /api/account/capital-flows/{id}/:
    get:
      operationId: api_account_capital_flows_by_id_get
      description: |-
