openapi: 3.0.3
info:
  title: AgomTradePro API
  version: 1.0.0
  description: Agom Strategic Asset Allocation Framework API
paths:
  /api/account/accounts/:
    get:
      operationId: api_account_accounts_get
      description: 获取当前用户的账户列表，支持按 active_only 和 account_type 过滤。
      summary: 获取统一账户列表
      parameters:
      - in: query
        name: account_type
        schema:
          type: string
        description: 账户类型过滤：real 或 simulated
      - in: query
        name: active_only
        schema:
          type: boolean
        description: 是否只返回活跃账户（默认 true）
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
          description: ''
    post:
      operationId: api_account_accounts_post
      description: 创建新的统一账户，账户类型通过 account_type 指定。
      summary: 创建账户
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateAccountRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateAccountRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: ''
  /api/account/accounts/{account_id}/:
    get:
      operationId: api_account_accounts_by_account_id_get
      description: 获取单个账户的完整信息
      summary: 获取账户详情
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: ''
    delete:
      operationId: api_account_accounts_by_account_id_delete
      description: 删除当前用户拥有的单个模拟/实仓账户，并级联删除关联持仓、交易与巡检记录。
      summary: 删除账户
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeleteResponse'
          description: ''
  /api/account/accounts/{account_id}/backfill/:
    post:
      operationId: api_account_accounts_by_account_id_backfill_post
      description: |-
        POST /api/simulated-trading/accounts/{account_id}/backfill/

        触发账户历史数据回填：
        - 写入初始入金现金流
        - 真实盘：镜像 CapitalFlowModel 到统一现金流表
        - 验证日净值序列是否存在

        仅管理员可操作。
      summary: 触发账户历史回填（admin only）
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - Account Performance
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/account/accounts/{account_id}/benchmarks/:
    get:
      operationId: api_account_accounts_by_account_id_benchmarks_get
      description: GET|PUT /api/simulated-trading/accounts/{account_id}/benchmarks/
      summary: 获取账户基准成分配置
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - Account Performance
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BenchmarkComponentResponse'
          description: ''
    put:
      operationId: api_account_accounts_by_account_id_benchmarks_put
      description: GET|PUT /api/simulated-trading/accounts/{account_id}/benchmarks/
      summary: 更新账户基准成分配置（全量覆盖，权重自动归一化）
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - Account Performance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenchmarkPutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BenchmarkPutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BenchmarkPutRequest'
        required: true
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BenchmarkComponentResponse'
          description: ''
  /api/account/accounts/{account_id}/equity-curve/:
    get:
      operationId: api_account_accounts_by_account_id_equity_curve_get
      description: 获取账户的净值曲线数据（用于图表）
      summary: 获取净值曲线
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      - in: query
        name: end_date
        schema:
          type: string
          format: date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquityCurveResponse'
          description: ''
  /api/account/accounts/{account_id}/inspections/:
    get:
      operationId: api_account_accounts_by_account_id_inspections_get
      description: 按账户查询日更巡检报告列表
      summary: 获取账户日更巡检历史
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      - in: query
        name: inspection_date
        schema:
          type: string
          format: date
      - in: query
        name: limit
        schema:
          type: integer
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyInspectionReportListResponse'
          description: ''
  /api/account/accounts/{account_id}/inspections/run/:
    post:
      operationId: api_account_accounts_by_account_id_inspections_run_post
      description: 对指定账户执行一轮日更巡检并写入数据库
      summary: 执行账户日更巡检
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyInspectionRunRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DailyInspectionRunRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DailyInspectionRunRequestRequest'
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyInspectionReportListResponse'
          description: ''
  /api/account/accounts/{account_id}/performance/:
    get:
      operationId: api_account_accounts_by_account_id_performance_get
      description: 获取账户的完整绩效分析
      summary: 获取账户绩效
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceResponse'
          description: ''
  /api/account/accounts/{account_id}/performance-report/:
    get:
      operationId: api_account_accounts_by_account_id_performance_report_get
      description: GET /api/simulated-trading/accounts/{account_id}/performance-report/
      summary: 账户区间业绩报告
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      - in: query
        name: end_date
        schema:
          type: string
        required: true
      - in: query
        name: start_date
        schema:
          type: string
        required: true
      tags:
      - Account Performance
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceReportResponse'
          description: ''
  /api/account/accounts/{account_id}/positions/:
    get:
      operationId: api_account_accounts_by_account_id_positions_get
      description: 获取指定账户的所有持仓
      summary: 获取账户持仓列表
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
