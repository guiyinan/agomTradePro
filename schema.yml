    ParserTypeEnum:
      enum:
      - feedparser
      - httpx
      type: string
      description: |-
        * `feedparser` - feedparser
        * `httpx` - httpx+manual
    PatchedAIStrategyConfigRequest:
      type: object
      description: AI策略配置序列化器
      properties:
        strategy:
          type: integer
          title: 所属策略
        prompt_template:
          type: integer
          nullable: true
          title: Prompt模板
        chain_config:
          type: integer
          nullable: true
          title: 链配置
        ai_provider:
          type: integer
          nullable: true
          title: AI服务商
        temperature:
          type: number
          format: double
          maximum: 2.0
          minimum: 0.0
          title: 温度参数
        max_tokens:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          title: 最大Token数
        approval_mode:
          allOf:
          - $ref: '#/components/schemas/ApprovalModeEnum'
          title: 审核模式
        confidence_threshold:
          type: number
          format: double
          maximum: 1.0
          minimum: 0.0
          title: 自动执行置信度阈值
          description: 置信度高于此值时自动执行
    PatchedAdminProviderCreateRequest:
      type: object
      description: Admin serializer for system provider create/update.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        provider_type:
          $ref: '#/components/schemas/ProviderTypeEnum'
        is_active:
          type: boolean
          default: true
        priority:
          type: integer
          minimum: 1
          default: 10
        base_url:
          type: string
          format: uri
          minLength: 1
        api_key:
          type: string
        default_model:
          type: string
          minLength: 1
          default: gpt-3.5-turbo
        api_mode:
          allOf:
          - $ref: '#/components/schemas/ApiModeEnum'
          default: dual
        fallback_enabled:
          type: boolean
          default: true
        daily_budget_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        monthly_budget_limit:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        extra_config: {}
        description:
          type: string
          default: ''
    PatchedAgentTaskRequest:
      type: object
      description: |-
        Serializer for AgentTaskModel - full task detail output.

        Includes all fields with display values for enums.
      properties:
        task_domain:
          allOf:
          - $ref: '#/components/schemas/AgentTaskDomainEnum'
          description: |-
            Task domain: research/monitoring/decision/execution/ops

            * `research` - RESEARCH
            * `monitoring` - MONITORING
            * `decision` - DECISION
            * `execution` - EXECUTION
            * `ops` - OPS
        task_type:
          type: string
          minLength: 1
          description: Task subtype
          maxLength: 100
        status:
          allOf:
          - $ref: '#/components/schemas/AgentTaskStatusEnum'
          description: |-
            Current task status

            * `draft` - DRAFT
            * `context_ready` - CONTEXT_READY
            * `proposal_generated` - PROPOSAL_GENERATED
            * `awaiting_approval` - AWAITING_APPROVAL
            * `approved` - APPROVED
            * `rejected` - REJECTED
            * `executing` - EXECUTING
            * `completed` - COMPLETED
            * `failed` - FAILED
            * `needs_human` - NEEDS_HUMAN
            * `cancelled` - CANCELLED
        input_payload:
          description: JSON input payload
        current_step:
          type: string
          nullable: true
          description: Current step key
          maxLength: 100
        last_error:
          nullable: true
          description: Structured error payload
