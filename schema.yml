  securitySchemes:
    agomInternalSignature:
      type: apiKey
      in: header
      name: X-Agom-Internal-Signature
      description: HMAC-SHA256 internal signature. Signed calls must also provide
        X-Agom-Internal-Timestamp, X-Agom-Internal-User-Id, and may provide X-Agom-Internal-Username.
    auditIngestTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Agom user access token using the `Token <value>` format.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    realtimeTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Agom access token using the `Token <value>` authorization format.
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
