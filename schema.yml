  /api/account/admin/mcp/users/{user_id}/toggle/:
    post:
      operationId: api_account_admin_mcp_users_by_user_id_toggle_post
      description: Admin toggles MCP permission for one target user.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/account/admin/mcp/users/{user_id}/tokens/:
    post:
      operationId: api_account_admin_mcp_users_by_user_id_tokens_post
      description: Admin creates one MCP token for a target user.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/account/admin/mcp/users/{user_id}/tokens/revoke/:
    post:
      operationId: api_account_admin_mcp_users_by_user_id_tokens_revoke_post
      description: Admin revokes all active MCP tokens for one target user.
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/account/admin/users/:
    get:
      operationId: api_account_admin_users_get
      description: List user approval and role state for administrators.
      tags:
      - account
      security:
      - cookieAuth: []
      - agomInternalSignature: []
      - tokenAuth: []
      responses:
        '200':
          description: No response body
  /api/account/admin/users/{user_id}/approve/:
