name: Nightly Tests

on:
  schedule:
    - cron: '0 2 * * *'  # UTC 02:00 (北京时间 10:00)
  workflow_dispatch:  # 允许手动触发

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
            pip install pytest pytest-cov pytest-xdist pytest-base-url pytest-playwright pytest-django
          fi
          pip install -e sdk/
          python -m playwright install chromium

      - name: Prepare database
        run: python manage.py migrate --noinput

      - name: Run Unit Tests (full)
        timeout-minutes: 25
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest tests/unit/ -q \
            -o faulthandler_timeout=600 \
            --timeout=300 \
            --timeout-method=thread \
            --durations=20 \
            --cov=apps \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov-unit

      - name: Run API And Migration Tests
        timeout-minutes: 20
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest tests/api/ tests/migrations/ -v \
            -o faulthandler_timeout=180 \
            --timeout=120 \
            --timeout-method=thread \
            --durations=20 \
            --cov=apps \
            --cov-append \
            --cov-report=term-missing

      - name: Run Integration Tests (core)
        timeout-minutes: 45
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest tests/integration/ -v \
            -m "not live_required and not optional_runtime and not diagnostic" \
            -o faulthandler_timeout=900 \
            --timeout=600 \
            --timeout-method=thread \
            --durations=30 \
            --cov=apps \
            --cov-append \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing

      - name: Run App-Local Module Tests
        timeout-minutes: 25
        run: |
          python -m pytest apps/*/tests -v \
            --cov=apps \
            --cov-append \
            --cov-report=term-missing

      - name: Run Guardrail Tests
        # Guardrails exercise database-backed API paths and can exceed 15 minutes
        # on a cold shared runner when coverage from earlier suites is appended.
        timeout-minutes: 30
        run: |
          python -m pytest tests/guardrails/ -v \
            --cov=apps \
            --cov-append \
            --cov-report=xml:coverage-guardrail.xml

      - name: Generate Architecture Audit Report
        run: |
          python scripts/verify_architecture.py \
            --rules-file governance/architecture_rules.json \
            --format text \
            --include-audit \
            --write-report reports/architecture/nightly-architecture-audit.json \
            --write-ledger reports/architecture/nightly-module-ledger.md

      - name: Run Playwright Smoke Tests
        timeout-minutes: 15
        run: |
          python scripts/run_live_server_pytest.py \
            --suite-name nightly-playwright-smoke \
            --host 127.0.0.1 \
            --port 8000 \
            --base-url http://127.0.0.1:8000 \
            --settings-module core.settings.development_sqlite \
            --health-timeout 180 \
            --min-tests 10 \
            --junitxml reports/quality/nightly-playwright-smoke.xml \
            --server-log reports/quality/nightly-playwright-smoke.server.log \
            --pytest-log reports/quality/nightly-playwright-smoke.pytest.log \
            -- \
            tests/playwright/tests/smoke/ -v \
            --screenshot=only-on-failure \
            --video=retain-on-failure
        env:
          DJANGO_SETTINGS_MODULE: core.settings.development
          PYTEST_PLAYWRIGHT_DRIVER: chromium

      - name: Full lint fallback (non-blocking)
        continue-on-error: true
        run: |
          STATUS=0
          python -m ruff check apps/ core/ shared/ || STATUS=1
          python -m black --check apps/ core/ shared/ || STATUS=1
          python -m isort --check-only apps/ core/ shared/ || STATUS=1
          if [ "${STATUS}" -ne 0 ]; then
            echo "::warning::Full lint fallback detected style issues (ruff/black/isort); observe-only, not blocking the pipeline."
            exit 1
          fi

      - name: Generate Quality Report
        run: |
          python scripts/generate_quality_report.py --type nightly --output reports/quality

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage-*.xml
            htmlcov-*/

      - name: Upload Quality Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quality-report
          path: reports/quality/

      - name: Upload Architecture Audit Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: architecture-audit-report
          path: reports/architecture/

      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-artifacts
          path: |
            tests/playwright/test-results/
            tests/playwright/screenshots/
            reports/quality/nightly-playwright-smoke.xml
            reports/quality/nightly-playwright-smoke.server.log
            reports/quality/nightly-playwright-smoke.pytest.log

      - name: Create or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly regression failed: ${context.workflow}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The nightly regression workflow failed.',
              '',
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Ref: ${context.ref}`,
              `- Commit: ${context.sha}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info('Created new nightly failure issue');
            }
