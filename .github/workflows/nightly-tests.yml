name: Nightly Tests

on:
  workflow_call:
  schedule:
    - cron: '0 2 * * *'  # UTC 02:00 (北京时间 10:00)
  workflow_dispatch:  # 允许手动触发

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare pytest temp parent
        run: mkdir -p .tmp

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
            pip install pytest pytest-cov pytest-xdist pytest-base-url pytest-playwright pytest-django
          fi
          pip install -e sdk/
          python -m playwright install chromium
          npm ci
          # The Node contract suite is pinned by package-lock.json and needs
          # its own Playwright browser revision. The Python install above can
          # resolve a newer revision for the Django smoke suite.
          npx playwright install --with-deps chromium

      - name: Prepare database
        run: python manage.py migrate --noinput

      - name: Run registered current-data contract nodeids
        id: current_data
        run: |
          python scripts/run_current_data_contract_tests.py \
            --pytest-arg=-q \
            --pytest-arg=--reuse-db \
            --pytest-arg=--timeout=300

      - name: Run registered Celery task contract nodeids
        id: celery
        run: |
          python scripts/run_celery_task_contract_tests.py \
            --pytest-arg=-q \
            --pytest-arg=--reuse-db \
            --pytest-arg=--no-migrations \
            --pytest-arg=--timeout=300

      - name: Enforce full-production mypy debt ceiling
        run: python scripts/check_mypy_debt_ceiling.py

      - name: Run frontend Node contract tests
        id: frontend
        run: |
          mkdir -p reports/quality
          npm run test:tui-js:ci

      - name: Run Unit Tests (full)
        id: unit
        timeout-minutes: 35
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euo pipefail
          [[ "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ && "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]
          hook_dir="$(mktemp -d "${RUNNER_TEMP:?}/nightly-unit-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.XXXXXX")"
          plugin_module="agom_nightly_unit_lifecycle_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          case "$hook_dir" in
            "${RUNNER_TEMP%/}"/nightly-unit-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.*) ;;
            *) echo "Refusing unexpected lifecycle hook directory" >&2; exit 2 ;;
          esac
          mkdir -p reports/quality
          export PYTHONPATH="$hook_dir${PYTHONPATH:+:$PYTHONPATH}"
          export AGOM_NIGHTLY_UNIT_LIFECYCLE_LOG="$GITHUB_WORKSPACE/reports/quality/nightly-fullunit-lifecycle.jsonl"
          cleanup_lifecycle_hook() {
            case "${hook_dir:-}" in
              "${RUNNER_TEMP%/}"/nightly-unit-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.*) rm -rf -- "$hook_dir" ;;
              *) echo "Refusing to remove unexpected lifecycle hook directory" >&2 ;;
            esac
          }
          trap cleanup_lifecycle_hook EXIT
          cat > "$hook_dir/${plugin_module}.py" <<'PYTEST_PLUGIN'
          """CI-only breadcrumbs for the last pytest lifecycle phase."""
          from __future__ import annotations

          import json
          import os
          import sys
          import time
          from collections.abc import Generator
          from datetime import datetime, timezone
          from typing import TextIO

          import pytest

          _stream: TextIO | None = None
          _warned = False


          def _warn_log_unavailable(exc: OSError) -> None:
              global _warned
              if _warned:
                  return
              _warned = True
              try:
                  print(f"nightly lifecycle log unavailable: {type(exc).__name__}", file=sys.stderr)
              except OSError:
                  return


          def _record(event: str, **fields: object) -> None:
              if _stream is None:
                  return
              row: dict[str, object] = {
                  "event": event,
                  "utc": datetime.now(timezone.utc).isoformat(timespec="milliseconds"),
                  "monotonic_ns": time.monotonic_ns(),
              }
              row.update(fields)
              try:
                  _stream.write(json.dumps(row, ensure_ascii=True, separators=(",", ":")) + "\n")
                  _stream.flush()
              except OSError as exc:
                  _warn_log_unavailable(exc)


          def pytest_configure(config: pytest.Config) -> None:
              global _stream
              path = os.environ.get("AGOM_NIGHTLY_UNIT_LIFECYCLE_LOG")
              if not path:
                  return
              try:
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  _stream = open(path, "w", encoding="utf-8", buffering=1)
              except OSError as exc:
                  _warn_log_unavailable(exc)
                  return
              _record("pytest_configure", pid=os.getpid(), pytest_version=pytest.__version__)


          def pytest_sessionstart(session: pytest.Session) -> None:
              _record("pytest_sessionstart")


          def pytest_collection_finish(session: pytest.Session) -> None:
              _record("pytest_collection_finish", item_count=len(session.items))


          def _phase(name: str, item: pytest.Item) -> Generator[object, object, None]:
              nodeid = item.nodeid[:1200]
              fields = {"phase": name, "nodeid": nodeid}
              _record("phase_enter", **fields)
              outcome = yield
              _record("phase_exit", **fields, failed=outcome.excinfo is not None)


          @pytest.hookimpl(hookwrapper=True, tryfirst=True)
          def pytest_runtest_setup(item: pytest.Item) -> Generator[object, object, None]:
              yield from _phase("setup", item)


          @pytest.hookimpl(hookwrapper=True, tryfirst=True)
          def pytest_runtest_call(item: pytest.Item) -> Generator[object, object, None]:
              yield from _phase("call", item)


          @pytest.hookimpl(hookwrapper=True, tryfirst=True)
          def pytest_runtest_teardown(item: pytest.Item) -> Generator[object, object, None]:
              yield from _phase("teardown", item)


          def _ending(event: str, **fields: object) -> Generator[object, object, None]:
              _record(f"{event}_enter", **fields)
              outcome = yield
              _record(f"{event}_exit", failed=outcome.excinfo is not None)


          @pytest.hookimpl(hookwrapper=True, tryfirst=True)
          def pytest_sessionfinish(session: pytest.Session, exitstatus: int) -> Generator[object, object, None]:
              yield from _ending("sessionfinish", exitstatus=int(exitstatus))


          @pytest.hookimpl(hookwrapper=True, tryfirst=True)
          def pytest_terminal_summary(terminalreporter: object, exitstatus: int, config: pytest.Config) -> Generator[object, object, None]:
              yield from _ending("terminal_summary", exitstatus=int(exitstatus))


          def pytest_unconfigure(config: pytest.Config) -> None:
              global _stream
              _record("pytest_unconfigure")
              if _stream is not None:
                  try:
                      _stream.close()
                  except OSError:
                      pass
                  _stream = None
          PYTEST_PLUGIN
          if python -m pytest -p "$plugin_module" tests/unit/ -vv -ra \
            -o faulthandler_timeout=30 \
            --timeout=300 \
            --timeout-method=thread \
            --durations=20 \
            --cov \
            --cov-config=.coveragerc \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --cov-report=html:htmlcov-unit; then
            pytest_status=0
          else
            pytest_status=$?
          fi
          exit "$pytest_status"

      - name: Verify test-tier inventory
        run: python scripts/test_tier_inventory.py --check

      - name: Run Component Tests
        id: component
        timeout-minutes: 25
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest tests/component/ -q -ra \
            --timeout=300 \
            --timeout-method=thread \
            --durations=20 \
            --cov \
            --cov-config=.coveragerc \
            --cov-append \
            --cov-report=term-missing

      - name: Run API And Migration Tests
        id: api_migrations
        timeout-minutes: 35
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest tests/api/ tests/migrations/ -v -ra \
            -o faulthandler_timeout=180 \
            --timeout=300 \
            --timeout-method=thread \
            --durations=20 \
            --cov \
            --cov-config=.coveragerc \
            --cov-append \
            --cov-report=term-missing

      - name: Run Critical Reliability (SQLite + Fake Agent)
        id: critical_sqlite
        timeout-minutes: 15
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest tests/critical/ -v -ra \
            --timeout=300 \
            --timeout-method=thread \
            --durations=20 \
            --cov \
            --cov-config=.coveragerc \
            --cov-append \
            --cov-report=term-missing

      - name: Run Integration Tests (core)
        id: integration
        timeout-minutes: 45
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -m pytest tests/integration/ -v -ra \
            -m "not live_required and not optional_runtime and not diagnostic" \
            -o faulthandler_timeout=900 \
            --timeout=600 \
            --timeout-method=thread \
            --durations=30 \
            --cov \
            --cov-config=.coveragerc \
            --cov-append \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing

      - name: Run App-Local Module Tests
        id: app_local
        timeout-minutes: 25
        run: |
          python -m pytest apps/*/tests -v -ra \
            --cov \
            --cov-config=.coveragerc \
            --cov-append \
            --cov-report=term-missing

      - name: Run SDK client tests
        id: sdk
        timeout-minutes: 10
        run: |
          python -m pytest sdk/tests/test_sdk/ -v -ra \
            -n auto \
            --dist=load \
            --timeout=180 \
            --timeout-method=thread \
            --cov \
            --cov-config=.coveragerc \
            --cov-append \
            --cov-report=term-missing

      - name: Run MCP contract tests
        id: mcp
        timeout-minutes: 45
        run: |
          python -m pytest sdk/tests/test_mcp/ -v -ra \
            -n 8 \
            --dist=load \
            --timeout=180 \
            --timeout-method=thread \
            --cov \
            --cov-config=.coveragerc \
            --cov-append \
            --cov-report=term-missing

      - name: Run Django E2E tests
        id: e2e
        timeout-minutes: 20
        run: |
          python -m pytest tests/e2e/ -v -ra \
            -m "not live_required and not optional_runtime and not diagnostic" \
            --timeout=180 \
            --timeout-method=thread \
            --cov \
            --cov-config=.coveragerc \
            --cov-append \
            --cov-report=term-missing

      - name: Run Guardrail Tests
        id: guardrails
        # Guardrails exercise database-backed API paths and can exceed 15 minutes
        # on a cold shared runner when coverage from earlier suites is appended.
        timeout-minutes: 30
        run: |
          python -m pytest tests/guardrails/ -v -ra \
            --cov \
            --cov-config=.coveragerc \
            --cov-append \
            --cov-report=xml:coverage-guardrail.xml

      - name: Build final coverage report and enforce ratchet
        id: coverage_gate
        run: |
          python -m coverage report
          python scripts/generate_coverage_reports.py --check

      - name: Generate Architecture Audit Report
        run: |
          python scripts/verify_architecture.py \
            --rules-file governance/architecture_rules.json \
            --format text \
            --include-audit \
            --write-report reports/architecture/nightly-architecture-audit.json \
            --write-ledger reports/architecture/nightly-module-ledger.md

      - name: Run Playwright Smoke Tests
        id: playwright_smoke
        timeout-minutes: 15
        env:
          AGOM_PLAYWRIGHT_DB_PATH: ${{ runner.temp }}/agomtradepro-nightly-playwright.sqlite3
          DJANGO_SETTINGS_MODULE: core.settings.playwright
          PYTEST_PLAYWRIGHT_DRIVER: chromium
        run: |
          rm -f "${AGOM_PLAYWRIGHT_DB_PATH}"
          python manage.py migrate --noinput --settings=core.settings.playwright
          python scripts/run_live_server_pytest.py \
            --suite-name nightly-playwright-smoke \
            --host 127.0.0.1 \
            --port 8000 \
            --base-url http://127.0.0.1:8000 \
            --settings-module core.settings.playwright \
            --health-timeout 180 \
            --min-tests 10 \
            --junitxml reports/quality/nightly-playwright-smoke.xml \
            --server-log reports/quality/nightly-playwright-smoke.server.log \
            --pytest-log reports/quality/nightly-playwright-smoke.pytest.log \
            -- \
            tests/playwright/tests/smoke/ -v \
            --reuse-db \
            --screenshot=only-on-failure \
            --video=retain-on-failure

      - name: Full lint fallback (non-blocking)
        id: full_lint
        continue-on-error: true
        run: |
          STATUS=0
          python -m ruff check apps/ core/ shared/ || STATUS=1
          python -m black --check apps/ core/ shared/ || STATUS=1
          python -m isort --check-only apps/ core/ shared/ || STATUS=1
          if [ "${STATUS}" -ne 0 ]; then
            echo "::warning::Full lint fallback detected style issues (ruff/black/isort); observe-only, not blocking the pipeline."
            exit 1
          fi

      - name: Generate Quality Report
        if: always()
        env:
          CI_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python scripts/generate_quality_report.py --type nightly --output reports/quality

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage-*.xml
            htmlcov-*/
            reports/quality/coverage-*.xml
            reports/quality/coverage-*.json
            reports/quality/coverage-manifest.json
            reports/quality/frontend-node-tests.xml

      - name: Upload Quality Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: quality-report
          path: reports/quality/

      - name: Upload Architecture Audit Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: architecture-audit-report
          path: reports/architecture/

      - name: Upload Playwright Artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-artifacts
          path: |
            tests/playwright/test-results/
            tests/playwright/screenshots/
            reports/quality/nightly-playwright-smoke.xml
            reports/quality/nightly-playwright-smoke.server.log
            reports/quality/nightly-playwright-smoke.pytest.log

      - name: Create or update failure issue
        if: failure() && github.workflow == 'Nightly Tests'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly regression failed: ${context.workflow}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The nightly regression workflow failed.',
              '',
              `- Workflow: ${context.workflow}`,
              `- Run: ${runUrl}`,
              `- Ref: ${context.ref}`,
              `- Commit: ${context.sha}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info('Created new nightly failure issue');
            }

  critical-postgres:
    name: Critical Reliability (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agomtradepro_critical
          POSTGRES_USER: agomtradepro
          POSTGRES_PASSWORD: critical-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agomtradepro -d agomtradepro_critical"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://agomtradepro:critical-test-password@127.0.0.1:5432/agomtradepro_critical
      DJANGO_SETTINGS_MODULE: core.settings.development
      SECRET_KEY: nightly-critical-postgres-secret-key-12345678901234567890
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare pytest temp parent
        run: mkdir -p .tmp

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e sdk/

      - name: Record PostgreSQL runtime versions
        run: |
          mkdir -p reports/quality/postgres
          {
            python --version
            psql --version
            psql "$DATABASE_URL" --tuples-only --no-align --command="SELECT version();"
          } > reports/quality/postgres/runtime-versions.txt

      - name: Apply full migration graph to empty PostgreSQL database
        run: python manage.py migrate --noinput

      - name: Record applied migration plan
        run: python manage.py showmigrations --plan > reports/quality/postgres/migration-plan.txt

      - name: Verify complete PostgreSQL migration graph
        run: python scripts/check_migration_graph.py

      - name: Initialize and verify runtime Data Center catalog
        run: |
          python manage.py initialize_data_center_catalog
          python scripts/check_data_center_runtime_catalog.py

      - name: Record PostgreSQL storage capacity observation
        run: |
          python manage.py initialize_storage_budget \
            --profile-key nightly-ci \
            --capacity-gib 100 \
            --policy-version 1 \
            --activate
          python manage.py collect_storage_capacity_profile --environment nightly-ci

      - name: Create application-owned custom PostgreSQL backup
        run: |
          mkdir -p reports/quality/postgres-backup-restore
          python manage.py backup_database \
            --output reports/quality/postgres-backup-restore \
            --keep 1 \
            --compress

      - name: Restore backup in isolation and compare exact PostgreSQL state
        run: |
          python scripts/verify_postgres_backup_restore.py \
            --dump-path reports/quality/postgres-backup-restore/postgres-current.dump \
            --report-path reports/quality/postgres-backup-restore/evidence.json

      - name: Prepare pre-migrated PostgreSQL test database
        env:
          PGPASSWORD: critical-test-password
        run: |
          psql --host=127.0.0.1 --port=5432 --username=agomtradepro --dbname=postgres \
            -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS test_agomtradepro_critical WITH (FORCE);" \
            -c "CREATE DATABASE test_agomtradepro_critical TEMPLATE agomtradepro_critical;"

      - name: Run PostgreSQL critical reliability tests
        env:
          PYTHONFAULTHANDLER: "1"
          DJANGO_SETTINGS_MODULE: core.settings.critical_postgres_test
          AGOM_CRITICAL_TEST_DB_NAME: test_agomtradepro_critical
        run: |
          python -m pytest tests/critical/ -v \
            --reuse-db \
            --no-migrations \
            --junitxml=reports/quality/postgres/critical.xml \
            --timeout=180 \
            --timeout-method=thread \
            --durations=20

      - name: Run PostgreSQL migration integrity tests
        env:
          DJANGO_SETTINGS_MODULE: core.settings.critical_postgres_test
          AGOM_CRITICAL_TEST_DB_NAME: test_agomtradepro_critical
        run: |
          python -m pytest \
            tests/migrations/test_research_integrity_migrations.py \
            tests/migrations/test_data_center_retention_plan_migration.py \
            tests/migrations/test_config_center_decision_state_materialization.py \
            tests/migrations/test_config_center_qlib_runtime_materialization.py \
            tests/migrations/test_config_center_runtime_retirement_materialization.py \
            -v \
            --reuse-db \
            --junitxml=reports/quality/postgres/research-migrations.xml \
            --timeout=900 \
            --timeout-method=thread \
            --durations=20

      - name: Run canonical publication and runtime-profile evidence on PostgreSQL
        run: |
          python -m pytest \
            tests/unit/data_center/test_published_query_ports.py \
            tests/unit/data_center/test_reconciliation_and_query_budget.py \
            tests/unit/config_center/test_runtime_config_control_plane.py \
            -q --reuse-db --no-migrations --timeout=180 \
            --junitxml=reports/quality/postgres/publication-runtime.xml

      - name: Install Python browser runtime for current-data contracts
        run: python -m playwright install --with-deps chromium

      - name: Run full-registry transaction cleanup regressions on PostgreSQL
        timeout-minutes: 10
        env:
          PYTHONFAULTHANDLER: "1"
          DJANGO_SETTINGS_MODULE: core.settings.critical_postgres_test
          AGOM_CRITICAL_TEST_DB_NAME: test_agomtradepro_critical_aud05_flush
          AGOM_AUD05_PG_CONCURRENCY_EVIDENCE: "1"
        run: |
          python -m pytest \
            tests/component/data_center/test_audited_price_sync_transaction.py \
            tests/component/data_center/test_audited_macro_sync_transaction.py \
            tests/component/config_center/test_aud05_atomic_activation.py \
            tests/component/data_center/test_audited_quote_sync_transaction.py \
            tests/component/data_center/test_current_publication_staging.py \
            tests/component/data_center/test_financial_source_time_audit_claim.py \
            -q --create-db --reuse-db --maxfail=1 \
            --timeout=300 --timeout-method=thread --durations=20 \
            -o faulthandler_timeout=30 \
            --junitxml=reports/quality/postgres/authority-generation-flush.xml
          python - <<'PY'
          import collections
          import json
          import xml.etree.ElementTree as ET

          root = ET.parse("reports/quality/postgres/authority-generation-flush.xml").getroot()
          cases = list(root.iter("testcase"))
          expected = {
              "tests.component.data_center.test_audited_price_sync_transaction": 5,
              "tests.component.data_center.test_audited_macro_sync_transaction": 3,
              "tests.component.config_center.test_aud05_atomic_activation": 18,
              "tests.component.data_center.test_audited_quote_sync_transaction": 3,
              "tests.component.data_center.test_current_publication_staging": 24,
              "tests.component.data_center.test_financial_source_time_audit_claim": 2,
          }
          assert len(cases) == 55
          assert collections.Counter(case.attrib["classname"] for case in cases) == expected
          assert not any(case.find(tag) is not None for case in cases for tag in ("failure", "error", "skipped"))
          properties = [
              json.loads(prop.attrib["value"])
              for prop in root.iter("property")
              if prop.attrib.get("name") == "authority_generation_flushes"
          ]
          assert len(properties) == 6 and all(isinstance(rows, list) and rows for rows in properties)
          assert sum(map(len, properties)) == 55
          for rows in properties:
              for pair in rows:
                  assert isinstance(pair, list) and len(pair) == 2
                  assert all(isinstance(value, int) and not isinstance(value, bool) for value in pair)
                  assert 0 <= pair[0] <= pair[1]
          for name in (
              "test_postgresql_bootstrap_race_has_one_first_winner",
              "test_postgresql_successor_race_has_one_first_winner",
          ):
              assert sum(case.attrib["name"] == name for case in cases) == 1
          print("Full-registry PG cleanup: 55 passed, 55 observed flushes, two native AUD05 races")
          PY

      - name: Run current-data contract manifest on PostgreSQL
        env:
          DJANGO_SETTINGS_MODULE: core.settings.critical_postgres_test
          AGOM_CRITICAL_TEST_DB_NAME: test_agomtradepro_critical_aud05
          AGOM_AUD05_PG_CONCURRENCY_EVIDENCE: "1"
        run: |
          python scripts/run_current_data_contract_tests.py \
            --pytest-arg=--create-db \
            --pytest-arg=--reuse-db \
            --pytest-arg=--disable-warnings \
            --pytest-arg=--junitxml=reports/quality/postgres/current-data.xml \
            --pytest-arg=--maxfail=1

      - name: Run Celery task contract manifest on PostgreSQL
        run: |
          python scripts/run_celery_task_contract_tests.py \
            --pytest-arg=--reuse-db \
            --pytest-arg=--no-migrations \
            --pytest-arg=--disable-warnings \
            --pytest-arg=--junitxml=reports/quality/postgres/celery-contracts.xml \
            --pytest-arg=--maxfail=1

      - name: Run backfill coverage and retention control-plane evidence on PostgreSQL
        run: |
          python -m pytest \
            tests/unit/data_center/test_core_data_backfill_task.py \
            tests/component/data_center/test_core_data_backfill_control_plane.py \
            tests/component/data_center/test_repositories.py \
            tests/unit/data_center/test_retention_tasks.py \
            tests/unit/data_center/test_raw_landing.py \
            tests/unit/data_center/test_retention_control_plane.py \
            -q -k "diagnostic or backfill or retention or raw_landing" \
            --reuse-db --no-migrations --timeout=240 \
            --junitxml=reports/quality/postgres/backfill-retention.xml

      - name: Run PostgreSQL retention and Qlib admission concurrency evidence
        run: |
          python -m pytest \
            tests/component/data_center/test_retention_postgres_concurrency.py \
            tests/component/config_center/test_qlib_training_run_lock.py \
            -q --reuse-db --timeout=300 \
            --junitxml=reports/quality/postgres/retention-concurrency.xml

      - name: Upload PostgreSQL backup and restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-postgres-backup-restore-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            reports/quality/postgres-backup-restore/evidence.json
            reports/quality/postgres/
