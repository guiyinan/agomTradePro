name: Consistency Check

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main, 'dev/**']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run consistency check
        run: |
          python scripts/check_doc_route_sdk_consistency.py --baseline reports/consistency/baseline.json

      - name: Run route consistency check
        run: |
          python scripts/check_routes.py --strict

      - name: Enforce Web-to-TUI template freeze
        run: |
          python scripts/web_template_migration_inventory.py --check
          python scripts/check_web_to_tui_cleanup_guard.py

      - name: Check Web-to-TUI telemetry catalog
        run: |
          python scripts/build_web_to_tui_telemetry_catalog.py --check
          python scripts/check_web_to_tui_cutover_readiness.py

      - name: Run TUI static contract check
        run: |
          python scripts/check_tui_static_contracts.py

      - name: Check TUI metadata source consistency
        run: |
          python scripts/check_tui_metadata_source_consistency.py

      - name: Enforce current-data freshness contracts
        run: |
          python scripts/check_current_data_contracts.py

      - name: Enforce system audit event contracts
        run: python scripts/check_audit_event_contracts.py

      - name: Enforce active plan registry
        run: python scripts/check_active_plan_registry.py

      - name: Enforce reliability contract ownership
        run: python scripts/check_reliability_contract_ownership.py

      - name: Enforce deterministic Data Center architecture inventory
        run: python scripts/data_center_architecture_inventory.py

      - name: Enforce complete Data Center entrypoint inventory
        run: python scripts/data_center_entrypoint_inventory.py

      - name: Enforce Data Center provider credential boundary
        run: python scripts/check_data_center_provider_credentials.py

      - name: Enforce Data Center legacy script entrypoints
        run: python scripts/check_data_center_legacy_entrypoints.py

      - name: Enforce backup delivery secret ownership
        run: python scripts/check_backup_delivery_secret_ownership.py

      - name: Enforce Qlib runtime entrypoint inventory
        run: python scripts/check_qlib_runtime_entrypoints.py

      - name: Enforce business configuration contracts
        run: |
          python scripts/check_business_configuration_hardcodes.py --mode full

      - name: Enforce decision write surface freeze
        run: python scripts/check_decision_write_surface_freeze.py

      - name: Enforce Broker live-order Evidence hard gate
        run: python scripts/check_broker_live_order_evidence_gate.py

      - name: Enforce Evidence output surface inventory
        run: python scripts/check_evidence_output_surfaces.py

      - name: Run governance consistency check
        run: |
          python scripts/check_governance_consistency.py \
            --baseline governance/governance_baseline.json \
            --write-report reports/consistency/governance-consistency.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: consistency-check-results
          path: reports/consistency/
          retention-days: 30

  mcp-governance-guards:
    name: MCP governance guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-mcp-governance-secret-key-123456789012345678901234567890
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Check dependency projections
        run: python scripts/sync_dependency_projections.py --check

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install -e sdk/

      - name: Run MCP top-level budget guard
        run: python scripts/check_mcp_tool_budget.py

      - name: Run MCP manifest schema guard
        run: python scripts/check_mcp_manifest_schema.py

      - name: Run MCP raw tool surface guard
        run: python scripts/check_mcp_no_raw_tools.py

      - name: Run MCP catalog dedup guard
        run: python scripts/check_mcp_catalog_dedup.py

      - name: Run MCP published TUI action coverage guard
        run: python scripts/check_mcp_tui_action_coverage.py

      - name: Run MCP read evidence guard
        run: python scripts/check_mcp_read_evidence.py

      - name: Run MCP Evidence output semantic freeze
        run: python scripts/check_mcp_evidence_output_surfaces.py

      - name: Run MCP write confirmation guard
        run: python scripts/check_mcp_write_confirmation.py

      - name: Run MCP write evidence guard
        run: python scripts/check_mcp_write_evidence.py

      - name: Run MCP write preview guard
        run: python scripts/check_mcp_write_preview.py

      - name: Run MCP write audit guard
        run: python scripts/check_mcp_write_audit.py
