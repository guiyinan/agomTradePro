      - name: Reject missing or skipped PostgreSQL evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          from scripts.validate_release_rehearsal import REQUIRED_POSTGRESQL_TESTS

          junit_files = (
              'publication-postgres.xml',
              'authority-lock-postgres.xml',
              'account-authority-generation-postgres.xml',
              'account-authority-shadow-postgres.xml',
              'account-authority-final-revalidation-postgres.xml',
              'account-research-authority-postgres.xml',
              'backfill-control-plane-postgres.xml',
              'financial-capacity-postgres.xml',
              'financial-slice-sync-contracts.xml',
              'ai-provider-plaintext-removal-postgres.xml',
              'ash05-lease-postgres.xml',
              'ash05-cash-posting-postgres.xml',
          )
          cases = []
          for filename in junit_files:
              path = Path(filename)
              assert path.is_file() and path.stat().st_size > 0, (
                  f'Missing or empty PostgreSQL evidence: {filename}'
              )
              file_cases = ElementTree.parse(path).findall('.//testcase')
              assert file_cases, f'PostgreSQL evidence has no testcases: {filename}'
              cases.extend(file_cases)

          assert all(
              case.find('skipped') is None for case in cases
          ), 'PostgreSQL cases must execute'
          assert all(
              case.find('failure') is None and case.find('error') is None
              for case in cases
          )

          observed_tests = {
              f"{(case.get('classname') or '').strip()}::{(case.get('name') or '').strip()}"
              for case in cases
          }
          missing_tests = set(REQUIRED_POSTGRESQL_TESTS) - observed_tests
          assert not missing_tests, (
              f'Missing required PostgreSQL test identities: {sorted(missing_tests)}'
          )

          with open('sqlite-snapshot-rehearsal-report.json', encoding='utf-8') as handle:
              snapshot_report = json.load(handle)
          assert snapshot_report['outcome'] == 'success'
          assert snapshot_report['fixture_row_count'] == snapshot_report['source_serialized_row_count']
          assert snapshot_report['source_row_count'] > 0
          assert snapshot_report['mismatches'] == {}
          PY
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-postgres-evidence
          path: |
            publication-postgres.xml
            authority-lock-postgres.xml
            account-authority-generation-postgres.xml
            account-authority-shadow-postgres.xml
            account-authority-final-revalidation-postgres.xml
            account-research-authority-postgres.xml
            backfill-control-plane-postgres.xml
            financial-capacity-postgres.xml
            financial-slice-sync-contracts.xml
            ai-provider-plaintext-removal-postgres.xml
            ash05-lease-postgres.xml
            ash05-cash-posting-postgres.xml
            role-bootstrap-postgres.log
            statement-logging-guard.log
            statement-logging-window.log
            sqlite-source-counts.json
            postgres-target-counts.json
            sqlite-snapshot-rehearsal-report.json
          if-no-files-found: error
