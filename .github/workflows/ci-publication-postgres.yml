name: Publication PostgreSQL contracts

on:
  workflow_call:
  pull_request:
    branches: [main, 'dev/**']
    paths:
      - 'apps/data_center/**'
      - 'apps/ai_provider/migrations/**'
      - 'apps/ai_provider/infrastructure/models.py'
      - 'apps/account/**'
      - 'apps/audit/**'
      - 'apps/simulated_trading/**'
      - 'tests/component/simulated_trading/test_transition_plan_execution_native.py'
      - 'tests/component/simulated_trading/test_corporate_action_posting_postgres.py'
      - 'tests/component/simulated_trading/test_owner_granted_corporate_action_postgres.py'
      - 'tests/component/simulated_trading/test_corporate_action_tax_assessment_postgres.py'
      - 'tests/component/simulated_trading/test_current_simulated_tax_qualification_postgres.py'
      - 'tests/support/simulated_tax_model_native_sources.py'
      - 'tests/support/simulated_tax_model_native_account.py'
      - 'tests/component/account/**'
      - 'tests/component/data_center/**'
      - 'tests/component/test_ai_provider_plaintext_removal_migration.py'
      - 'tests/component/config_center/test_aud05_atomic_activation.py'
      - 'tests/support/account_authority_generation_flush.py'
      - 'tests/unit/ci/test_publication_postgres_workflow.py'
      - 'core/settings/critical_postgres_test.py'
      - '.github/workflows/nightly-tests.yml'
      - 'tests/settings_data_center_sync_identity.py'
      - 'scripts/check_postgres_role_contract.py'
      - 'scripts/manage_vps_migrations.py'
      - 'scripts/bootstrap_vps_postgres_roles.sh'
      - 'scripts/migrate-vps-sqlite-to-postgres.sh'
      - 'scripts/postgres_statement_logging_window.sh'
      - 'scripts/postgres_role_bootstrap.sql'
      - 'scripts/sqlite_snapshot_contract.py'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - '.github/workflows/ci-publication-postgres.yml'
  push:
    branches: [main, 'dev/**']
    paths:
      - 'apps/data_center/**'
      - 'apps/ai_provider/migrations/**'
      - 'apps/ai_provider/infrastructure/models.py'
      - 'apps/account/**'
      - 'apps/audit/**'
      - 'apps/simulated_trading/**'
      - 'tests/component/simulated_trading/test_transition_plan_execution_native.py'
      - 'tests/component/simulated_trading/test_corporate_action_posting_postgres.py'
      - 'tests/component/simulated_trading/test_owner_granted_corporate_action_postgres.py'
      - 'tests/component/simulated_trading/test_corporate_action_tax_assessment_postgres.py'
      - 'tests/component/simulated_trading/test_current_simulated_tax_qualification_postgres.py'
      - 'tests/support/simulated_tax_model_native_sources.py'
      - 'tests/support/simulated_tax_model_native_account.py'
      - 'tests/component/account/**'
      - 'tests/component/data_center/**'
      - 'tests/component/test_ai_provider_plaintext_removal_migration.py'
      - 'tests/component/config_center/test_aud05_atomic_activation.py'
      - 'tests/support/account_authority_generation_flush.py'
      - 'tests/unit/ci/test_publication_postgres_workflow.py'
      - 'core/settings/critical_postgres_test.py'
      - '.github/workflows/nightly-tests.yml'
      - 'tests/settings_data_center_sync_identity.py'
      - 'scripts/check_postgres_role_contract.py'
      - 'scripts/manage_vps_migrations.py'
      - 'scripts/bootstrap_vps_postgres_roles.sh'
      - 'scripts/migrate-vps-sqlite-to-postgres.sh'
      - 'scripts/postgres_statement_logging_window.sh'
      - 'scripts/postgres_role_bootstrap.sql'
      - 'scripts/sqlite_snapshot_contract.py'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - '.github/workflows/ci-publication-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agom_release_rehearsal_ci
          POSTGRES_USER: contract_test
          POSTGRES_PASSWORD: disposable_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contract_test -d agom_release_rehearsal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
        ports: ['6379:6379']
        options: >-
          --cpus 0.25 --memory 64m
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AGOM_EVID06_POSTGRES_TEST: '1'
      AGOM_EVID06_POSTGRES_TEST_DATABASE_URL: postgresql://contract_test:disposable_ci_only@127.0.0.1:5432/agom_release_rehearsal_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e sdk/
      - name: Check PostgreSQL test entrypoint contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: >-
          python -m pytest
          tests/unit/ci/test_publication_postgres_workflow.py
          -c /dev/null --confcutdir=tests/unit/ci -p no:cacheprovider -q
      - name: Exercise financial capacity non-PostgreSQL gate contracts
        run: >-
          python -m pytest
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_full_scope_capacity_rehearsal_receipt_can_start_formal_workflow
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_single_slice_qualification_receipt_never_qualifies_for_formal_start
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_capacity_rehearsal_without_owner_approval_has_zero_provider_egress
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_capacity_rehearsal_requires_exact_full_scope_ceiling_before_egress
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_rejected_rehearsal_budget_does_not_consume_approval_id
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_capacity_observed_physical_requests_over_ceiling_keep_provider_error_code
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_post_write_evidence_failure_preserves_known_sync_counts_without_receipt
          --ds=core.settings.development_sqlite
          -q -o addopts=''
      - name: Prepare isolated authority contract database
        env:
          PGPASSWORD: disposable_ci_only
        run: >-
          psql -h 127.0.0.1 -U contract_test -d postgres
          -v ON_ERROR_STOP=1
          -c 'CREATE DATABASE evid06_authority_test'
      - name: Exercise ASH-05 native hold lease rollback
        env:
          DATABASE_URL: postgresql://contract_test:disposable_ci_only@127.0.0.1:5432/agom_release_rehearsal_ci
          AGOM_CRITICAL_TEST_DB_NAME: ash05_lease_test
        run: >-
          python -m pytest
          tests/component/simulated_trading/test_transition_plan_execution_native.py::test_native_hold_rolls_back_when_plan_expires_after_insert_before_commit
          --ds=core.settings.critical_postgres_test
          --confcutdir=tests/component
          --create-db -q -o addopts='' --junitxml=ash05-lease-postgres.xml
      - name: Exercise ASH-05 native corporate-action ledger
        env:
          DATABASE_URL: postgresql://contract_test:disposable_ci_only@127.0.0.1:5432/agom_release_rehearsal_ci
          AGOM_CRITICAL_TEST_DB_NAME: ash05_cash_posting_test
          REDIS_URL: redis://127.0.0.1:6379/0
        run: >-
          python -m pytest
          tests/component/simulated_trading/test_corporate_action_posting_postgres.py::test_postgres_concurrent_entitlement_replay_writes_one_receivable
          tests/component/simulated_trading/test_corporate_action_posting_postgres.py::test_postgres_payment_waits_for_szse_date_and_settles_exact_receivable
          tests/component/simulated_trading/test_corporate_action_posting_postgres.py::test_postgres_audited_cash_payment_commits_and_replays_with_one_audit_pair
          tests/component/simulated_trading/test_owner_granted_corporate_action_postgres.py::test_native_nonstaff_owner_stage_commits_exact_grant_audit_and_replays
          tests/component/simulated_trading/test_owner_granted_corporate_action_postgres.py::test_native_owner_withdrawal_blocks_stage_and_its_exact_replay
          tests/component/simulated_trading/test_owner_granted_corporate_action_postgres.py::test_native_owner_authority_failure_rolls_back_financial_audit_and_outbox
          tests/component/account/test_simulated_corporate_action_write_issuance_postgres.py::test_native_owner_consent_http_prepare_confirm_retry_and_readonly_withdraw
          tests/component/account/test_simulated_corporate_action_write_issuance_postgres.py::test_native_expired_grant_source_and_policy_can_still_prepare_exact_owner_withdrawal
          tests/component/account/test_simulated_corporate_action_write_issuance_postgres.py::test_native_rotated_issuer_key_does_not_prevent_owner_withdrawal_or_restore_permission
          tests/component/account/test_simulated_corporate_action_write_issuance_postgres.py::test_native_nonstaff_owner_consent_is_sealed_and_exact_retry_is_idempotent
