name: Publication PostgreSQL contracts

on:
  workflow_call:
  pull_request:
    branches: [main, 'dev/**']
    paths:
      - 'apps/data_center/**'
      - 'apps/account/**'
      - 'apps/audit/**'
      - 'apps/simulated_trading/**'
      - 'tests/component/account/**'
      - 'tests/component/data_center/**'
      - 'tests/settings_data_center_sync_identity.py'
      - 'scripts/check_postgres_role_contract.py'
      - 'scripts/manage_vps_migrations.py'
      - 'scripts/bootstrap_vps_postgres_roles.sh'
      - 'scripts/migrate-vps-sqlite-to-postgres.sh'
      - 'scripts/postgres_statement_logging_window.sh'
      - 'scripts/postgres_role_bootstrap.sql'
      - 'scripts/sqlite_snapshot_contract.py'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - '.github/workflows/ci-publication-postgres.yml'
  push:
    branches: [main, 'dev/**']
    paths:
      - 'apps/data_center/**'
      - 'apps/account/**'
      - 'apps/audit/**'
      - 'apps/simulated_trading/**'
      - 'tests/component/account/**'
      - 'tests/component/data_center/**'
      - 'tests/settings_data_center_sync_identity.py'
      - 'scripts/check_postgres_role_contract.py'
      - 'scripts/manage_vps_migrations.py'
      - 'scripts/bootstrap_vps_postgres_roles.sh'
      - 'scripts/migrate-vps-sqlite-to-postgres.sh'
      - 'scripts/postgres_statement_logging_window.sh'
      - 'scripts/postgres_role_bootstrap.sql'
      - 'scripts/sqlite_snapshot_contract.py'
      - 'pyproject.toml'
      - 'requirements-dev.txt'
      - '.github/workflows/ci-publication-postgres.yml'
  workflow_dispatch:
    inputs:
      critical_pg_diagnostic:
        description: "Run the one-off PostgreSQL faulthandler differential diagnostic"
        required: true
        type: boolean
        default: false
      diagnostic_constraints_b64:
        description: "Base64 of the reviewed 197-package diagnostic constraints"
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: publication-postgres-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.critical_pg_diagnostic && format('-diagnostic-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  publication-postgres:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.critical_pg_diagnostic) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agom_release_rehearsal_ci
          POSTGRES_USER: contract_test
          POSTGRES_PASSWORD: disposable_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U contract_test -d agom_release_rehearsal_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AGOM_EVID06_POSTGRES_TEST: '1'
      AGOM_EVID06_POSTGRES_TEST_DATABASE_URL: postgresql://contract_test:disposable_ci_only@127.0.0.1:5432/agom_release_rehearsal_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e sdk/
      - name: Exercise financial capacity non-PostgreSQL gate contracts
        run: >-
          python -m pytest
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_full_scope_capacity_rehearsal_receipt_can_start_formal_workflow
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_single_slice_qualification_receipt_never_qualifies_for_formal_start
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_capacity_rehearsal_without_owner_approval_has_zero_provider_egress
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_capacity_rehearsal_requires_exact_full_scope_ceiling_before_egress
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_rejected_rehearsal_budget_does_not_consume_approval_id
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_capacity_observed_physical_requests_over_ceiling_keep_provider_error_code
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_post_write_evidence_failure_preserves_known_sync_counts_without_receipt
          --ds=core.settings.development_sqlite
          -q -o addopts=''
      - name: Prepare isolated authority contract database
        env:
          PGPASSWORD: disposable_ci_only
        run: >-
          psql -h 127.0.0.1 -U contract_test -d postgres
          -v ON_ERROR_STOP=1
          -c 'CREATE DATABASE evid06_authority_test'
      - name: Exercise authority read-lock concurrency
        env:
          AGOM_EVID06_POSTGRES_TEST_DATABASE_URL: postgresql://contract_test:disposable_ci_only@127.0.0.1:5432/evid06_authority_test
        run: >-
          python -m pytest
          tests/component/account/test_owner_tenant_authority_v3_repository.py::test_current_source_read_locks_are_concurrent_and_still_exclude_writers
          tests/component/account/test_owner_tenant_authority_v3_repository.py::test_current_source_read_lock_allows_readers_and_blocks_simulated_successor
          --ds=core.settings.development_sqlite
          --confcutdir=tests/component/account
          -q -o addopts='' --junitxml=authority-lock-postgres.xml
      - name: Exercise Account authority generation coverage and fence
        env:
          AGOM_EVID06_POSTGRES_TEST_DATABASE_URL: postgresql://contract_test:disposable_ci_only@127.0.0.1:5432/evid06_authority_test
        run: >-
          python -m pytest
          tests/component/account/test_account_authority_generation_postgres.py
          --ds=core.settings.development_sqlite
          --confcutdir=tests/component/account
          -q -o addopts='' --junitxml=account-authority-generation-postgres.xml
      - name: Exercise Account authority shadow scan
        env:
          AGOM_EVID06_POSTGRES_TEST_DATABASE_URL: postgresql://contract_test:disposable_ci_only@127.0.0.1:5432/evid06_authority_test
        run: >-
          python -m pytest
          tests/component/account/test_owner_tenant_authority_v3_composition.py::test_opt_in_postgres_facade_issues_reads_and_revokes
          --ds=core.settings.development_sqlite
          --confcutdir=tests/component/account
          -q -o addopts='' --junitxml=account-authority-shadow-postgres.xml
      - name: Exercise Account authority final revalidation fence
        env:
          AGOM_EVID06_POSTGRES_TEST_DATABASE_URL: postgresql://contract_test:disposable_ci_only@127.0.0.1:5432/evid06_authority_test
        run: >-
          python -m pytest
          tests/component/account/test_account_authority_final_revalidator_v3_postgres.py
          --ds=core.settings.development_sqlite
          --confcutdir=tests/component/account
          -q -o addopts='' --junitxml=account-authority-final-revalidation-postgres.xml
      - name: Exercise real publication locks and frozen facts
        run: >-
          python -m pytest
          tests/component/data_center/test_publication_read_snapshot_postgres.py
          tests/component/data_center/test_financial_fact_repository_postgres_provenance.py
          tests/component/data_center/test_publication_fact_lock_postgres.py
          -k "not financial_capacity"
          --ds=tests.settings_data_center_sync_identity
          --confcutdir=tests/component/data_center
          -q -o addopts='' --junitxml=publication-postgres.xml
      - name: Exercise financial capacity publication crash recovery and CAS
        run: >-
          python -m pytest
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_financial_capacity_stage_commit_unknown_recovers_exact_candidate_postgresql
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_financial_capacity_activation_commit_unknown_replays_only_same_plan_postgresql
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_financial_capacity_activation_audit_failure_rolls_back_pointer_and_outbox_postgresql
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_concurrent_financial_capacity_activations_have_one_postgresql_cas_winner
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_financial_capacity_formal_manifest_uses_asset_subquery_for_5572_active_assets_postgresql
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_formal_start_consumes_verified_scope_import_atomically_postgresql
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_formal_start_import_event_failure_rolls_back_all_rows_postgresql
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_formal_start_same_workflow_retry_reconciles_and_other_workflow_replay_is_blocked_postgresql
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_concurrent_formal_start_replay_has_one_postgresql_consumption_winner
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_financial_scope_import_locks_nullable_revocation_join_on_postgresql
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_formal_scope_import_authority_rechecks_real_postgresql_rows
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_formal_scope_import_authority_rejects_candidate_provider_and_universe_drift_postgresql
          tests/component/data_center/test_publication_read_snapshot_postgres.py::test_formal_scope_import_commit_unknown_after_commit_reads_back_exact_workflow_postgresql
          --ds=tests.settings_data_center_sync_identity
          --confcutdir=tests/component/data_center
          -q -o addopts='' --junitxml=financial-capacity-postgres.xml
      - name: Exercise PostgreSQL control plane and valuation lineage staging
        env:
          DATABASE_URL: postgresql://contract_test:disposable_ci_only@127.0.0.1:5432/agom_release_rehearsal_ci
          DJANGO_SETTINGS_MODULE: core.settings.critical_postgres_test
          AGOM_CRITICAL_TEST_DB_NAME: test_agom_release_rehearsal_ci
          SECRET_KEY: publication-postgres-control-plane-secret-key
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: >-
          python -m pytest
          tests/component/data_center/test_core_data_backfill_control_plane.py::test_postgresql_backfill_first_run_and_same_parameter_retry_are_idempotent
          tests/component/data_center/test_core_data_backfill_control_plane.py::test_postgresql_backfill_provider_domain_failure_persists_partial_outcome
          tests/component/data_center/test_current_publication_staging.py::test_valuation_sync_reference_stages_actual_source_and_rejects_route_binding_postgresql
          --ds=core.settings.critical_postgres_test
          --confcutdir=tests/component/data_center
          --create-db
          -q -o addopts='' --junitxml=backfill-control-plane-postgres.xml
      - name: Exercise governed AKShare financial capture and slice sync
        env:
          DATABASE_URL: postgresql://contract_test:disposable_ci_only@127.0.0.1:5432/agom_release_rehearsal_ci
          DJANGO_SETTINGS_MODULE: core.settings.development
          SECRET_KEY: publication-postgres-financial-slice-secret-key
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: >-
          python -m pytest
          tests/unit/data_center/test_akshare_financial_capture.py::test_akshare_financial_capture_retains_independent_exact_body_pair
          tests/unit/data_center/test_akshare_financial_capture.py::test_akshare_adapter_builds_typed_facts_from_two_retained_raw_bodies
          tests/unit/data_center/test_akshare_financial_capture.py::test_akshare_financial_capture_provider_failure_does_not_retain_any_artifact
          tests/unit/data_center/test_akshare_financial_capture.py::test_akshare_financial_slice_sync_uses_exact_approved_route_and_one_atomic_write
          tests/unit/data_center/test_akshare_financial_capture.py::test_akshare_financial_slice_sync_evidence_rejection_writes_zero_facts
          tests/unit/data_center/test_akshare_financial_capture.py::test_akshare_financial_slice_sync_scale_gate_counts_two_requests_per_pair
          tests/unit/data_center/test_akshare_financial_capture.py::test_akshare_financial_slice_sync_partial_provider_failure_writes_zero_facts
          tests/unit/data_center/test_akshare_financial_capture.py::test_akshare_financial_slice_budget_is_contract_bound_and_fails_closed
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_django_checkpoint_repository_resumes_after_workflow_reconstruction
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_django_checkpoint_repository_consumes_receipt_once_even_after_reapproval
          tests/unit/data_center/test_financial_publication_capacity_workflow.py::test_django_concurrent_duplicate_observes_live_claim_without_database_mutation
          tests/unit/data_center/test_financial_capacity_manifest.py::test_formal_manifest_uses_asset_subquery_for_5572_active_assets
          --ds=core.settings.development
          --create-db
          -q -o addopts='' --junitxml=financial-slice-sync-contracts.xml
      - name: Exercise statement logging maintenance window and failure recovery
        env:
          PGPASSWORD: disposable_ci_only
          STATEMENT_LOGGING_STATE: /tmp/agom-statement-logging-ci.state
        run: |
          statement_logging_psql() {
            mode="$1"
            if [ "$mode" = "query" ]; then
              psql -X -A -t -h 127.0.0.1 -U contract_test \
                -d agom_release_rehearsal_ci -v ON_ERROR_STOP=1
              return
            fi
            [ "$mode" = "execute" ] || return 2
            psql -X -h 127.0.0.1 -U contract_test \
              -d agom_release_rehearsal_ci -v ON_ERROR_STOP=1
          }
          . scripts/postgres_statement_logging_window.sh
          statement_logging_psql execute <<'SQL'
          ALTER SYSTEM SET log_statement = 'all';
          ALTER SYSTEM SET log_min_duration_statement = '500ms';
          ALTER SYSTEM SET log_min_duration_sample = '1s';
          ALTER SYSTEM SET log_statement_sample_rate = '0.5';
          ALTER SYSTEM SET log_transaction_sample_rate = '0.25';
          ALTER SYSTEM SET log_min_error_statement = 'error';
          ALTER SYSTEM SET log_parameter_max_length = '1kB';
          ALTER SYSTEM SET log_parameter_max_length_on_error = '2kB';
          SELECT pg_catalog.pg_reload_conf();
          SQL
          configured_values="$(read_statement_logging_settings)"
          enter_statement_logging_window
          test "$(read_statement_logging_settings)" = "none|-1|-1|0|0|panic|0|0"
          restore_statement_logging
          test "$(read_statement_logging_settings)" = "$configured_values"
          if (
            trap cleanup_statement_logging_window EXIT
            trap 'exit 129' HUP
            trap 'exit 130' INT
            trap 'exit 143' TERM
            enter_statement_logging_window
            false
          ); then
            echo "statement logging failure injection unexpectedly succeeded" >&2
            exit 1
          fi
          test ! -e "$STATEMENT_LOGGING_STATE"
          test "$(read_statement_logging_settings)" = "$configured_values"
          statement_logging_psql execute <<'SQL'
          ALTER SYSTEM RESET log_statement;
          ALTER SYSTEM RESET log_min_duration_statement;
          ALTER SYSTEM RESET log_min_duration_sample;
          ALTER SYSTEM RESET log_statement_sample_rate;
          ALTER SYSTEM RESET log_transaction_sample_rate;
          ALTER SYSTEM RESET log_min_error_statement;
          ALTER SYSTEM RESET log_parameter_max_length;
          ALTER SYSTEM RESET log_parameter_max_length_on_error;
          SELECT pg_catalog.pg_reload_conf();
          SQL
          printf '%s\n' "$configured_values" > statement-logging-window.log
      - name: Exercise production role bootstrap and migration ordering
        env:
          PGPASSWORD: disposable_ci_only
          POSTGRES_USER: contract_test
          AGOMTRADEPRO_ADMIN_PASSWORD: AdminRoleContractCi_20260930_a7Kp9Q4m
          AGOMTRADEPRO_RUNTIME_PASSWORD: RuntimeRoleContractCi_20260930_b8Lm2R5n
          AGOMTRADEPRO_MIGRATOR_PASSWORD: MigratorRoleContractCi_20260930_c9Nv3S6p
          SECRET_KEY: role-contract-ci-secret-key-abcdefghijklmnopqrstuvwxyz-0123456789
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DJANGO_SETTINGS_MODULE: core.settings.production
        run: |
          maintenance_pgoptions="-c log_statement=none -c log_min_duration_statement=-1 -c log_min_duration_sample=-1 -c log_statement_sample_rate=0 -c log_transaction_sample_rate=0 -c log_min_error_statement=panic -c log_parameter_max_length=0 -c log_parameter_max_length_on_error=0"
          createdb -h 127.0.0.1 -U contract_test role_contract_ci
          if PGOPTIONS='' psql -X -h 127.0.0.1 -U contract_test -d role_contract_ci \
            -v ON_ERROR_STOP=1 -f scripts/postgres_role_bootstrap.sql \
            > statement-logging-guard.log 2>&1; then
            echo "role bootstrap unexpectedly accepted statement logging" >&2
            exit 1
          fi
          grep -F "maintenance connection statement logging must be disabled" \
            statement-logging-guard.log
          PGOPTIONS="$maintenance_pgoptions" \
            psql -X -h 127.0.0.1 -U contract_test -d role_contract_ci \
            -v ON_ERROR_STOP=1 -f scripts/postgres_role_bootstrap.sql \
            | tee role-bootstrap-postgres.log
          PYTHONPATH=. \
            DATABASE_URL=postgresql://agomtradepro_migrator:${AGOMTRADEPRO_MIGRATOR_PASSWORD}@127.0.0.1:5432/role_contract_ci \
            python scripts/manage_vps_migrations.py migrate --noinput
          PGPASSWORD="${AGOMTRADEPRO_ADMIN_PASSWORD}" \
            PGOPTIONS="$maintenance_pgoptions" \
            psql -X -h 127.0.0.1 -U contract_test -d role_contract_ci \
            -v ON_ERROR_STOP=1 -f scripts/postgres_role_bootstrap.sql \
            | tee -a role-bootstrap-postgres.log
          PYTHONPATH=. \
            DATABASE_URL=postgresql://agomtradepro_runtime:${AGOMTRADEPRO_RUNTIME_PASSWORD}@127.0.0.1:5432/role_contract_ci \
            AGOMTRADEPRO_DATABASE_ROLE=runtime \
            python scripts/check_postgres_role_contract.py \
            | tee -a role-bootstrap-postgres.log
      - name: Exercise SQLite snapshot dump flush loaddata reconciliation
        env:
          AGOMTRADEPRO_MIGRATOR_PASSWORD: MigratorRoleContractCi_20260930_c9Nv3S6p
          AGOMTRADEPRO_RUNTIME_PASSWORD: RuntimeRoleContractCi_20260930_b8Lm2R5n
          SECRET_KEY: snapshot-rehearsal-ci-secret-key-abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DJANGO_SETTINGS_MODULE: core.settings.production
        run: |
          source_url="sqlite:///$PWD/sqlite-snapshot-rehearsal.sqlite3"
          migrator_url="postgresql://agomtradepro_migrator:${AGOMTRADEPRO_MIGRATOR_PASSWORD}@127.0.0.1:5432/role_contract_ci"
          runtime_url="postgresql://agomtradepro_runtime:${AGOMTRADEPRO_RUNTIME_PASSWORD}@127.0.0.1:5432/role_contract_ci"
          rm -f sqlite-snapshot-rehearsal.sqlite3 sqlite-snapshot-rehearsal.jsonl
          PYTHONPATH=. DATABASE_URL="$source_url" \
            AGOMTRADEPRO_DATABASE_ROLE= \
            AGOMTRADEPRO_ALLOW_PRODUCTION_SQLITE_MIGRATION=1 \
            python manage.py migrate --noinput
          PYTHONPATH=. DATABASE_URL="$source_url" \
            AGOMTRADEPRO_DATABASE_ROLE= \
            AGOMTRADEPRO_ALLOW_PRODUCTION_SQLITE_MIGRATION=1 \
            python manage.py shell <<'PY'
          from datetime import UTC, datetime
          from uuid import UUID
          from apps.data_center.application.publication_utils import (
              member_reference,
              publication_hash,
          )
          from apps.data_center.domain.control_plane import PublicationMember
          from apps.data_center.infrastructure.publication_models import (
              CanonicalPublicationModel,
              PublicationMemberModel,
          )
          publication_id = UUID("00000000-0000-4000-8000-000000000501")
          member_id = UUID("00000000-0000-4000-8000-000000000502")
          observed_at = datetime(2026, 9, 30, 7, tzinfo=UTC)
          member = PublicationMember(
              member_id=str(member_id),
              publication_id=str(publication_id),
              dataset_key="rehearsal.snapshot",
              natural_key="fixture:1",
              source="rehearsal",
              source_record_id="fixture:1",
              fact_table="rehearsal_snapshot_fact",
              fact_pk="1",
              observed_at=observed_at,
              fact_content_hash="c" * 64,
          )
          snapshot_hash = publication_hash((member_reference(member),))
          CanonicalPublicationModel.objects.create(
              publication_id=publication_id,
              dataset_key="rehearsal.snapshot",
              publication_key="current",
              policy_version="snapshot-rehearsal-v1",
              state="published",
              selected_source="rehearsal",
              publication_hash=snapshot_hash,
              member_manifest_hash=snapshot_hash,
              member_count=1,
              coverage_requested_count=1,
              coverage_eligible_count=1,
              coverage_selected_count=1,
              as_of=observed_at,
              published_at=observed_at,
              members_sealed_at=observed_at,
          )
          PublicationMemberModel.objects.create(
              member_id=member_id,
              publication_id=publication_id,
              dataset_key="rehearsal.snapshot",
              natural_key="fixture:1",
              source="rehearsal",
              source_record_id="fixture:1",
              fact_table="rehearsal_snapshot_fact",
              fact_pk="1",
              observed_at=observed_at,
              fact_content_hash="c" * 64,
          )
          PY
          PYTHONPATH=. DATABASE_URL="$source_url" \
            AGOMTRADEPRO_DATABASE_ROLE= \
            AGOMTRADEPRO_ALLOW_PRODUCTION_SQLITE_MIGRATION=1 \
            python scripts/sqlite_snapshot_contract.py capture \
            --output sqlite-source-counts.json
          PYTHONPATH=. DATABASE_URL="$source_url" \
            AGOMTRADEPRO_DATABASE_ROLE= \
            AGOMTRADEPRO_ALLOW_PRODUCTION_SQLITE_MIGRATION=1 \
            python manage.py dumpdata \
            --format jsonl \
            --natural-foreign \
            --natural-primary \
            --exclude contenttypes \
            --exclude auth.permission \
            --exclude sessions.session \
            --output sqlite-snapshot-rehearsal.jsonl
          PYTHONPATH=. DATABASE_URL="$migrator_url" \
            python scripts/manage_vps_migrations.py flush --noinput
          PYTHONPATH=. DATABASE_URL="$migrator_url" \
            AGOMTRADEPRO_DISABLE_USER_PROVISIONING_SIGNALS=1 \
            python scripts/manage_vps_migrations.py loaddata sqlite-snapshot-rehearsal.jsonl
          PYTHONPATH=. DATABASE_URL="$runtime_url" \
            AGOMTRADEPRO_DATABASE_ROLE=runtime \
            python scripts/sqlite_snapshot_contract.py capture \
            --output postgres-target-counts.json
          python scripts/sqlite_snapshot_contract.py verify \
            --source sqlite-source-counts.json \
            --target postgres-target-counts.json \
            --fixture sqlite-snapshot-rehearsal.jsonl \
            --report sqlite-snapshot-rehearsal-report.json
          PYTHONPATH=. DATABASE_URL="$runtime_url" \
            AGOMTRADEPRO_DATABASE_ROLE=runtime \
            python manage.py shell <<'PY'
          from apps.data_center.infrastructure.control_plane_repositories import (
              CanonicalPublicationRepository,
          )
          from apps.data_center.infrastructure.publication_models import (
              CanonicalPublicationPointerModel,
          )
          assert not CanonicalPublicationPointerModel.objects.exists()
          assert CanonicalPublicationRepository().get_current(
              "rehearsal.snapshot", "current"
          ) is None
          PY
          PYTHONPATH=. DATABASE_URL="$runtime_url" \
            AGOMTRADEPRO_DATABASE_ROLE=runtime \
            python scripts/check_postgres_role_contract.py \
            | tee -a role-bootstrap-postgres.log
      - name: Reject missing or skipped PostgreSQL evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          from scripts.validate_release_rehearsal import REQUIRED_POSTGRESQL_TESTS

          junit_files = (
              'publication-postgres.xml',
              'authority-lock-postgres.xml',
              'account-authority-generation-postgres.xml',
              'account-authority-shadow-postgres.xml',
              'account-authority-final-revalidation-postgres.xml',
              'backfill-control-plane-postgres.xml',
              'financial-capacity-postgres.xml',
              'financial-slice-sync-contracts.xml',
          )
          cases = []
          for filename in junit_files:
              path = Path(filename)
              assert path.is_file() and path.stat().st_size > 0, (
                  f'Missing or empty PostgreSQL evidence: {filename}'
              )
              file_cases = ElementTree.parse(path).findall('.//testcase')
              assert file_cases, f'PostgreSQL evidence has no testcases: {filename}'
              cases.extend(file_cases)

          assert all(
              case.find('skipped') is None for case in cases
          ), 'PostgreSQL cases must execute'
          assert all(
              case.find('failure') is None and case.find('error') is None
              for case in cases
          )

          observed_tests = {
              f"{(case.get('classname') or '').strip()}::{(case.get('name') or '').strip()}"
              for case in cases
          }
          missing_tests = set(REQUIRED_POSTGRESQL_TESTS) - observed_tests
          assert not missing_tests, (
              f'Missing required PostgreSQL test identities: {sorted(missing_tests)}'
          )

          with open('sqlite-snapshot-rehearsal-report.json', encoding='utf-8') as handle:
              snapshot_report = json.load(handle)
          assert snapshot_report['outcome'] == 'success'
          assert snapshot_report['fixture_row_count'] == snapshot_report['source_serialized_row_count']
          assert snapshot_report['source_row_count'] > 0
          assert snapshot_report['mismatches'] == {}
          PY
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-postgres-evidence
          path: |
            publication-postgres.xml
            authority-lock-postgres.xml
            account-authority-generation-postgres.xml
            account-authority-shadow-postgres.xml
            account-authority-final-revalidation-postgres.xml
            backfill-control-plane-postgres.xml
            financial-capacity-postgres.xml
            financial-slice-sync-contracts.xml
            role-bootstrap-postgres.log
            statement-logging-guard.log
            statement-logging-window.log
            sqlite-source-counts.json
            postgres-target-counts.json
            sqlite-snapshot-rehearsal-report.json
          if-no-files-found: error
  critical-pg-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.critical_pg_diagnostic }}
    name: Critical PG diagnostic (timer ${{ matrix.dump_seconds }}s; not qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dump_seconds: [30, 0]
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_DB: agomtradepro_critical
          POSTGRES_USER: agomtradepro
          POSTGRES_PASSWORD: critical-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agomtradepro -d agomtradepro_critical"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://agomtradepro:critical-test-password@127.0.0.1:5432/agomtradepro_critical
      DJANGO_SETTINGS_MODULE: core.settings.critical_postgres_test
      SECRET_KEY: nightly-critical-postgres-secret-key-12345678901234567890
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PYTHONFAULTHANDLER: "1"
      AGOM_CRITICAL_TEST_DB_NAME: test_agomtradepro_critical_aud05_flush
      AGOM_AUD05_PG_CONCURRENCY_EVIDENCE: "1"
    steps:
      - name: Checkout exact diagnostic candidate
        timeout-minutes: 1
        uses: actions/checkout@v5
        with:
          ref: cc4c62c3fdeaeac6f8b9ddaab828221648c0e31c
          persist-credentials: false
      - name: Set up Python 3.11.17
        timeout-minutes: 2
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.17"
      - name: Prepare isolated evidence and verify PostgreSQL image
        timeout-minutes: 1
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cc4c62c3fdeaeac6f8b9ddaab828221648c0e31c"
          test "$(python -S -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')" = "3.11.17"
          mkdir -p reports/quality/postgres "$RUNNER_TEMP/critical-pg-diagnostic"
          test ! -e reports/quality/postgres/authority-generation-flush.xml
          docker inspect "$POSTGRES_CONTAINER_ID" --format '{{.Config.Image}} {{.Image}}' > "$RUNNER_TEMP/critical-pg-diagnostic/postgres-container-image.txt"
          IMAGE_ID="$(docker inspect "$POSTGRES_CONTAINER_ID" --format '{{.Image}}')"
          docker image inspect "$IMAGE_ID" --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/critical-pg-diagnostic/postgres-image-repodigests.json"
          grep -Fq "postgres@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97" "$RUNNER_TEMP/critical-pg-diagnostic/postgres-image-repodigests.json"
          PG_VERSION_NUM="$(psql "$DATABASE_URL" --tuples-only --no-align --command='SHOW server_version_num' | tr -d '[:space:]')"
          test "$PG_VERSION_NUM" = "160015"
          {
            python --version
            psql --version
            printf 'POSTGRES_SERVER_VERSION_NUM=%s\n' "$PG_VERSION_NUM"
            psql "$DATABASE_URL" --tuples-only --no-align --command='SHOW server_version'
            psql "$DATABASE_URL" --tuples-only --no-align --command='SELECT version();'
            printf 'SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)"
            printf 'WORKFLOW_EVENT_SHA=%s\n' "$GITHUB_SHA"
            printf 'WORKFLOW_EVENT_REF=%s\n' "$GITHUB_REF"
            printf 'WORKFLOW_EVENT_NAME=%s\n' "$GITHUB_EVENT_NAME"
            printf 'RUNNER_IMAGE_OS=%s\n' "${ImageOS:-unknown}"
            printf 'RUNNER_IMAGE_VERSION=%s\n' "${ImageVersion:-unknown}"
            printf 'PG_SERVICE_ID=%s\n' "$POSTGRES_CONTAINER_ID"
            printf 'PG_IMAGE_ID=%s\n' "$IMAGE_ID"
            printf 'RELEASE_QUALIFICATION=false\n'
            printf 'SERVICE_CLEANUP=Pending official GitHub Actions post-job teardown\n'
          } > "$RUNNER_TEMP/critical-pg-diagnostic/runtime-identity.txt"
          cat /etc/os-release > "$RUNNER_TEMP/critical-pg-diagnostic/os-release.txt"
          uname -a > "$RUNNER_TEMP/critical-pg-diagnostic/uname.txt"
      - name: Install exact reviewed diagnostic constraints
        timeout-minutes: 8
        env:
          DIAGNOSTIC_CONSTRAINTS_B64: ${{ inputs.diagnostic_constraints_b64 }}
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import base64, hashlib, os, pathlib, re
          payload = os.environ["DIAGNOSTIC_CONSTRAINTS_B64"]
          raw = base64.b64decode(payload, validate=True)
          expected_sha = "18a5ddad43642b2b020c2d2f3724c27534593a1bacde7117a2850c40bead572c"
          if hashlib.sha256(raw).hexdigest() != expected_sha:
              raise SystemExit("constraints SHA-256 mismatch")
          pins = []
          for line in raw.decode("utf-8").splitlines():
              value = line.strip()
              if not value or value.startswith("#"):
                  continue
              match = re.fullmatch(r"([A-Za-z0-9][A-Za-z0-9._-]*)==([A-Za-z0-9][A-Za-z0-9.!+_-]*)", value)
              if match is None:
                  raise SystemExit("constraints contains a non-exact pin")
              name = re.sub(r"[-_.]+", "-", match.group(1)).lower()
              pins.append((name, match.group(2)))
          if len(pins) != 197 or len({name for name, _ in pins}) != 197:
              raise SystemExit("constraints must contain 197 unique exact pins")
          if ("pip", "26.2.2") not in pins:
              raise SystemExit("reviewed pip pin missing")
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "critical-pg-diagnostic" / "constraints.txt").write_bytes(raw)
          PY
          python -m venv "$RUNNER_TEMP/critical-pg-diagnostic/venv"
          VENV="$RUNNER_TEMP/critical-pg-diagnostic/venv"
          "$VENV/bin/python" -m pip install --disable-pip-version-check --upgrade "pip==26.2.2"
          "$VENV/bin/python" -m pip install --disable-pip-version-check --constraint "$RUNNER_TEMP/critical-pg-diagnostic/constraints.txt" -r requirements-dev.txt
          "$VENV/bin/python" -m pip install --disable-pip-version-check --constraint "$RUNNER_TEMP/critical-pg-diagnostic/constraints.txt" -e sdk/
          "$VENV/bin/python" -m pip check
          "$VENV/bin/python" -m pip freeze --all > "$RUNNER_TEMP/critical-pg-diagnostic/pip-freeze.txt"
          "$VENV/bin/python" -m pip list --format=json > "$RUNNER_TEMP/critical-pg-diagnostic/pip-list.json"
          python -S - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "critical-pg-diagnostic"
          def norm(name: str) -> str:
              return re.sub(r"[-_.]+", "-", name).lower()
          expected = {}
          for line in (root / "constraints.txt").read_text(encoding="utf-8").splitlines():
              if line and not line.startswith("#"):
                  name, version = line.split("==", 1)
                  expected[norm(name)] = version
          installed_rows = json.loads((root / "pip-list.json").read_text(encoding="utf-8"))
          installed = {norm(row["name"]): row["version"] for row in installed_rows}
          mismatches = {name: {"expected": version, "actual": installed.get(name)} for name, version in expected.items() if installed.get(name) != version}
          extras = sorted(set(installed) - set(expected))
          (root / "dependency-comparison.json").write_text(json.dumps({"expected_pin_count": len(expected), "matched_pin_count": len(expected) - len(mismatches), "mismatches": mismatches, "unconstrained_installed_names": extras}, indent=2) + "\n", encoding="utf-8")
          if mismatches:
              raise SystemExit("installed distributions differ from reviewed 197-pin observation")
          PY
      - name: Extract and verify the unchanged official evidence validator
        timeout-minutes: 1
        run: |
          set -euo pipefail
          python -S - <<'PY'
          import hashlib, os, pathlib, subprocess
          commit = "cc4c62c3fdeaeac6f8b9ddaab828221648c0e31c"
          expected_blob = "f4a8f1aafb63e49f41b55c5e94fd08abbf5a6ba3"
          result = subprocess.run(["git", "show", f"{commit}:.github/workflows/nightly-tests.yml"], check=True, capture_output=True, timeout=10)
          blob = subprocess.run(["git", "hash-object", "--stdin"], input=result.stdout, check=True, capture_output=True, timeout=10).stdout.decode().strip()
          if blob != expected_blob:
              raise SystemExit("nightly workflow source blob mismatch")
          lines = result.stdout.splitlines(keepends=True)
          start = next(i for i, line in enumerate(lines) if line == b"      - name: Run full-registry transaction cleanup regressions on PostgreSQL\n")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].startswith(b"      - name: "))
          block = b"".join(lines[start:end])
          opener = b"          python - <<'PY'\n"
          closer = b"          PY\n"
          first = block.index(opener) + len(opener)
          last = block.index(closer, first)
          body_lines = block[first:last].splitlines(keepends=True)
          if any(line.strip() and not line.startswith(b"          ") for line in body_lines):
              raise SystemExit("unexpected validator heredoc indentation")
          validator = b"".join(line[10:] if line.startswith(b"          ") else line for line in body_lines)
          expected_sha = "4c7524b52dcea4d08207c03f8a3bcc3d5c18f7a32099f70bf39ba2fb67216402"
          if hashlib.sha256(validator).hexdigest() != expected_sha:
              raise SystemExit("extracted official validator hash mismatch")
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "critical-pg-diagnostic" / "official-validator.py"
          target.write_bytes(validator)
          (target.parent / "validator-source.txt").write_text(f"nightly_blob={blob}\nvalidator_sha256={expected_sha}\n", encoding="utf-8")
          PY
      - name: Run six-file native-signal diagnostic under GDB
        timeout-minutes: 10
        env:
          DUMP_SECONDS: ${{ matrix.dump_seconds }}
        run: |
          set -euo pipefail
          VENV="$RUNNER_TEMP/critical-pg-diagnostic/venv"
          GDB_LOG="$RUNNER_TEMP/critical-pg-diagnostic/gdb.log"
          GDB_COMMANDS="$RUNNER_TEMP/critical-pg-diagnostic/gdb-commands.txt"
          if ! command -v gdb >/dev/null 2>&1; then
            echo "gdb is unavailable; no fallback is permitted" | tee "$GDB_LOG"
            exit 2
          fi
          gdb --version > "$RUNNER_TEMP/critical-pg-diagnostic/gdb-version.txt"
          cat > "$GDB_COMMANDS" <<'GDB'
          set pagination off
          set confirm off
          set debuginfod enabled off
          set auto-load python-scripts off
          set auto-load off
          set auto-load safe-path /nonexistent
          set print frame-arguments none
          set print entry-values no
          set disable-randomization off
          set print thread-events off
          handle SIGSEGV stop print pass
          handle SIGABRT stop print pass
          catch signal SIGSEGV SIGABRT
          commands
            silent
            printf "\n--- caught native signal; bounded fault-thread stack ---\n"
            info threads
            thread apply all bt 20
            continue
          end
          run
          if $_isvoid($_exitcode)
            printf "INFERIOR_EXITCODE=void\n"
          else
            printf "INFERIOR_EXITCODE=%d\n", $_exitcode
          end
          if $_isvoid($_exitsignal)
            printf "INFERIOR_EXITSIGNAL=void\n"
          else
            printf "INFERIOR_EXITSIGNAL=%d\n", $_exitsignal
          end
          GDB
          set +e
          gdb -nx --batch --return-child-result -x "$GDB_COMMANDS" --args \
            "$VENV/bin/python" -m pytest -vv \
            tests/component/data_center/test_audited_price_sync_transaction.py \
            tests/component/data_center/test_audited_macro_sync_transaction.py \
            tests/component/config_center/test_aud05_atomic_activation.py \
            tests/component/data_center/test_audited_quote_sync_transaction.py \
            tests/component/data_center/test_current_publication_staging.py \
            tests/component/data_center/test_financial_source_time_audit_claim.py \
            --create-db --reuse-db --maxfail=1 \
            --timeout=300 --timeout-method=thread --durations=20 \
            -o "faulthandler_timeout=$DUMP_SECONDS" \
            --junitxml=reports/quality/postgres/authority-generation-flush.xml \
            > "$GDB_LOG" 2>&1
          gdb_rc=$?
          GDB_RETURN_CODE="$gdb_rc" python -S - "$GDB_LOG" "$RUNNER_TEMP/critical-pg-diagnostic/inferior-status.json" <<'PY'
          import json, os, pathlib, re, sys
          try:
              log_text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          except OSError:
              log_text = ""
          exitcode_markers = re.findall(r"(?m)^INFERIOR_EXITCODE=([^\r\n]*)$", log_text)
          exitsignal_markers = re.findall(r"(?m)^INFERIOR_EXITSIGNAL=([^\r\n]*)$", log_text)
          validation = {
              "exitcode_marker_unique": len(exitcode_markers) == 1,
              "exitcode_is_zero": exitcode_markers == ["0"],
              "exitsignal_marker_unique": len(exitsignal_markers) == 1,
              "exitsignal_is_void": exitsignal_markers == ["void"],
          }
          passed = all(validation.values())
          result = {
              "gdb_return_code": int(os.environ["GDB_RETURN_CODE"]),
              "exitcode_markers": exitcode_markers,
              "exitsignal_markers": exitsignal_markers,
              "validation": validation,
              "inferior_rc": 0 if passed else 1,
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(result, sort_keys=True))
          raise SystemExit(result["inferior_rc"])
          PY
          inferior_rc=$?
          printf 'GDB_RETURN_CODE=%s\n' "$gdb_rc" | tee "$RUNNER_TEMP/critical-pg-diagnostic/process-status.txt"
          validator_rc=125
          if [ -f reports/quality/postgres/authority-generation-flush.xml ]; then
            set +e
            "$VENV/bin/python" -S "$RUNNER_TEMP/critical-pg-diagnostic/official-validator.py"
            validator_rc=$?
            set -e
          else
            echo "Official validator not run: fresh JUnit artifact is absent." | tee -a "$RUNNER_TEMP/critical-pg-diagnostic/process-status.txt"
          fi
          printf 'OFFICIAL_VALIDATOR_RETURN_CODE=%s\n' "$validator_rc" | tee -a "$RUNNER_TEMP/critical-pg-diagnostic/process-status.txt"
          printf 'INFERIOR_RETURN_CODE=%s\n' "$inferior_rc" | tee -a "$RUNNER_TEMP/critical-pg-diagnostic/process-status.txt"
          printf 'MATRIX_FAULTHANDLER_SECONDS=%s\n' "$DUMP_SECONDS" | tee -a "$RUNNER_TEMP/critical-pg-diagnostic/process-status.txt"
          set -e
          if [ "$gdb_rc" -ne 0 ] || [ "$validator_rc" -ne 0 ] || [ "$inferior_rc" -ne 0 ]; then
            exit 1
          fi
      - name: Preserve separate non-qualifying diagnostic evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: critical-pg-diagnostic-${{ matrix.dump_seconds }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            reports/quality/postgres/authority-generation-flush.xml
            ${{ runner.temp }}/critical-pg-diagnostic/constraints.txt
            ${{ runner.temp }}/critical-pg-diagnostic/dependency-comparison.json
            ${{ runner.temp }}/critical-pg-diagnostic/gdb-commands.txt
            ${{ runner.temp }}/critical-pg-diagnostic/gdb-version.txt
            ${{ runner.temp }}/critical-pg-diagnostic/gdb.log
            ${{ runner.temp }}/critical-pg-diagnostic/inferior-status.json
            ${{ runner.temp }}/critical-pg-diagnostic/official-validator.py
            ${{ runner.temp }}/critical-pg-diagnostic/os-release.txt
            ${{ runner.temp }}/critical-pg-diagnostic/pip-freeze.txt
            ${{ runner.temp }}/critical-pg-diagnostic/pip-list.json
            ${{ runner.temp }}/critical-pg-diagnostic/postgres-container-image.txt
            ${{ runner.temp }}/critical-pg-diagnostic/postgres-image-repodigests.json
            ${{ runner.temp }}/critical-pg-diagnostic/process-status.txt
            ${{ runner.temp }}/critical-pg-diagnostic/runtime-identity.txt
            ${{ runner.temp }}/critical-pg-diagnostic/uname.txt
            ${{ runner.temp }}/critical-pg-diagnostic/validator-source.txt
