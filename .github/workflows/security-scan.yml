# Security Scan Workflow
#
# Gates:
# - Bandit: HIGH-severity findings fail the build (MEDIUM logged as warnings).
# - Dependencies: safety + pip-audit against requirements-dev.txt; any known
#   vulnerability fails the build. Tool/parse errors are fail-closed.
# - Secrets: gitleaks scans the event range for push/PR and full history for
#   release dispatch/schedule; any leak fails the build.
# - npm: `npm audit --audit-level=high` against the root package-lock.json.

name: Security Scan

on:
  workflow_call:
  push:
    branches: [main, 'dev/**']
  pull_request:
    branches: [main, 'dev/**']
  workflow_dispatch:
    inputs:
      dependency_preflight:
        description: Run the isolated native Linux dependency preflight
        required: false
        type: boolean
        default: false
  schedule:
    # Run weekly on Monday at 2:00 AM UTC; push/PR triggers are unchanged.
    - cron: '0 2 * * 1'

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit-scan:
    name: Bandit Code Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install 'bandit==1.9.*'

      - name: Run Bandit scan
        run: |
          mkdir -p reports/security
          # Bandit exits non-zero whenever it finds issues (including LOW), so
          # the gate below reads the JSON report instead of the exit code.
          bandit -r apps/ core/ shared/ -f json -o reports/security/bandit-report.json || true

          python3 - <<'PY'
          import json
          import sys

          try:
              with open('reports/security/bandit-report.json') as f:
                  data = json.load(f)
          except Exception as exc:
              # Fail closed: an unreadable report must never pass the gate.
              print(f'::error::Could not parse bandit report: {exc}')
              sys.exit(1)

          results = data.get('results', [])
          high = [r for r in results if r.get('issue_severity') == 'HIGH']
          medium = [r for r in results if r.get('issue_severity') == 'MEDIUM']
          for item in medium:
              print(
                  '::warning file={file},line={line}::Bandit MEDIUM {test_id}: {text}'.format(
                      file=item.get('filename'),
                      line=item.get('line_number'),
                      test_id=item.get('test_id'),
                      text=item.get('issue_text'),
                  )
              )
          for item in high:
              print(
                  '::error file={file},line={line}::Bandit HIGH {test_id}: {text}'.format(
                      file=item.get('filename'),
                      line=item.get('line_number'),
                      test_id=item.get('test_id'),
                      text=item.get('issue_text'),
                  )
              )
          print(f'Bandit scan complete: {len(high)} high, {len(medium)} medium')
          if high:
              sys.exit(1)
          PY

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-security-report
          path: reports/security/
          retention-days: 30

  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Safety
        run: |
          python -m pip install --upgrade pip
          # safety 2.3.x works offline without an API key (3.x requires one).
          # safety and pip-audit have conflicting transitive pins, so they are
          # installed and run sequentially instead of sharing one environment.
          pip install 'safety==2.3.5'

      - name: Create reports directory
        run: mkdir -p reports/security

      - name: Run Safety scan
        id: safety
        run: |
          # Scan declared project dependencies instead of the runner's ambient environment.
          # stderr (unpinned-requirement warnings, tracebacks) goes to a separate
          # log so the JSON report stays machine-readable.
          safety check -r requirements-dev.txt --json \
            > reports/security/safety-report.json \
            2> reports/security/safety-stderr.log || true

          VULN_COUNT=$(python3 - <<'PY'
          import json
          import sys

          try:
              with open('reports/security/safety-report.json') as f:
                  data = json.load(f)
          except Exception as exc:
              # Fail closed: tool or parse errors must not silently pass.
              print(f'::error::Could not parse safety report: {exc}', file=sys.stderr)
              print(-1)
              sys.exit(0)

          if isinstance(data, dict):
              meta = data.get('report_meta', {})
              if isinstance(meta, dict) and 'vulnerabilities_found' in meta:
                  print(meta.get('vulnerabilities_found', 0))
              else:
                  vulns = data.get('vulnerabilities', [])
                  print(len(vulns) if isinstance(vulns, list) else 0)
          elif isinstance(data, list):
              print(len(data))
          else:
              print(0)
          PY
          )

          echo "vulnerability_count=$VULN_COUNT" >> $GITHUB_OUTPUT

          if [ "$VULN_COUNT" -lt 0 ]; then
            echo "::error::safety scan failed or produced an unreadable report"
            exit 1
          fi
          if [ "$VULN_COUNT" -gt 0 ]; then
            echo "::warning::Found $VULN_COUNT known vulnerabilities in dependencies. Review reports/security/safety-report.json"
          fi

      - name: Install pip-audit
        run: |
          # pip-audit is pinned for reproducible CI behavior; installed after
          # the safety scan because the two tools have conflicting pins.
          pip install 'pip-audit==2.9.0'

      - name: Run pip-audit
        id: pip-audit
        run: |
          # PYSEC-2024-277 / CVE-2024-34997 on joblib is currently disputed by the
          # upstream maintainer and pip-audit does not publish a fix version. The
          # affected path is deserialization of trusted cached content rather than
          # a repo-owned unsafe loading entrypoint, so we keep an explicit, narrow
          # ignore here instead of failing every push on an untriageable advisory.
          #
          # GHSA-8pqf-f4m5-798g / CVE-2026-106454 is confined to an authenticated
          # Twisted IMAP server's LIST/LSUB wildcard parser. Twisted is installed
          # transitively for Daphne's HTTP/WebSocket server; this repository does
          # not expose twisted.mail or an IMAP listener, and no patched Twisted
          # release exists yet. Fail closed if that non-exposure assumption changes,
          # then keep the advisory ignore exact until a fixed release is available.
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          pattern = re.compile(
              r"(?:twisted\.mail|"
              r"from[ \t\f\v\r]+twisted[ \t\f\v\r]+import[ \t\f\v\r]+mail|"
              r"imap4|IMAP4(?:Server|Factory)|listMailboxes)"
          )
          source_roots = (
              Path("apps"), Path("config"), Path("core"), Path("shared"), Path("manage.py")
          )

          try:
              for source_root in source_roots:
                  if source_root.is_symlink():
                      raise OSError("a source root is a symlink")
                  if source_root.is_file():
                      candidates = (source_root,)
                  elif source_root.is_dir():
                      found = []
                      pending = [source_root]
                      while pending:
                          directory = pending.pop()
                          with os.scandir(directory) as entries:
                              for entry in entries:
                                  if entry.name.startswith(".") or entry.is_symlink():
                                      continue
                                  if entry.is_dir(follow_symlinks=False):
                                      pending.append(Path(entry.path))
                                  elif (
                                      entry.name.endswith(".py")
                                      and entry.is_file(follow_symlinks=False)
                                  ):
                                      found.append(Path(entry.path))
                      candidates = found
                  else:
                      raise OSError("a required source root is missing")

                  for candidate in candidates:
                      with candidate.open("r", encoding="utf-8") as source_file:
                          if any(pattern.search(line) for line in source_file):
                              print(
                                  "::error::Twisted IMAP usage invalidates the "
                                  "GHSA-8pqf-f4m5-798g non-exposure exception."
                              )
                              raise SystemExit(1)
          except (OSError, UnicodeError) as exc:
              print(
                  f"::error::Could not verify the Twisted IMAP non-exposure assumption ({type(exc).__name__}).",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

          pip-audit \
            -r requirements-dev.txt \
            --ignore-vuln PYSEC-2024-277 \
            --ignore-vuln GHSA-8pqf-f4m5-798g \
            --format json \
            --output reports/security/pip-audit-report.json \
            2>/dev/null || true

          AUDIT_COUNT=$(python3 - <<'PY'
          import json
          import sys

          try:
              with open('reports/security/pip-audit-report.json') as f:
                  data = json.load(f)
          except Exception as exc:
              # Fail closed: tool or parse errors must not silently pass.
              print(f'::error::Could not parse pip-audit report: {exc}', file=sys.stderr)
              print(-1)
              sys.exit(0)

          dependencies = data.get('dependencies', []) if isinstance(data, dict) else []
          print(sum(len(dep.get('vulns', [])) for dep in dependencies))
          PY
          )

          echo "audit_vulnerability_count=$AUDIT_COUNT" >> $GITHUB_OUTPUT

          if [ "$AUDIT_COUNT" -lt 0 ]; then
            echo "::error::pip-audit scan failed or produced an unreadable report"
            exit 1
          fi
          if [ "$AUDIT_COUNT" -gt 0 ]; then
            echo "::warning::pip-audit found $AUDIT_COUNT vulnerabilities. Review reports/security/pip-audit-report.json"
          fi

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-security-report
          path: reports/security/
          retention-days: 30

      - name: Check for critical vulnerabilities
        run: |
          # requirements-dev.txt represents the repo-owned dependency surface for CI.
          SAFETY_COUNT="${{ steps.safety.outputs.vulnerability_count }}"
          AUDIT_COUNT="${{ steps.pip-audit.outputs.audit_vulnerability_count }}"

          if [ "${SAFETY_COUNT:-0}" -gt 0 ] || [ "${AUDIT_COUNT:-0}" -gt 0 ]; then
            echo "::error::Declared dependencies still contain known vulnerabilities (safety=${SAFETY_COUNT:-0}, pip-audit=${AUDIT_COUNT:-0})."
            exit 1
          fi

  secrets-scan:
    name: Secrets Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # The action selects an event-specific range. Full history must be
          # available for release workflow_dispatch and scheduled scans.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep the scanner/parser contract explicit. The repository uses
          # rule-scoped allowlists supported and reviewed at this version.
          GITLEAKS_VERSION: '8.24.3'

  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run npm audit
        run: npm audit --audit-level=high

  dependency-preflight:
    name: Native Linux Dependency Preflight (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.dependency_preflight == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEPENDENCY_PREFLIGHT_SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11.14'

      - name: Initialize isolated dependency work directory
        run: printf 'PREPARED=%s/dependency-preflight\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Prepare committed trial inputs
        run: python scripts/prepare_dependency_preflight.py prepare --work-dir "$PREPARED"

      - name: Prepare native compiler tool environment
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pip-tools-venv"
          "$RUNNER_TEMP/pip-tools-venv/bin/python" -m pip install --disable-pip-version-check \
            'pip==26.2.2' 'setuptools==83.0.0' 'pip-tools==7.6.2' \
            2>&1 | tee "$PREPARED/pip-tools-install.log"
          "$RUNNER_TEMP/pip-tools-venv/bin/pip-compile" --version > "$PREPARED/pip-compile-version.txt"
          python --version > "$PREPARED/runner-python-version.txt"
          "$RUNNER_TEMP/pip-tools-venv/bin/python" -m pip freeze > "$PREPARED/pip-tools-environment.txt"

      - name: Resolve native locked candidate
        id: resolve
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pip-tools-venv/bin/pip-compile" \
            --resolver=backtracking \
            --no-strip-extras \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file "$PREPARED/requirements-prod.lock" \
            --constraint "$PREPARED/constraints.txt" \
            --pip-args='--index-url https://pypi.org/simple --retries 10 --timeout 60' \
            "$PREPARED/candidate-project/requirements-prod.txt" \
            2>&1 | tee "$PREPARED/pip-compile.log"

      - name: Verify exact candidate lock delta
        id: verify-lock
        if: steps.resolve.outcome == 'success'
        run: python scripts/prepare_dependency_preflight.py verify-lock --work-dir "$PREPARED"

      - name: Install full candidate lock in a clean runtime environment
        id: runtime-install
        if: steps.verify-lock.outcome == 'success'
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/dependency-runtime-venv"
          "$RUNNER_TEMP/dependency-runtime-venv/bin/python" -m pip install --disable-pip-version-check \
            -r "$PREPARED/requirements-prod.lock" \
            2>&1 | tee "$PREPARED/runtime-install.log"

      - name: Check installed runtime dependencies
        id: runtime-check
        if: ${{ !cancelled() && steps.runtime-install.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/dependency-runtime-venv/bin/python" -m pip check \
            2>&1 | tee "$PREPARED/runtime-pip-check.log"

      - name: Exercise Daphne HTTP, HTTPS, WS, and WSS
        id: transport
        if: ${{ !cancelled() && steps.runtime-install.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/dependency-runtime-venv/bin/python" \
            scripts/check_daphne_transport_compatibility.py \
            --expected-lock "$PREPARED/requirements-prod.lock" \
            --output-dir "$PREPARED/transport" \
            2>&1 | tee "$PREPARED/daphne-transport-run.log"

      - name: Prepare isolated full-lock audit environment
        id: audit-tools
        if: ${{ !cancelled() && steps.verify-lock.outcome == 'success' }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/dependency-audit-venv"
          "$RUNNER_TEMP/dependency-audit-venv/bin/python" -m pip install --disable-pip-version-check \
            'pip==26.2.2' 'setuptools==83.0.0' 'pip-audit==2.9.0' \
            2>&1 | tee "$PREPARED/pip-audit-install.log"
          "$RUNNER_TEMP/dependency-audit-venv/bin/pip-audit" --version > "$PREPARED/pip-audit-version.txt"
          "$RUNNER_TEMP/dependency-audit-venv/bin/python" -m pip freeze > "$PREPARED/pip-audit-environment.txt"

      - name: Audit every resolved production pin
        id: audit
        if: ${{ !cancelled() && steps.audit-tools.outcome == 'success' && steps.verify-lock.outcome == 'success' }}
        run: |
          set -uo pipefail
          set +e
          "$RUNNER_TEMP/dependency-audit-venv/bin/pip-audit" \
            -r "$PREPARED/requirements-prod.lock" \
            --no-deps \
            --disable-pip \
            --format json \
            --output "$PREPARED/pip-audit.json" \
            > "$PREPARED/pip-audit.stdout.log" \
            2> "$PREPARED/pip-audit.stderr.log"
          audit_status=$?
          printf '%s\n' "$audit_status" > "$PREPARED/pip-audit.exit-code"
          set -e
          python scripts/prepare_dependency_preflight.py verify-audit --work-dir "$PREPARED"
          if [ "$audit_status" -ne 0 ]; then
            echo "::error::pip-audit returned $audit_status after report coverage verification"
            exit "$audit_status"
          fi

      - name: Upload dependency preflight inputs and results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dependency-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/dependency-preflight/
          if-no-files-found: warn
          retention-days: 30
  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [bandit-scan, dependency-scan, secrets-scan, npm-audit]
    if: always()

    steps:
      - name: Download security artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: '*-security-report'
          path: reports/security/

      - name: Generate summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY

          for job in bandit-scan dependency-scan secrets-scan npm-audit; do
            case "$job" in
              bandit-scan) result="${{ needs.bandit-scan.result }}" ;;
              dependency-scan) result="${{ needs.dependency-scan.result }}" ;;
              secrets-scan) result="${{ needs.secrets-scan.result }}" ;;
              npm-audit) result="${{ needs.npm-audit.result }}" ;;
            esac
            if [ "$result" == "success" ]; then
              echo "| $job | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $job | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reports are available as artifacts (retained for 30 days)." >> $GITHUB_STEP_SUMMARY

      - name: Overall status
        run: |
          FAILED=0
          for result in \
            "${{ needs.bandit-scan.result }}" \
            "${{ needs.dependency-scan.result }}" \
            "${{ needs.secrets-scan.result }}" \
            "${{ needs.npm-audit.result }}"; do
            if [ "$result" != "success" ]; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more security scans failed. Please review the reports."
            exit 1
          fi
          echo "All security scans passed!"
