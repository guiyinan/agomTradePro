name: Architecture Layer Guard

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - 'dev/**'
  push:
    branches:
      - main
      - 'dev/**'
  workflow_dispatch:

concurrency:
  group: architecture-layer-guard-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Collect diff range
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            HEAD_REF="${{ github.sha }}"
            ARCH_BASE_REF="origin/${{ github.base_ref }}"
            ARCH_HEAD_REF="${{ github.sha }}"
            if ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_REF"
            fi
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_REF="${{ github.event.before }}"
            HEAD_REF="${{ github.sha }}"
            ARCH_BASE_REF="${BASE_REF}"
            if [[ "${BASE_REF}" =~ ^0{40}$ ]] || [[ "${BASE_REF}" =~ ^0{64}$ ]] || ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
              if git rev-parse "${HEAD_REF}^" >/dev/null 2>&1; then
                ARCH_BASE_REF="$(git rev-parse "${HEAD_REF}^")"
              else
                ARCH_BASE_REF="${HEAD_REF}"
              fi
            fi
          else
            # workflow_dispatch: check only the latest commit to avoid flagging legacy code
            HEAD_REF="$(git rev-parse HEAD)"
            if git rev-parse "${HEAD_REF}^" >/dev/null 2>&1; then
              BASE_REF="$(git rev-parse "${HEAD_REF}^")"
              ARCH_BASE_REF="${BASE_REF}"
            else
              BASE_REF=""
              ARCH_BASE_REF="${HEAD_REF}"
            fi
            ARCH_HEAD_REF="${HEAD_REF}"
          fi
          ARCH_HEAD_REF="${HEAD_REF}"
          echo "BASE_REF=${BASE_REF}" >> "$GITHUB_ENV"
          echo "HEAD_REF=${HEAD_REF}" >> "$GITHUB_ENV"
          echo "ARCH_BASE_REF=${ARCH_BASE_REF}" >> "$GITHUB_ENV"
          echo "ARCH_HEAD_REF=${ARCH_HEAD_REF}" >> "$GITHUB_ENV"

      - name: Enforce four-layer architecture guard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_architecture_delta.py \
            --rules-file governance/architecture_rules.json \
            --base-ref "$ARCH_BASE_REF" \
            --head-ref "$ARCH_HEAD_REF" \
            --include-audit \
            --fail-on-audit-violations \
            --format text

      - name: Verify versioned architecture boundaries
        run: |
          python scripts/verify_architecture.py \
            --rules-file governance/architecture_rules.json \
            --format text \
            --include-audit \
            --fail-on-audit-violations

      - name: Enforce module cycle baseline
        run: |
          python scripts/check_module_cycles.py \
            --allowlist-file governance/module_cycle_allowlist.json \
            --fail-on-cycles \
            --format text

      - name: Verify module map projection is current
        run: python scripts/check_module_map.py

      - name: Verify data dictionary projection is current
        run: python scripts/check_data_dictionary.py

      - name: Enforce REF-01 data dictionary model delta
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BASE_REF}" || -z "${HEAD_REF}" ]]; then
            echo "REF-01 model delta requires exact base and head commit OIDs; no valid base was collected."
            exit 2
          fi
          if [[ ! "${BASE_REF}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]] || [[ ! "${HEAD_REF}" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "REF-01 model delta requires full commit OIDs; symbolic refs and zero push bases are not accepted."
            exit 2
          fi
          if [[ "${BASE_REF}" =~ ^0{40}$ ]] || [[ "${BASE_REF}" =~ ^0{64}$ ]]; then
            echo "REF-01 model delta cannot use an all-zero push base; an exact prior commit is required."
            exit 2
          fi
          if [[ "${BASE_REF}" == "${HEAD_REF}" ]]; then
            echo "REF-01 model delta requires distinct base and head commits; an empty same-commit range is not accepted."
            exit 2
          fi
          if ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null || ! git cat-file -e "${HEAD_REF}^{commit}" 2>/dev/null; then
            echo "REF-01 model delta could not resolve the exact base/head commit pair."
            exit 2
          fi
          if [[ "$(git rev-parse HEAD)" != "${HEAD_REF}" ]]; then
            echo "REF-01 model delta head must match the checked-out commit."
            exit 2
          fi
          python scripts/check_data_dictionary.py \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF"

      - name: Test REF-01 data dictionary model delta cases
        run: python -m unittest tests.unit.test_data_dictionary_delta

  structure-audit-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate structural architecture audit
        run: |
          python scripts/verify_architecture.py \
            --rules-file governance/architecture_rules.json \
            --format text \
            --include-audit \
            --write-report reports/architecture/architecture-audit.json \
            --write-ledger reports/architecture/module-ledger.md

      - name: Generate module cycle report
        run: |
          python scripts/check_module_cycles.py \
            --allowlist-file governance/module_cycle_allowlist.json \
            --format text \
            --write-report reports/architecture/module-cycles.json

      - name: Upload architecture audit artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: architecture-audit
          path: reports/architecture/
