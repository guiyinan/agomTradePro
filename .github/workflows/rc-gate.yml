name: RC Gate (Release Candidate)

on:
  push:
    tags:
      - 'v*.*.*-rc*'
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Optional full ancestor SHA for cumulative incremental checks'
        required: false
        type: string

permissions:
  contents: read
  issues: write

# Reuse daily implementations at this exact commit; never copy their thresholds.
# Full regression is mandatory even when incremental selection finds no changes.
jobs:
  architecture:
    uses: ./.github/workflows/architecture-layer-guard.yml
  consistency:
    uses: ./.github/workflows/consistency-check.yml
  security:
    uses: ./.github/workflows/security-scan.yml
  fast:
    uses: ./.github/workflows/ci-fast-feedback.yml
    with:
      base_ref: ${{ inputs.base_ref || '' }}
  regression:
    uses: ./.github/workflows/nightly-tests.yml
  publication:
    uses: ./.github/workflows/ci-publication-postgres.yml

  journey:
    name: Required RC user journeys (CI environment)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and verify frontend bundle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e sdk/
          python -m playwright install --with-deps chromium
          npm ci
          npm run check:tui
      - name: Run required user journeys
        env:
          AGOM_PLAYWRIGHT_DB_PATH: ${{ runner.temp }}/agomtradepro-rc-playwright.sqlite3
          DJANGO_SETTINGS_MODULE: core.settings.playwright
        run: |
          python manage.py migrate --noinput --settings=core.settings.playwright
          python scripts/run_live_server_pytest.py \
            --suite-name rc-journey-tests \
            --host 127.0.0.1 \
            --port 8000 \
            --base-url http://127.0.0.1:8000 \
            --settings-module core.settings.playwright \
            --health-timeout 180 \
            --min-tests 20 \
            --require-no-skips \
            --junitxml reports/journey-results.xml \
            --server-log reports/journey-server.log \
            --pytest-log reports/journey-pytest.log \
            -- \
            tests/playwright/tests/uat/ -v --tb=short --reuse-db \
            -m "not live_required and not optional_runtime and not diagnostic"
      - name: Upload journey evidence even on failure
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rc-journey-evidence
          path: reports/journey-*
          retention-days: 90

  rc-gate-summary:
    name: RC Gate Summary
    runs-on: ubuntu-latest
    needs: [architecture, consistency, security, fast, regression, publication, journey]
    if: always()
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Summarize actual results and enforce required gates
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python scripts/rc_gate_report.py
      - name: Retain RC report even when blocked
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rc-gate-report
          path: reports/quality/rc-gate-report.json
          if-no-files-found: error
          retention-days: 90
