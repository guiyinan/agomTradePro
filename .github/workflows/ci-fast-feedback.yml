name: CI Fast Feedback

on:
  pull_request:
    branches:
      - main
      - 'dev/**'
  push:
    branches:
      - main
      - 'dev/**'
  workflow_dispatch:

concurrency:
  group: ci-fast-feedback-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tdd:
    name: No-database TDD suite
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SECRET_KEY: ci-fast-tdd-secret-key-123456789012345678901234567890
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e sdk/

      - name: Verify test-tier inventory
        run: python scripts/test_tier_inventory.py --check

      - name: Run fast suite without creating a test database
        run: python scripts/run_fast_tests.py

  detect-tests:
    name: Detect test scope
    runs-on: ubuntu-latest
    outputs:
      base-ref: ${{ steps.refs.outputs.base-ref }}
      head-ref: ${{ steps.refs.outputs.head-ref }}
      changed-modules: ${{ steps.modules.outputs.changed-modules }}
      tui-changed: ${{ steps.tui-scope.outputs.changed }}
      test-paths: ${{ steps.tests.outputs.test-paths }}
      test-count: ${{ steps.tests.outputs.test-count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve diff refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --prune --depth=1 origin "${{ github.base_ref }}"
            BASE_REF="origin/${{ github.base_ref }}"
            HEAD_REF="${{ github.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BASE_REF="${{ github.event.before }}"
            HEAD_REF="${{ github.sha }}"
            if [[ "${BASE_REF}" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null; then
              if git rev-parse "${HEAD_REF}^" >/dev/null 2>&1; then
                BASE_REF="$(git rev-parse "${HEAD_REF}^")"
              else
                BASE_REF="${HEAD_REF}"
              fi
            fi
          else
            BASE_REF="$(git rev-parse HEAD~1)"
            HEAD_REF="$(git rev-parse HEAD)"
          fi

          echo "base-ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "head-ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"

      - name: Detect changed modules
        id: modules
        shell: bash
        run: |
          set -euo pipefail
          CHANGED_MODULES="$(
            git diff --name-only "${{ steps.refs.outputs.base-ref }}...${{ steps.refs.outputs.head-ref }}" 2>/dev/null \
              | awk -F/ '
                  /^apps\/[^\/]+\// { print $2; next }
                  /^core\// { print "core"; next }
                  /^shared\// { print "shared"; next }
                  /^\.github\// { print "ci"; next }
                ' \
              | sort -u \
              | tr '\n' ',' \
              | sed 's/,$//'
          )"
          echo "changed-modules=${CHANGED_MODULES:-none}" >> "$GITHUB_OUTPUT"

      - name: Detect TUI guardrail scope
        id: tui-scope
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "${{ steps.refs.outputs.base-ref }}...${{ steps.refs.outputs.head-ref }}" \
            | grep -Eq '^(apps/terminal/|frontend/agomtui-runtime/|frontend/agomtradepro-host/|static/js/tui-workbench\.js$|static/css/tui-workbench\.css$|core/templates/terminal/tui_workbench\.html$|config/tui/|scripts/build-tui-runtime\.mjs$|scripts/tui-runtime-manifest\.mjs$|tests/playwright/tests/smoke/test_tui_layout_guardrail\.py$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select pytest targets
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_PATHS="$(python scripts/select_tests.py \
            --base "${{ steps.refs.outputs.base-ref }}" \
            --head "${{ steps.refs.outputs.head-ref }}" \
            --profile logic_guardrails \
            --output-format space)"

          if [[ -z "${TEST_PATHS}" ]]; then
            TEST_PATHS="tests/guardrails/"
          fi

          echo "Selected tests: ${TEST_PATHS}"
          {
            echo "test-paths<<EOF"
            echo "${TEST_PATHS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "test-count=$(wc -w <<< "${TEST_PATHS}" | tr -d ' ')" >> "$GITHUB_OUTPUT"

  incremental-quality:
    name: Incremental quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify TUI Runtime bundles
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check:tui
          npm run test:tui-js

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e sdk/

      - name: Resolve incremental quality targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail

          LINT_TARGETS="$(python scripts/select_quality_targets.py \
            --base "${{ needs.detect-tests.outputs.base-ref }}" \
            --head "${{ needs.detect-tests.outputs.head-ref }}" \
            --profile lint \
            --output-format space)"
          TYPECHECK_TARGETS="$(python scripts/select_quality_targets.py \
            --base "${{ needs.detect-tests.outputs.base-ref }}" \
            --head "${{ needs.detect-tests.outputs.head-ref }}" \
            --profile typecheck \
            --output-format space)"
          DOMAIN_COVERAGE_TARGETS="$(python scripts/select_quality_targets.py \
            --base "${{ needs.detect-tests.outputs.base-ref }}" \
            --head "${{ needs.detect-tests.outputs.head-ref }}" \
            --profile domain-coverage \
            --output-format space)"

          {
            echo "lint-targets<<EOF"
            echo "${LINT_TARGETS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "typecheck-targets<<EOF"
            echo "${TYPECHECK_TARGETS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "domain-coverage-targets<<EOF"
            echo "${DOMAIN_COVERAGE_TARGETS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "lint-count=$(wc -w <<< "${LINT_TARGETS}" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "typecheck-count=$(wc -w <<< "${TYPECHECK_TARGETS}" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "domain-coverage-count=$(wc -w <<< "${DOMAIN_COVERAGE_TARGETS}" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Enforce changed Python file-size headroom
        run: |
          python scripts/check_changed_python_file_size.py \
            --base "${{ needs.detect-tests.outputs.base-ref }}" \
            --head "${{ needs.detect-tests.outputs.head-ref }}"

      - name: Run ruff on changed Python files
        if: steps.targets.outputs.lint-count != '0'
        run: |
          python -m ruff check \
            ${{ steps.targets.outputs.lint-targets }}

      - name: Run black --check on changed Python files
        if: steps.targets.outputs.lint-count != '0'
        run: |
          python -m black --check \
            ${{ steps.targets.outputs.lint-targets }}

      - name: Run isort --check-only on changed Python files
        if: steps.targets.outputs.lint-count != '0'
        run: |
          python -m isort --check-only \
            ${{ steps.targets.outputs.lint-targets }}

      - name: Run mypy on changed application sources
        if: steps.targets.outputs.typecheck-count != '0'
        run: |
          python scripts/check_mypy_regression.py \
            ${{ steps.targets.outputs.typecheck-targets }}

      - name: Enforce full-production mypy debt ceiling
        run: |
          python scripts/check_mypy_debt_ceiling.py \
            --reference-ref "${{ needs.detect-tests.outputs.base-ref }}"

      - name: Enforce critical Celery task contracts
        run: |
          python scripts/check_celery_task_contracts.py \
            --base-ref "${{ needs.detect-tests.outputs.base-ref }}" \
            --head-ref "${{ needs.detect-tests.outputs.head-ref }}"

      - name: Run incremental domain coverage gate
        if: steps.targets.outputs.domain-coverage-count != '0'
        run: |
          python - <<'PY'
          import shlex
          import subprocess

          targets = """${{ steps.targets.outputs.domain-coverage-targets }}""".split()
          cmd = [
              "pytest",
              "tests/unit/domain/",
              "-v",
              "--tb=short",
              "-o",
              "addopts=",
              "--cov-fail-under=70",
              "--cov-report=term-missing",
          ]
          cmd.extend(f"--cov={target}" for target in targets)
          print("Running incremental domain coverage gate:")
          print(" ".join(shlex.quote(part) for part in cmd))
          raise SystemExit(subprocess.call(cmd))
          PY

  fast-feedback:
    name: Fast feedback (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: detect-tests
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
      fail-fast: false
    env:
      SECRET_KEY: ci-fast-feedback-secret-key-123456789012345678901234567890
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e sdk/

      - name: Prepare database
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check

      - name: Run targeted pytest suite
        run: |
          echo "Changed modules: ${{ needs.detect-tests.outputs.changed-modules }}"
          echo "Running ${{ needs.detect-tests.outputs.test-count }} targets"
          pytest -v --tb=short --durations=15 \
            ${{ needs.detect-tests.outputs.test-paths }}

      - name: Check RTM key requirements
        run: |
          # 验证关键 RTM 项的测试存在
          echo "Checking RTM requirements..."
          test -f tests/guardrails/test_architecture_boundaries.py || exit 1
          test -f tests/guardrails/test_logic_guardrails.py || exit 1
          test -f tests/guardrails/test_alpha_workspace_consistency_guardrail.py || exit 1
          test -f tests/guardrails/test_no_501_on_primary_paths.py || exit 1
          test -f tests/integration/signal/test_signal_workflow.py || exit 1
          test -f tests/integration/audit/test_api_endpoints.py || exit 1
          test -f tests/critical/test_decision_and_data_safety.py || exit 1
          test -f tests/critical/test_risk_and_order_safety.py || exit 1
          test -f tests/critical/test_agent_and_recovery_safety.py || exit 1
          test -f tests/migrations/test_research_integrity_migrations.py || exit 1
          echo "RTM key requirements: PASSED"

      - name: Install TUI browser runtime
        if: needs.detect-tests.outputs.tui-changed == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run TUI metadata projection guard
        if: needs.detect-tests.outputs.tui-changed == 'true'
        run: pytest tests/unit/terminal/test_tui_contract_guardrails.py -q

      - name: Run TUI browser layout guard
        if: needs.detect-tests.outputs.tui-changed == 'true'
        env:
          DJANGO_SETTINGS_MODULE: core.settings.development_sqlite
          PYTEST_PLAYWRIGHT_DRIVER: chromium
        run: |
          python scripts/run_live_server_pytest.py \
            --suite-name fast-tui-layout-guard \
            --host 127.0.0.1 \
            --port 8000 \
            --base-url http://127.0.0.1:8000 \
            --settings-module core.settings.development_sqlite \
            --health-timeout 180 \
            --min-tests 3 \
            --junitxml reports/quality/fast-tui-layout-guard.xml \
            --server-log reports/quality/fast-tui-layout-guard.server.log \
            --pytest-log reports/quality/fast-tui-layout-guard.pytest.log \
            -- \
            tests/playwright/tests/smoke/test_tui_layout_guardrail.py -v \
            --screenshot=only-on-failure

      - name: Production static sanity check
        env:
          DJANGO_SETTINGS_MODULE: core.settings.production
          DATABASE_URL: postgresql://agomtradepro:test@localhost:5432/agomtradepro
        run: |
          python manage.py check
          python manage.py collectstatic --noinput -v 0
