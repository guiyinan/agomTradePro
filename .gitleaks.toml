title = "AgomTradePro gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Allow the exact public simulated fill trade identifier schema"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*_TRADE_KEY_SCHEMA\s*=\s*"simulated-order-fill-trade-key\.v1"\s*$''']
paths = ['''^apps/simulated_trading/domain/order_reservation_fill_settlement\.py$''']

[[rules.allowlists]]
description = "Allow the exact synthetic fill application order identifier"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*idempotency_key="fill-order-application-001",\s*$''']
paths = ['''^tests/unit/simulated_trading/test_order_reservation_fill_application\.py$''']

[[rules.allowlists]]
description = "Allow exact correlation window field keys in generated TUI projections"
condition = "AND"
regexTarget = "line"
regexes = ['''"key"\s*:\s*"correlation_(20d|60d)"''']
paths = ['''^config/tui/(generated/tui_operation_graph\.generated|published/tui_operation_graph\.published)\.json$''']

[[rules.allowlists]]
description = "Allow DATA-01 schema digests in content-addressed non-production evidence"
condition = "AND"
regexTarget = "line"
regexes = ['''"schema_sha256"\s*:\s*"[0-9a-f]{64}"''']
paths = ['''^docs/deployment/data01-isolated-restore/[0-9a-f]{2}/[0-9a-f]{64}\.json$''']

[[rules.allowlists]]
description = "Allow generated TUI runtime content hashes"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"apps/terminal/infrastructure/[^\"]+"\s*:\s*"[0-9a-f]{64}",?\s*$''']
paths = ['''^config/tui/agomtui-runtime\.manifest\.json$''']

[[rules.allowlists]]
description = "Allow the exact DATA-01 migration identifier misclassified as an API key"
condition = "AND"
stopwords = ['''0068_evaluation_actual_ledgers''']
paths = ['''^docs/deployment/data01-isolated-restore/[0-9a-f]{2}/[0-9a-f]{64}\.json$''']

[[rules.allowlists]]
description = "Allow the exact verified Case8 session fingerprint, never a session credential"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"session_key_sha256"\s*:\s*"0d4f69f9807442cc7f2b082c87f333cdaab8128be10ff30ae5826301e2245c86",?\s*$''']
paths = ['''^docs/deployment/evid09-passing-facade-reuse-lifecycle-2026-09-14\.json$''']

[[rules.allowlists]]
description = "Allow only whole-line path-to-SHA256 mappings in the exact reviewed evidence files"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"(?:\.tmp|apps|artifacts|core|docs|frontend|governance|output|qmt_agent|scripts|sdk|shared|static|staticfiles|streamlit_app|tests)/[^"]+"\s*:\s*"[0-9a-f]{64}",?\s*$''']
