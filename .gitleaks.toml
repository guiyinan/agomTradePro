title = "AgomTradePro gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Allow exact correlation window field keys in generated TUI projections"
condition = "AND"
regexTarget = "line"
regexes = ['''"key"\s*:\s*"correlation_(20d|60d)"''']
paths = ['''^config/tui/(generated/tui_operation_graph\.generated|published/tui_operation_graph\.published)\.json$''']

[[rules.allowlists]]
description = "Allow DATA-01 schema digests in content-addressed non-production evidence"
condition = "AND"
regexTarget = "line"
regexes = ['''"schema_sha256"\s*:\s*"[0-9a-f]{64}"''']
paths = ['''^docs/deployment/data01-isolated-restore/[0-9a-f]{2}/[0-9a-f]{64}\.json$''']

[[rules.allowlists]]
description = "Allow generated TUI runtime content hashes"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"apps/terminal/infrastructure/[^\"]+"\s*:\s*"[0-9a-f]{64}",?\s*$''']
paths = ['''^config/tui/agomtui-runtime\.manifest\.json$''']

[[rules.allowlists]]
description = "Allow the exact DATA-01 migration identifier misclassified as an API key"
condition = "AND"
stopwords = ['''0068_evaluation_actual_ledgers''']
paths = ['''^docs/deployment/data01-isolated-restore/[0-9a-f]{2}/[0-9a-f]{64}\.json$''']

[[rules.allowlists]]
description = "Allow the exact verified Case8 session fingerprint, never a session credential"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"session_key_sha256"\s*:\s*"0d4f69f9807442cc7f2b082c87f333cdaab8128be10ff30ae5826301e2245c86",?\s*$''']
paths = ['''^docs/deployment/evid09-passing-facade-reuse-lifecycle-2026-09-14\.json$''']

[[rules.allowlists]]
description = "Allow only whole-line path-to-SHA256 mappings in the exact reviewed evidence files"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"(?:\.tmp|apps|artifacts|core|docs|frontend|governance|output|qmt_agent|scripts|sdk|shared|static|staticfiles|streamlit_app|tests)/[^"]+"\s*:\s*"[0-9a-f]{64}",?\s*$''']
paths = ['''^(?:artifacts/a\-share\-usability/ash01/account\-fee\-availability\-evidence\-2026\-10\-18\.json|artifacts/a\-share\-usability/ash01/capital\-flow\-append\-only\-evidence\-2026\-10\-18\.json|artifacts/a\-share\-usability/ash01/formal\-calendar\-size\-evidence\-2026\-10\-18\.json|artifacts/a\-share\-usability/ash01/mcp\-default\-scope\-evidence\-2026\-10\-18\.json|artifacts/a\-share\-usability/ash01/sdk\-single\-attempt\-evidence\-2026\-10\-18\.json|artifacts/a\-share\-usability/ash01/settlement\-domain\-size\-evidence\-2026\-10\-18\.json|artifacts/a\-share\-usability/ash02/calendar\-capture\-export\-architecture\-sources\.json|artifacts/a\-share\-usability/ash02/calendar\-capture\-final\-export\-architecture\-sources\.json|artifacts/a\-share\-usability/ash02/calendar\-http\-export\-architecture\-sources\.json|artifacts/a\-share\-usability/ash02/calendar\-http\-final\-export\-architecture\-sources\.json|artifacts/a\-share\-usability/ash02/calendar\-http\-final\-index\-bounded\-quality\.json|artifacts/a\-share\-usability/ash02/calendar\-http\-final\-index\-coverage\-sources\.json|artifacts/a\-share\-usability/ash02/calendar\-http\-index\-bounded\-quality\.json|artifacts/a\-share\-usability/ash02/calendar\-http\-index\-coverage\-sources\.json|artifacts/a\-share\-usability/ash02/calendar\-operations\-http\-root\-initial\-sources\.json|artifacts/a\-share\-usability/ash02/calendar\-operations\-http\-root\-response\-release\-fixed\-sources\.json|artifacts/a\-share\-usability/ash02/calendar\-operations\-http\-root\-typed\-decorator\-fixed\-sources\.json|artifacts/a\-share\-usability/ash02/calendar\-preview\-foundation\-root\-annotations\-sources\.json|artifacts/a\-share\-usability/ash02/calendar\-preview\-foundation\-root\-quality\-sources\.json|artifacts/a\-share\-usability/ash02/calendar\-preview\-foundation\-root\-reference\.json|artifacts/a\-share\-usability/ash02/calendar\-preview\-foundation\-root\-typing\-sources\.json|artifacts/a\-share\-usability/ash02/