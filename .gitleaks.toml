title = "AgomTradePro gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Allow exact correlation window field keys in generated TUI projections"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''"key"\s*:\s*"correlation_(20d|60d)"''']
paths = ['''^config/tui/(generated/tui_operation_graph\.generated|published/tui_operation_graph\.published)\.json$''']

[[allowlists]]
description = "Allow DATA-01 schema digests in content-addressed non-production evidence"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''"schema_sha256"\s*:\s*"[0-9a-f]{64}"''']
paths = ['''^docs/deployment/data01-isolated-restore/[0-9a-f]{2}/[0-9a-f]{64}\.json$''']

[[allowlists]]
description = "Allow generated TUI runtime content hashes"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"apps/terminal/infrastructure/[^\"]+"\s*:\s*"[0-9a-f]{64}",?\s*$''']
paths = ['''^config/tui/agomtui-runtime\.manifest\.json$''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Allow the exact DATA-01 migration identifier misclassified as an API key"
condition = "AND"
stopwords = ['''0068_evaluation_actual_ledgers''']
paths = ['''^docs/deployment/data01-isolated-restore/e1/e13d10587add53aa1b6e53f3143f05f4de4cf30d7f8e465d833457da88016870\.json$''']
