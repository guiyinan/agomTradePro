<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307111b'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='sans-serif' font-size='23' fill='%2382e6c5'%3EA%3C/text%3E%3C/svg%3E">
  <title>AgomTradePro 产品路演</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111b;
      --bg-deep: #040a11;
      --panel: rgba(15, 29, 43, 0.82);
      --panel-solid: #0f1d2b;
      --line: rgba(177, 206, 218, 0.16);
      --line-strong: rgba(177, 206, 218, 0.3);
      --text: #f3f7f7;
      --muted: #9eb0ba;
      --soft: #6f8591;
      --mint: #82e6c5;
      --mint-deep: #173f3a;
      --amber: #f6c877;
      --blue: #83bdf5;
      --rose: #f3a4ac;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      --controls-height: 88px;
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 4%, rgba(54, 140, 125, 0.16), transparent 32%),
        radial-gradient(circle at 92% 90%, rgba(51, 93, 143, 0.16), transparent 36%),
        linear-gradient(145deg, var(--bg), var(--bg-deep));
    }

    button,
    a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--mint);
      outline-offset: 3px;
    }

    .app {
      position: relative;
      display: grid;
      grid-template-rows: 64px minmax(0, 1fr) var(--controls-height) 3px;
      width: 100%;
      height: 100dvh;
    }

    .app::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image: linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
      background-size: 44px 44px;
      content: "";
      mask-image: linear-gradient(to bottom, black, transparent 80%);
      pointer-events: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100%, 1540px);
      margin: 0 auto;
      padding: 0 clamp(20px, 4cqw, 60px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      gap: 12px;
      align-items: center;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid rgba(130, 230, 197, 0.48);
      border-radius: 9px;
      color: var(--mint);
      background: rgba(130, 230, 197, 0.08);
      font-size: 14px;
      font-weight: 800;
    }

    .deck-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 16px rgba(130, 230, 197, 0.72);
    }

    .stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    #slideHost {
      position: relative;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .slide-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1440px;
      height: 810px;
      container: roadshow / size;
      transform: translate(-50%, -50%) scale(var(--slide-scale, 1));
    }

    .app[data-layout="reading"] .slide-frame {
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transform: none;
    }

    .print-risk {
      display: none;
    }

    .slide {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      justify-content: safe center;
      width: min(100%, 1480px);
      height: 100%;
      margin: 0 auto;
      padding: clamp(24px, 4cqh, 52px) clamp(24px, 4.5cqw, 68px);
      overflow: auto;
      scrollbar-color: var(--line-strong) transparent;
      scrollbar-width: thin;
      animation: slide-in 320ms ease both;
    }

    .slide > * {
      flex-shrink: 0;
    }

    @keyframes slide-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .slide-header {
      margin-bottom: clamp(20px, 3.2cqh, 36px);
    }

    .chapter {
      margin: 0 0 14px;
      color: var(--mint);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: clamp(10px, 1cqw, 12px);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .slide-title {
      max-width: 1180px;
      margin: 0;
      font-size: clamp(30px, 3.5cqw, 52px);
      font-weight: 660;
      letter-spacing: -0.045em;
      line-height: 1.16;
    }

    .lead {
      max-width: 1120px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 1.55cqw, 21px);
      line-height: 1.7;
    }

    .footnote {
      margin: auto 0 0;
      padding-top: clamp(18px, 3cqh, 30px);
      color: var(--soft);
      font-size: clamp(11px, 1cqw, 13px);
      line-height: 1.65;
    }

    .cover-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.55fr);
      gap: clamp(34px, 6cqw, 92px);
      align-items: center;
    }

    .cover-title {
      max-width: 960px;
      margin: 0;
      font-size: clamp(46px, 5.2cqw, 76px);
      font-weight: 680;
      letter-spacing: -0.065em;
      line-height: 1.08;
    }

    .cover-subtitle {
      margin: 20px 0 0;
      color: var(--mint);
      font-size: clamp(24px, 3cqw, 42px);
      font-weight: 450;
      letter-spacing: -0.035em;
    }

    .cover-description {
      max-width: 820px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 1.6cqw, 21px);
      line-height: 1.8;
    }

    .cover-footer {
      margin: 30px 0 0;
      color: var(--soft);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    .cover-visual {
      position: relative;
      display: grid;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(130, 230, 197, 0.1), transparent 66%);
    }

    .cover-visual::before,
    .cover-visual::after {
      position: absolute;
      border: 1px solid var(--line);
      border-radius: 50%;
      content: "";
    }

    .cover-visual::before {
      inset: 12%;
    }

    .cover-visual::after {
      inset: 27%;
      border-color: rgba(130, 230, 197, 0.28);
    }

    .cover-core {
      z-index: 1;
      text-align: center;
    }

    .cover-core strong {
      display: block;
      color: var(--text);
      font-size: clamp(20px, 2cqw, 30px);
      letter-spacing: -0.04em;
    }

    .cover-core span {
      display: block;
      margin-top: 10px;
      color: var(--mint);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
    }

    .orbit-tag {
      position: absolute;
      z-index: 2;
      padding: 8px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--muted);
      background: var(--panel-solid);
      box-shadow: var(--shadow);
      font-size: 12px;
      white-space: nowrap;
    }

    .orbit-tag:nth-child(1) {
      top: 4%;
      left: 36%;
    }

    .orbit-tag:nth-child(2) {
      top: 43%;
      right: -7%;
    }

    .orbit-tag:nth-child(3) {
      bottom: 4%;
      left: 32%;
    }

    .orbit-tag:nth-child(4) {
      top: 43%;
      left: -7%;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.025);
      font-size: 12px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(12px, 1.5cqw, 20px);
    }

    .evidence-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      background: var(--panel);
    }

    .evidence-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: clamp(14px, 1.2cqw, 18px);
      line-height: 1.65;
    }

    .evidence-table th,
    .evidence-table td {
      padding: clamp(12px, 1.4cqw, 20px);
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .evidence-table thead {
      color: var(--mint);
      background: rgba(130, 230, 197, 0.07);
    }

    .evidence-table td {
      color: var(--muted);
    }

    .evidence-table tbody th {
      width: 24%;
      color: var(--text);
      font-weight: 600;
    }

    .evidence-table tr:last-child > * {
      border-bottom: 0;
    }

    .evidence-table thead tr > * {
      border-bottom: 1px solid var(--line-strong);
    }

    .card {
      position: relative;
      min-height: 210px;
      padding: clamp(20px, 2cqw, 28px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(20, 39, 53, 0.9), rgba(12, 25, 37, 0.72));
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
    }

    .card::after {
      position: absolute;
      right: -34px;
      bottom: -46px;
      width: 120px;
      height: 120px;
      border: 1px solid rgba(130, 230, 197, 0.08);
      border-radius: 50%;
      content: "";
    }

    .card-index {
      display: inline-grid;
      width: 36px;
      height: 36px;
      place-items: center;
      margin-bottom: 26px;
      border: 1px solid rgba(130, 230, 197, 0.25);
      border-radius: 10px;
      color: var(--mint);
      background: rgba(130, 230, 197, 0.06);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
    }

    .card-title {
      margin: 0 0 12px;
      font-size: clamp(18px, 1.6cqw, 23px);
      font-weight: 620;
      letter-spacing: -0.025em;
    }

    .card-body {
      margin: 0;
      color: var(--muted);
      font-size: clamp(13px, 1.15cqw, 16px);
      line-height: 1.75;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      margin-top: 10px;
    }

    .step {
      position: relative;
      padding: 30px clamp(18px, 2cqw, 28px) 26px 0;
    }

    .step:not(:last-child) {
      border-right: 1px solid var(--line);
    }

    .step:not(:first-child) {
      padding-left: clamp(18px, 2cqw, 28px);
    }

    .step-index {
      display: block;
      margin-bottom: 42px;
      color: var(--mint);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: clamp(30px, 3.4cqw, 48px);
      font-weight: 300;
      letter-spacing: -0.06em;
    }

    .step-title {
      margin: 0 0 14px;
      font-size: clamp(19px, 1.7cqw, 25px);
      font-weight: 620;
    }

    .step-body {
      margin: 0;
      color: var(--muted);
      font-size: clamp(13px, 1.1cqw, 15px);
      line-height: 1.75;
    }

    .matrix-wrap {
      position: relative;
      width: min(100%, 1080px);
      margin: 0 auto;
    }

    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .quadrant {
      padding: clamp(18px, 2.1cqw, 28px);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
    }

    .quadrant--mint {
      border-top: 2px solid var(--mint);
    }

    .quadrant--amber {
      border-top: 2px solid var(--amber);
    }

    .quadrant--blue {
      border-top: 2px solid var(--blue);
    }

    .quadrant--rose {
      border-top: 2px solid var(--rose);
    }

    .quadrant-title {
      margin: 0;
      font-size: clamp(18px, 1.7cqw, 24px);
      font-weight: 620;
    }

    .quadrant-signal {
      margin: 10px 0 0;
      color: var(--text);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
    }

    .quadrant-body {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(12px, 1.1cqw, 15px);
      line-height: 1.6;
    }

    .axis-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      color: var(--soft);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .card-meta {
      margin: -4px 0 12px;
      color: var(--mint);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .cards-grid--3,
    .cards-grid--6 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .cards-grid--6 .card {
      min-height: 0;
      padding: 18px 22px;
    }

    .cards-grid--6 .card-index {
      width: 28px;
      height: 28px;
      margin-bottom: 12px;
    }

    .cards-grid--6 .card-title {
      margin-bottom: 8px;
      font-size: 20px;
    }

    .cards-grid--6 .card-body {
      font-size: 14px;
      line-height: 1.6;
    }

    .layers {
      display: grid;
      gap: 10px;
    }

    .layer {
      display: grid;
      grid-template-columns: 48px minmax(250px, 0.85fr) minmax(0, 1.15fr);
      gap: clamp(14px, 2cqw, 28px);
      align-items: center;
      padding: clamp(14px, 1.6cqh, 20px) clamp(16px, 2cqw, 26px);
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(90deg, rgba(20, 39, 53, 0.92), rgba(12, 25, 37, 0.68));
    }

    .layer-index {
      color: var(--mint);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
    }

    .layer-title {
      margin: 0;
      font-size: clamp(16px, 1.45cqw, 21px);
      font-weight: 620;
      letter-spacing: -0.02em;
    }

    .layer-meta {
      margin: 7px 0 0;
      color: var(--soft);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .layer-body {
      margin: 0;
      color: var(--muted);
      font-size: clamp(12px, 1.05cqw, 15px);
      line-height: 1.65;
    }

    @container roadshow (max-width: 760px) {
      .layer {
        grid-template-columns: 36px minmax(0, 1fr);
      }

      .layer-body {
        grid-column: 2;
      }
    }

    .media-layout {
      display: grid;
      grid-template-columns: minmax(250px, 0.72fr) minmax(0, 1.28fr);
      gap: clamp(26px, 4cqw, 58px);
      align-items: center;
      min-height: 0;
    }

    .bullet-list {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .bullet-list li {
      position: relative;
      padding: 16px 0 16px 26px;
      border-bottom: 1px solid var(--line);
      color: #c4d0d6;
      font-size: clamp(14px, 1.3cqw, 18px);
      line-height: 1.6;
    }

    .bullet-list li:first-child {
      border-top: 1px solid var(--line);
    }

    .bullet-list li::before {
      position: absolute;
      top: 26px;
      left: 2px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 12px rgba(130, 230, 197, 0.3);
      content: "";
    }

    .figure {
      min-width: 0;
      margin: 0;
      padding: 12px;
      border: 1px solid #344b5a;
      border-radius: 18px;
      background: #e8eef1;
    }

    .figure--dark {
      background: #121b24;
    }

    .figure-label {
      margin: 0 0 10px;
      color: #465e6c;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .figure--dark .figure-label,
    .figure--dark figcaption {
      color: #adbec7;
    }

    .figure-frame {
      display: grid;
      min-height: 0;
      padding: 8px;
      overflow: hidden;
      place-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.035);
      box-shadow: var(--shadow);
    }

    .figure img {
      display: block;
      width: 100%;
      max-height: 42cqh;
      object-fit: contain;
      border-radius: 10px;
    }

    .figure figcaption {
      margin-top: 12px;
      color: #465e6c;
      font-size: 11px;
      line-height: 1.5;
      text-align: right;
    }

    .slide--image .slide-header {
      margin-bottom: 20px;
    }

    .slide--image .figure-frame {
      padding: 12px;
      background: rgba(238, 245, 246, 0.96);
    }

    .slide--image .figure img {
      max-height: 44cqh;
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(16px, 2.2cqw, 30px);
    }

    .comparison-column {
      padding: clamp(22px, 2.4cqw, 34px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }

    .comparison-eyebrow {
      margin: 0 0 12px;
      color: var(--mint);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
    }

    .comparison-title {
      margin: 0 0 20px;
      font-size: clamp(19px, 1.8cqw, 26px);
      font-weight: 620;
      letter-spacing: -0.025em;
    }

    .comparison-column .bullet-list li {
      padding-top: 11px;
      padding-bottom: 11px;
      font-size: clamp(12px, 1.1cqw, 15px);
    }

    .comparison-column .bullet-list li::before {
      top: 20px;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(18px, 2.5cqw, 34px);
    }

    .timeline-item {
      position: relative;
      padding: 30px 0 0;
      border-top: 1px solid var(--line-strong);
    }

    .timeline-item::before {
      position: absolute;
      top: -5px;
      left: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 6px rgba(130, 230, 197, 0.07);
      content: "";
    }

    .timeline-stage {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--mint);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
    }

    .timeline-title {
      margin: 0 0 16px;
      font-size: clamp(19px, 1.7cqw, 25px);
      font-weight: 620;
      line-height: 1.45;
    }

    .timeline-body {
      margin: 0;
      color: var(--muted);
      font-size: clamp(13px, 1.15cqw, 16px);
      line-height: 1.8;
    }

    .slide--closing {
      align-items: center;
      text-align: center;
    }

    .closing-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 1050px);
    }

    .closing-title {
      margin: 0;
      font-size: clamp(42px, 5.4cqw, 76px);
      font-weight: 660;
      letter-spacing: -0.055em;
      line-height: 1.15;
    }

    .closing-subtitle {
      margin: 24px 0 0;
      color: var(--mint);
      font-size: clamp(19px, 2.1cqw, 30px);
      line-height: 1.5;
    }

    .closing-description {
      max-width: 850px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 1.4cqw, 19px);

    }

    .closing-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 32px;
    }

    .primary-link {
      display: inline-flex;
      gap: 20px;
      align-items: center;
      padding: 13px 20px;
      border: 1px solid var(--mint);
      border-radius: 10px;
      color: #062019;
      background: var(--mint);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .primary-link::after {
      content: "↗";
      font-size: 17px;
    }

    .slide--closing .footnote {
      margin-top: 34px;
      padding-top: 0;
    }

    .controls {
      position: fixed;
      right: 0;
      bottom: 3px;
      left: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto auto auto;
      gap: 4px 12px;
      align-items: center;
      width: 100%;
      min-height: 100px;
      margin: 0 auto;
      padding: 8px clamp(16px, 4cqw, 60px);
      border-top: 1px solid var(--line-strong);
      background: #0d1c29;
      box-shadow: 0 -12px 36px rgba(0, 0, 0, 0.22);
    }

    .navigation-hint {
      grid-column: 1 / -1;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .risk-notice {
      grid-column: 1 / -1;
      margin: 0;
      color: #e8c899;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    #prevButton,
    #nextButton {
      min-height: 40px;
      border-color: var(--line-strong);
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    #nextButton:not(:disabled) {
      border-color: var(--mint);
      color: var(--bg-deep);
      background: var(--mint);
    }

    #nextButton:not(:disabled) .control-icon {
      color: var(--bg-deep);
    }

    .control-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .control-group--actions {
      justify-content: flex-end;
    }

    .control-button {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      transition: 150ms ease;
    }

    .control-button:hover:not(:disabled),
    .control-button[aria-pressed="true"] {
      border-color: var(--line);
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .control-button:disabled {
      cursor: not-allowed;
      opacity: 0.3;
    }

    .control-icon {
      color: var(--mint);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 15px;
      line-height: 1;
    }

    .counter {
      color: var(--soft);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .counter-current {
      color: var(--text);
      font-size: 16px;
    }

    .progress {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 21;
      height: 3px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.04);
    }

    .progress-bar {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #4f9f91, var(--mint));
      transition: width 240ms ease;
    }

    .state {
      display: grid;
      width: min(90%, 720px);
      height: 100%;
      margin: auto;
      place-content: center;
      text-align: center;
    }

    .state-mark {
      width: 38px;
      height: 38px;
      margin: 0 auto 20px;
      border: 2px solid var(--line-strong);
      border-top-color: var(--mint);
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .state-title {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .state-body {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .state-command {
      margin: 20px 0 0;
      padding: 14px 18px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--mint);
      background: rgba(0, 0, 0, 0.2);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
      text-align: left;
      white-space: nowrap;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      padding: clamp(18px, 4cqw, 54px);
      place-items: center;
      background: rgba(2, 7, 12, 0.82);
      backdrop-filter: blur(16px);
    }

    .overview-dialog {
      display: flex;
      flex-direction: column;
      width: min(1180px, 100%);
      max-height: 100%;
      padding: clamp(20px, 3cqw, 34px);
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      background: #0b1722;
      box-shadow: var(--shadow);
    }

    .overview-header {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .overview-title {
      margin: 0;
      font-size: 24px;
      letter-spacing: -0.03em;
    }

    .overview-meta {
      margin: 8px 0 0;
      color: var(--soft);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding-right: 6px;
      overflow: auto;
    }

    .overview-item {
      min-height: 116px;
      padding: 16px;

      border-radius: 12px;

      text-align: left;
    }

    .overview-item:hover,
    .overview-item.is-active {
      border-color: rgba(130, 230, 197, 0.46);
      background: rgba(130, 230, 197, 0.06);
    }

    .overview-number {
      display: block;
      margin-bottom: 14px;
      color: var(--mint);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
    }

    .overview-item-title {
      display: block;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
    }

    .shortcuts {
      margin: 20px 0 0;
      color: var(--soft);
      font-size: 11px;
      line-height: 1.8;
    }

    kbd {
      display: inline-block;
      min-width: 22px;
      margin: 0 2px;
      padding: 1px 5px;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      text-align: center;
    }

    .notes-panel {
      position: fixed;
      right: clamp(16px, 4cqw, 60px);
      bottom: calc(var(--controls-height) + 16px);
      z-index: 30;
      width: min(560px, calc(100% - 32px));
      max-height: min(42cqh, 360px);
      padding: 22px;
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      background: rgba(11, 23, 34, 0.97);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .notes-header {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .notes-label {
      color: var(--mint);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.14em;
    }

    .notes-title {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .notes-body {
      margin: 0;
      color: #becbd1;
      font-size: 14px;
      line-height: 1.8;
    }

    .print-deck {
      display: none;
    }

    @container roadshow (min-width: 761px) and (max-height: 820px) {
      .slide {
        padding-top: 20px;
        padding-bottom: 20px;
      }

      .slide-header {
        margin-bottom: 18px;
      }

      .slide-title {
        font-size: clamp(28px, 3cqw, 42px);
      }

      .lead {
        margin-top: 12px;
        font-size: 18px;
        line-height: 1.5;
      }

      .cards-grid--6 .card {
        padding: 14px 18px;
      }

      .cards-grid--6 .card-index {
        margin-bottom: 8px;
      }

      .evidence-table th,
      .evidence-table td {
        padding: 14px 18px;
      }

      .layer {
        padding-top: 10px;
        padding-bottom: 10px;
      }
    }

    @container roadshow (max-width: 1050px) {
      .cards-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .card {
        min-height: 160px;
      }

      .card-index {
        margin-bottom: 16px;
      }

      .cover-layout {
        grid-template-columns: minmax(0, 1fr) 240px;
      }

      .media-layout {
        grid-template-columns: minmax(220px, 0.65fr) minmax(0, 1.35fr);
      }
    }

    @container roadshow (max-width: 760px) {
      .app {
        grid-template-rows: 54px minmax(0, 1fr) var(--controls-height) 3px;
      }

      .deck-meta span:not(.status-dot),
      .control-button--secondary .control-label,
      .brand-name {
        display: none;
      }

      .slide {
        justify-content: flex-start;
        padding: 26px 22px;
      }

      .cover-layout,
      .media-layout,
      .comparison-grid,
      .timeline {
        grid-template-columns: 1fr;
      }

      .cover-visual {
        display: none;
      }

      .cover-title {
        font-size: clamp(42px, 12cqw, 66px);
      }

      .cards-grid,
      .steps {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 0;
      }

      .step,
      .step:not(:first-child) {
        padding: 18px 0;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .step-index {
        margin-bottom: 12px;
      }

      .matrix-grid {
        grid-template-columns: 1fr;
      }

      .figure img {
        max-height: none;
      }

      .overview-grid {
        grid-template-columns: 1fr;
      }

      .controls {
        gap: 4px;
        padding: 6px 8px;
      }

      .control-group {
        gap: 2px;
      }

      .control-button {
        gap: 4px;
        padding: 7px 6px;
      }

      #prevButton,
      #nextButton {
        font-size: 12px;
      }

      .navigation-hint {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @page {
      size: 15in 8.4375in;
      margin: 0;
    }

    @media print {
      html,
      body {
        width: auto;
        height: auto;
        overflow: visible;
        background: var(--bg);
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .app,
      .modal,
      .notes-panel {
        display: none !important;
      }

      .print-deck {
        display: block;
      }

      .print-deck .slide {
        width: 100cqw;
        max-width: none;
        height: 100cqh;
        padding: 0.42in 0.55in;
        overflow: hidden;
        break-after: page;
        page-break-after: always;
        animation: none;
        background:
          radial-gradient(circle at 8% 4%, rgba(54, 140, 125, 0.16), transparent 32%),
          linear-gradient(145deg, var(--bg), var(--bg-deep));
      }

      .print-deck .slide:last-child {
        break-after: auto;
        page-break-after: auto;
      }

      .print-deck .figure img {
        max-height: 5.1in;
      }
    }

    /* The slide canvas keeps its own layout while browser chrome remains responsive. */
    .slide--image .figure { width: 100%; }
    .slide--image .figure-frame { width: 100%; }
    .slide--image .figure img { max-height: 450px; }
    .app[data-layout="reading"] .slide--image .figure img { max-height: none; }
    .app[data-layout="reading"] .slide { justify-content: flex-start; }
    #layoutButton { border-color: var(--line-strong); color: var(--text); white-space: nowrap; }

    @media (max-width: 760px) {
      .app { grid-template-rows: 54px minmax(0, 1fr) var(--controls-height) 3px; }
      .deck-meta span, .brand-name, .control-button--secondary .control-label { display: none; }
      .controls { gap: 4px; padding: 6px 8px; }
      .control-group { gap: 2px; }
      .control-button { gap: 4px; padding: 7px 6px; }
      #prevButton, #nextButton { font-size: 12px; }
      .navigation-hint, .risk-notice { font-size: 11px; }
      .overview-grid { grid-template-columns: 1fr; }
    }

    @media print {
      .print-deck .slide-frame {
        position: relative;
        left: auto;
        top: auto;
        width: 1440px;
        height: 810px;
        transform: none;
        break-after: page;
        page-break-after: always;
        overflow: hidden;
      }
      .print-deck .slide-frame:last-child { break-after: auto; page-break-after: auto; }
      .print-deck .slide {
        width: 100%;
        height: 100%;
        padding: 24px 56px 58px;
        break-after: auto;
        page-break-after: auto;
      }
      .print-risk {
        position: absolute;
        right: 56px;
        bottom: 12px;
        left: 56px;
        display: block;
        margin: 0;
        color: #e8c899;
        font-size: 12px;
        line-height: 1.5;
        text-align: center;
      }
      .print-deck .slide--image .figure img { max-height: 420px; }
      .print-deck .slide--media .figure img { max-height: 360px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="#1" id="brandLink" aria-label="返回第一页">
        <span class="brand-mark">A</span>
        <span class="brand-name" id="brandName">AgomTradePro</span>
      </a>
      <div class="deck-meta">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="deckVersion">ROADSHOW</span>
        <button class="control-button" id="layoutButton" type="button" aria-pressed="false" title="切换为可滚动的阅读模式">阅读模式</button>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="state" id="loadingState">
        <span class="state-mark" aria-hidden="true"></span>
        <h1 class="state-title">正在加载路演内容</h1>
        <p class="state-body">正在解析内联内容…</p>
      </div>
      <div class="state" id="errorState" hidden>
        <h1 class="state-title">无法加载路演内容</h1>
        <p class="state-body" id="errorMessage"></p>
        <pre class="state-command">python docs/roadshow/build_release.py
# 然后打开生成的带时间戳 HTML 文件</pre>
      </div>
      <div id="slideHost" hidden></div>
    </main>

    <footer class="controls" aria-label="幻灯片控制栏">
      <div class="control-group">
        <button class="control-button" id="prevButton" type="button" disabled title="上一页（←）">
          <span class="control-icon" aria-hidden="true">←</span>
          <span class="control-label">上一页</span>
        </button>
        <button class="control-button control-button--secondary" id="overviewButton" type="button" disabled title="目录（O）" aria-label="目录">
          <span class="control-icon" aria-hidden="true">▦</span>
          <span class="control-label">目录</span>
        </button>
      </div>
      <div class="counter" aria-live="polite">
        <span class="counter-current" id="currentSlide">--</span>
        <span> / </span>
        <span id="totalSlides">--</span>
      </div>
      <div class="control-group control-group--actions">
        <button class="control-button control-button--secondary" id="notesButton" type="button" disabled aria-pressed="false" title="演讲备注（N）" aria-label="备注">
          <span class="control-icon" aria-hidden="true">≡</span>
          <span class="control-label">备注</span>
        </button>
        <button class="control-button control-button--secondary" id="printButton" type="button" disabled title="打印或导出 PDF" aria-label="导出">
          <span class="control-icon" aria-hidden="true">⇩</span>
          <span class="control-label">导出</span>
        </button>
        <button class="control-button control-button--secondary" id="fullscreenButton" type="button" disabled title="全屏（F）" aria-label="全屏">
          <span class="control-icon" aria-hidden="true">□</span>
          <span class="control-label">全屏</span>
        </button>
        <button class="control-button" id="nextButton" type="button" disabled title="下一页（→ 或空格）">
          <span class="control-label">下一页</span>
          <span class="control-icon" aria-hidden="true">→</span>
        </button>
      </div>
      <p class="navigation-hint">点击“下一页”继续 · 键盘 ← → / 空格翻页 · O 打开目录</p>
      <p class="risk-notice" id="riskNotice">投资有风险，决策需谨慎。本系统提供投研辅助，不构成投资建议，不保证盈利。</p>
    </footer>
    <div class="progress" aria-hidden="true"><span class="progress-bar" id="progressBar"></span></div>
  </div>

  <div class="modal" id="overviewModal" role="dialog" aria-modal="true" aria-labelledby="overviewTitle" hidden>
    <div class="overview-dialog">
      <div class="overview-header">
        <div>
          <h2 class="overview-title" id="overviewTitle">路演目录</h2>
          <p class="overview-meta" id="overviewMeta"></p>
        </div>
        <button class="control-button" id="closeOverviewButton" type="button" aria-label="关闭目录">
          <span class="control-icon" aria-hidden="true">×</span>
          <span class="control-label">关闭</span>
        </button>
      </div>

      <p class="shortcuts">
        <kbd>←</kbd><kbd>→</kbd> 翻页 · <kbd>Home</kbd><kbd>End</kbd> 首尾页 ·
        <kbd>O</kbd> 目录 · <kbd>N</kbd> 备注 · <kbd>F</kbd> 全屏 · <kbd>Esc</kbd> 关闭面板
      </p>

  <aside class="notes-panel" id="notesPanel" aria-label="演讲备注" hidden>
    <div class="notes-header">
      <span class="notes-label">SPEAKER NOTES</span>
      <button class="control-button" id="closeNotesButton" type="button" aria-label="关闭演讲备注">
        <span class="control-icon" aria-hidden="true">×</span>
      </button>
    </div>
    <h2 class="notes-title" id="notesTitle"></h2>
    <p class="notes-body" id="notesBody"></p>
  </aside>

  <div class="print-deck" id="printDeck" aria-hidden="true"></div>

  <script id="roadshow-content" type="application/json">__ROADSHOW_CONTENT_JSON__</script>
  <script>
    (() => {
      "use strict";

      const supportedTypes = new Set([
        "cover",
        "cards",
        "flow",
        "matrix",
        "media",
        "image",
        "comparison",
        "table",
        "layers",
        "timeline",
        "closing"
      ]);

      const elements = {
        brandLink: document.getElementById("brandLink"),
        brandName: document.getElementById("brandName"),
        deckVersion: document.getElementById("deckVersion"),
        app: document.getElementById("app"),
        layoutButton: document.getElementById("layoutButton"),
        riskNotice: document.getElementById("riskNotice"),
        controls: document.querySelector(".controls"),
        loadingState: document.getElementById("loadingState"),
        errorState: document.getElementById("errorState"),
        errorMessage: document.getElementById("errorMessage"),
        slideHost: document.getElementById("slideHost"),
        stage: document.getElementById("stage"),
        prevButton: document.getElementById("prevButton"),
        nextButton: document.getElementById("nextButton"),
        overviewButton: document.getElementById("overviewButton"),
        notesButton: document.getElementById("notesButton"),
        printButton: document.getElementById("printButton"),
        fullscreenButton: document.getElementById("fullscreenButton"),
        currentSlide: document.getElementById("currentSlide"),
        totalSlides: document.getElementById("totalSlides"),
        progressBar: document.getElementById("progressBar"),
        overviewModal: document.getElementById("overviewModal"),
        overviewGrid: document.getElementById("overviewGrid"),
        overviewMeta: document.getElementById("overviewMeta"),
        closeOverviewButton: document.getElementById("closeOverviewButton"),
        notesPanel: document.getElementById("notesPanel"),
        notesTitle: document.getElementById("notesTitle"),
        notesBody: document.getElementById("notesBody"),
        closeNotesButton: document.getElementById("closeNotesButton"),
        printDeck: document.getElementById("printDeck")
      };

      const state = {
        content: null,
        index: 0,
        lastFocused: null,
        touchStart: null
      };

      function createElement(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function padNumber(value) {
        return String(value).padStart(2, "0");
      }

      function requireArray(value, label) {
        if (!Array.isArray(value) || value.length === 0) {
          throw new Error(`${label} 必须是非空数组。`);
        }
      }

      function validateContent(content) {
        if (!content || typeof content !== "object") {
          throw new Error("JSON 根节点必须是对象。");
        }
        if (!content.deck || typeof content.deck.title !== "string") {
          throw new Error("缺少 deck.title。");
        }
        requireArray(content.slides, "slides");
        const ids = new Set();
        content.slides.forEach((slide, index) => {
          const label = `slides[${index}]`;
          if (!slide.id || !slide.title || !slide.type) {
            throw new Error(`${label} 必须包含 id、title 和 type。`);
          }
          if (ids.has(slide.id)) throw new Error(`幻灯片 id 重复：${slide.id}`);
          ids.add(slide.id);
          if (!supportedTypes.has(slide.type)) {
            throw new Error(`${slide.id} 使用了不支持的 type：${slide.type}`);
          }
          if (slide.type === "cards") requireArray(slide.cards, `${slide.id}.cards`);
          if (slide.type === "flow") requireArray(slide.steps, `${slide.id}.steps`);
          if (slide.type === "matrix") requireArray(slide.quadrants, `${slide.id}.quadrants`);
          if (slide.type === "comparison") requireArray(slide.columns, `${slide.id}.columns`);
          if (slide.type === "table") {
            requireArray(slide.headers, `${slide.id}.headers`);
            requireArray(slide.rows, `${slide.id}.rows`);
            if (!slide.rows.every((row) => Array.isArray(row) && row.length === slide.headers.length)) {
              throw new Error(`${slide.id} 的每行必须与表头列数一致。`);
            }
          }
          if (slide.type === "layers") requireArray(slide.layers, `${slide.id}.layers`);
          if (slide.type === "timeline") requireArray(slide.items, `${slide.id}.items`);
          if (["media", "image"].includes(slide.type) && (!slide.image || !slide.image.src)) {
            throw new Error(`${slide.id}.image.src 不能为空。`);
          }
        });
      }

      function buildHeader(slide) {
        const header = createElement("header", "slide-header");
        if (slide.chapter) header.append(createElement("p", "chapter", slide.chapter));
        header.append(createElement("h2", "slide-title", slide.title));
        if (slide.lead) header.append(createElement("p", "lead", slide.lead));
        return header;
      }

      function buildTags(tags) {
        if (!Array.isArray(tags) || tags.length === 0) return null;
        const container = createElement("div", "tags");
        tags.forEach((tag) => container.append(createElement("span", "tag", tag)));
        return container;
      }

      function buildFootnote(slide) {
        return slide.footnote ? createElement("p", "footnote", slide.footnote) : null;
      }

      function buildBullets(items) {
        const list = createElement("ul", "bullet-list");
        (items || []).forEach((item) => list.append(createElement("li", "", item)));
        return list;
      }

      function buildFigure(image) {
        const figure = createElement("figure", `figure figure--${image.theme === "dark" ? "dark" : "light"}`);
        figure.append(createElement("p", "figure-label", image.src.includes("system-capability") || image.alt.includes("功能全景") ? "能力关系示意 / CAPABILITY MAP" : "历史界面留存 / INTERFACE ARCHIVE"));
        const frame = createElement("div", "figure-frame");
        const img = createElement("img");
        img.src = image.src;
        img.alt = image.alt || "";
        img.loading = "eager";
        img.decoding = "async";
        frame.append(img);
        figure.append(frame);
        if (image.caption) figure.append(createElement("figcaption", "", image.caption));
        return figure;
      }

      function buildCover(slide, root) {
        const layout = createElement("div", "cover-layout");
        const content = createElement("div");
        if (slide.chapter) content.append(createElement("p", "chapter", slide.chapter));
        content.append(createElement("h1", "cover-title", slide.title));
        if (slide.subtitle) content.append(createElement("p", "cover-subtitle", slide.subtitle));
        if (slide.description) content.append(createElement("p", "cover-description", slide.description));
        if (slide.footer) content.append(createElement("p", "cover-footer", slide.footer));

        const visual = createElement("div", "cover-visual");
        (slide.tags || []).slice(0, 4).forEach((tag) => {
          visual.append(createElement("span", "orbit-tag", tag));
        });
        const core = createElement("div", "cover-core");
        core.append(createElement("strong", "", state.content.deck.short_title || state.content.deck.title));
        core.append(createElement("span", "", `v${state.content.deck.product_version || state.content.deck.content_version}`));
        visual.append(core);
        layout.append(content, visual);
        root.append(layout);
      }

      function buildCards(slide, root) {
        root.append(buildHeader(slide));
        const grid = createElement("div", `cards-grid cards-grid--${slide.cards.length}`);
        slide.cards.forEach((card) => {
          const article = createElement("article", "card");
          if (card.index) article.append(createElement("span", "card-index", card.index));
          article.append(createElement("h3", "card-title", card.title));
          if (card.meta) article.append(createElement("p", "card-meta", card.meta));
          article.append(createElement("p", "card-body", card.body));
          grid.append(article);
        });
        root.append(grid);
      }

      function buildFlow(slide, root) {
        root.append(buildHeader(slide));
        const steps = createElement("div", "steps");
        slide.steps.forEach((step) => {
          const article = createElement("article", "step");
          article.append(createElement("span", "step-index", step.index));
          article.append(createElement("h3", "step-title", step.title));
          article.append(createElement("p", "step-body", step.body));
          steps.append(article);
        });
        root.append(steps);
      }

      function buildMatrix(slide, root) {
        root.append(buildHeader(slide));
        const wrap = createElement("div", "matrix-wrap");
        const grid = createElement("div", "matrix-grid");
        slide.quadrants.forEach((quadrant) => {
          const article = createElement("article", `quadrant quadrant--${quadrant.tone || "mint"}`);
          article.append(createElement("h3", "quadrant-title", quadrant.title));
          article.append(createElement("p", "quadrant-signal", quadrant.signal));
          article.append(createElement("p", "quadrant-body", quadrant.body));
          grid.append(article);
        });
        wrap.append(grid);
        if (slide.axes) {
          const axes = createElement("div", "axis-labels");
          axes.append(createElement("span", "", slide.axes.vertical || ""));
          axes.append(createElement("span", "", slide.axes.horizontal || ""));
          wrap.append(axes);
        }
        root.append(wrap);
      }

      function buildLayers(slide, root) {
        root.append(buildHeader(slide));
        const layers = createElement("div", "layers");
        slide.layers.forEach((layer) => {
          const article = createElement("article", "layer");
          article.append(createElement("span", "layer-index", layer.index));
          const heading = createElement("div");
          heading.append(createElement("h3", "layer-title", layer.title));
          if (layer.meta) heading.append(createElement("p", "layer-meta", layer.meta));
          article.append(heading);
          article.append(createElement("p", "layer-body", layer.body));
          layers.append(article);
        });
        root.append(layers);
        const tags = buildTags(slide.tags);
        if (tags) root.append(tags);
      }

      function buildMedia(slide, root) {
        root.append(buildHeader(slide));
        const layout = createElement("div", "media-layout");
        const content = createElement("div");
        content.append(buildBullets(slide.bullets));
        const tags = buildTags(slide.tags);
        if (tags) content.append(tags);
        layout.append(content, buildFigure(slide.image));
        root.append(layout);
      }

      function buildImage(slide, root) {
        root.append(buildHeader(slide));
        root.append(buildFigure(slide.image));
      }

      function buildComparison(slide, root) {
        root.append(buildHeader(slide));
        const grid = createElement("div", "comparison-grid");
        slide.columns.forEach((column) => {
          const article = createElement("article", "comparison-column");
          if (column.eyebrow) article.append(createElement("p", "comparison-eyebrow", column.eyebrow));
          article.append(createElement("h3", "comparison-title", column.title));
          article.append(buildBullets(column.bullets));
          grid.append(article);
        });
        root.append(grid);
        const tags = buildTags(slide.tags);
        if (tags) root.append(tags);
      }

      function buildTable(slide, root) {
        root.append(buildHeader(slide));
        const wrap = createElement("div", "evidence-table-wrap");
        const table = createElement("table", "evidence-table");
        table.setAttribute("aria-label", slide.title);
        const head = createElement("thead");
        const headings = createElement("tr");
        slide.headers.forEach((text) => {
          const cell = createElement("th", "", text);
          cell.scope = "col";
          headings.append(cell);
        });
        head.append(headings);
        const body = createElement("tbody");
        slide.rows.forEach((row) => {
          const line = createElement("tr");
          row.forEach((text, index) => {
            const cell = createElement(index === 0 ? "th" : "td", "", text);
            if (index === 0) cell.scope = "row";
            line.append(cell);
          });
          body.append(line);
        });
        table.append(head, body);
        wrap.append(table);
        root.append(wrap);
      }

      function buildTimeline(slide, root) {
        root.append(buildHeader(slide));
        const timeline = createElement("div", "timeline");
        slide.items.forEach((item) => {
          const article = createElement("article", "timeline-item");
          article.append(createElement("span", "timeline-stage", item.stage));
          article.append(createElement("h3", "timeline-title", item.title));
          article.append(createElement("p", "timeline-body", item.body));
          timeline.append(article);
        });
        root.append(timeline);
      }

      function buildClosing(slide, root) {
        const content = createElement("div", "closing-content");
        if (slide.chapter) content.append(createElement("p", "chapter", slide.chapter));
        content.append(createElement("h1", "closing-title", slide.title));
        if (slide.subtitle) content.append(createElement("p", "closing-subtitle", slide.subtitle));
        if (slide.description) content.append(createElement("p", "closing-description", slide.description));
        if (Array.isArray(slide.links) && slide.links.length > 0) {
          const links = createElement("div", "closing-links");
          slide.links.forEach((link) => {
            const anchor = createElement("a", "primary-link", link.label);
            anchor.href = link.url;
            anchor.target = "_blank";
            anchor.rel = "noopener noreferrer";
            links.append(anchor);
          });
          content.append(links);
        }
        const tags = buildTags(slide.tags);
        if (tags) content.append(tags);
        root.append(content);
      }

      function buildSlide(slide, index) {
        const root = createElement("article", `slide slide--${slide.type}`);
        root.dataset.slideId = slide.id;
        root.setAttribute("aria-label", `${index + 1} / ${state.content.slides.length}：${slide.title}`);
        if (slide.type === "cover") buildCover(slide, root);
        if (slide.type === "cards") buildCards(slide, root);
        if (slide.type === "flow") buildFlow(slide, root);
        if (slide.type === "matrix") buildMatrix(slide, root);
        if (slide.type === "media") buildMedia(slide, root);
        if (slide.type === "image") buildImage(slide, root);
        if (slide.type === "comparison") buildComparison(slide, root);
        if (slide.type === "table") buildTable(slide, root);
        if (slide.type === "layers") buildLayers(slide, root);
        if (slide.type === "timeline") buildTimeline(slide, root);
        if (slide.type === "closing") buildClosing(slide, root);
        const footnote = buildFootnote(slide);
        if (footnote) root.append(footnote);
        return root;
      }

      function indexFromHash() {
        const match = window.location.hash.match(/^#(\d+)$/);
        if (!match) return 0;
        return Math.min(Math.max(Number(match[1]) - 1, 0), state.content.slides.length - 1);
      }

      function updateNotes() {
        const slide = state.content.slides[state.index];
        elements.notesTitle.textContent = `${padNumber(state.index + 1)} · ${slide.title}`;
        elements.notesBody.textContent = slide.notes || "本页暂无演讲备注。";
      }

      function goToSlide(index, updateHash = true) {
        if (!state.content) return;
        const nextIndex = Math.min(Math.max(index, 0), state.content.slides.length - 1);
        state.index = nextIndex;
        const slide = state.content.slides[nextIndex];
        elements.slideHost.replaceChildren(buildFrame(slide, nextIndex));
        elements.currentSlide.textContent = padNumber(nextIndex + 1);
        elements.totalSlides.textContent = padNumber(state.content.slides.length);
        elements.progressBar.style.width = `${((nextIndex + 1) / state.content.slides.length) * 100}%`;
        elements.prevButton.disabled = nextIndex === 0;
        elements.nextButton.disabled = nextIndex === state.content.slides.length - 1;
        document.title = `${slide.title} · ${state.content.deck.title}`;
        if (updateHash) history.replaceState(null, "", `#${nextIndex + 1}`);
        updateNotes();
        elements.overviewGrid.querySelectorAll(".overview-item").forEach((item, itemIndex) => {
          item.classList.toggle("is-active", itemIndex === nextIndex);
          if (itemIndex === nextIndex) item.setAttribute("aria-current", "page");
          else item.removeAttribute("aria-current");
        });
      }

      function buildOverview() {
        const { deck, slides } = state.content;
        elements.overviewMeta.textContent = `内容 v${deck.content_version || "-"} · 产品 v${deck.product_version || "-"} · 更新 ${deck.updated_at || "-"}`;
        const fragment = document.createDocumentFragment();
        slides.forEach((slide, index) => {
          const button = createElement("button", "overview-item");
          button.type = "button";
          button.append(createElement("span", "overview-number", padNumber(index + 1)));
          button.append(createElement("span", "overview-item-title", slide.title));
          button.addEventListener("click", () => {
            goToSlide(index);
            closeOverview();
          });
          fragment.append(button);
        });
        elements.overviewGrid.replaceChildren(fragment);
      }

      function openOverview() {
        if (!state.content) return;
        state.lastFocused = document.activeElement;
        elements.overviewModal.hidden = false;
        elements.closeOverviewButton.focus();
      }

      function closeOverview() {
        if (elements.overviewModal.hidden) return;
        elements.overviewModal.hidden = true;
        if (state.lastFocused instanceof HTMLElement) state.lastFocused.focus();
      }

      function toggleNotes(force) {
        if (!state.content) return;
        const shouldOpen = force === undefined ? elements.notesPanel.hidden : force;
        elements.notesPanel.hidden = !shouldOpen;
        elements.notesButton.setAttribute("aria-pressed", String(shouldOpen));
        if (shouldOpen) updateNotes();
      }

      async function toggleFullscreen() {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch {
          elements.fullscreenButton.title = "当前浏览器未允许全屏，可使用浏览器菜单进入全屏";
        }
      }

      function buildFrame(slide, index) {
        const frame = createElement("div", "slide-frame");
        frame.append(buildSlide(slide, index));
        frame.append(createElement("p", "print-risk", state.content.deck.risk_notice));
        return frame;
      }

      function fitPresentation() {
        const controlsHeight = Math.ceil(elements.controls.getBoundingClientRect().height);
        if (controlsHeight === 0) return;
        document.documentElement.style.setProperty("--controls-height", `${controlsHeight}px`);
        const bounds = elements.stage.getBoundingClientRect();
        const scale = Math.min(bounds.width / 1440, bounds.height / 810);
        elements.slideHost.style.setProperty("--slide-scale", String(Math.max(scale, 0.01)));
      }

      function setReadingMode(reading) {
        elements.app.dataset.layout = reading ? "reading" : "presentation";
        elements.layoutButton.textContent = reading ? "演示模式" : "阅读模式";
        elements.layoutButton.setAttribute("aria-pressed", String(reading));
        elements.layoutButton.title = reading ? "切换为等比适配的演示模式" : "切换为可滚动的阅读模式";
        fitPresentation();
      }

      function printAllSlides() {
        if (!state.content) return;
        const fragment = document.createDocumentFragment();
        state.content.slides.forEach((slide, index) => fragment.append(buildFrame(slide, index)));
        elements.printDeck.replaceChildren(fragment);
        try {
          window.print();
        } finally {
          elements.printDeck.replaceChildren();
        }
      }

      function showError(error) {
        elements.loadingState.hidden = true;
        elements.slideHost.hidden = true;
        elements.errorState.hidden = false;
        const reason = error instanceof Error ? error.message : String(error);
        elements.errorMessage.textContent = `内联内容缺失或格式不正确，请重新生成发布版。详细信息：${reason}`;
      }

      function bindEvents() {
        elements.layoutButton.addEventListener("click", () => setReadingMode(elements.app.dataset.layout !== "reading"));
        const observer = new ResizeObserver(fitPresentation);
        observer.observe(elements.stage);
        observer.observe(elements.controls);
        window.addEventListener("resize", fitPresentation);
        elements.prevButton.addEventListener("click", () => goToSlide(state.index - 1));
        elements.nextButton.addEventListener("click", () => goToSlide(state.index + 1));
        elements.overviewButton.addEventListener("click", openOverview);
        elements.closeOverviewButton.addEventListener("click", closeOverview);
        elements.overviewModal.addEventListener("click", (event) => {
          if (event.target === elements.overviewModal) closeOverview();
        });
        elements.notesButton.addEventListener("click", () => toggleNotes());
        elements.closeNotesButton.addEventListener("click", () => toggleNotes(false));
        elements.fullscreenButton.addEventListener("click", toggleFullscreen);
        elements.printButton.addEventListener("click", printAllSlides);
        elements.brandLink.addEventListener("click", (event) => {
          event.preventDefault();
          goToSlide(0);
        });
        window.addEventListener("hashchange", () => {
          if (state.content) goToSlide(indexFromHash(), false);
        });
        document.addEventListener("keydown", (event) => {
          if (!state.content || event.ctrlKey || event.metaKey || event.altKey) return;
          if (event.key === "Escape") {
            closeOverview();
            toggleNotes(false);
            return;
          }
          if (!elements.overviewModal.hidden) return;
          const interactive = event.target instanceof Element && event.target.closest("button, a");
          if (event.code === "Space" && interactive) return;
          if (["ArrowRight", "PageDown"].includes(event.key) || event.code === "Space") {
            event.preventDefault();
            goToSlide(state.index + 1);
          }
          if (["ArrowLeft", "PageUp"].includes(event.key)) {
            event.preventDefault();
            goToSlide(state.index - 1);
          }
          if (event.key === "Home") goToSlide(0);
          if (event.key === "End") goToSlide(state.content.slides.length - 1);
          if (event.key.toLowerCase() === "o") openOverview();
          if (event.key.toLowerCase() === "n") toggleNotes();
          if (event.key.toLowerCase() === "f") toggleFullscreen();
        });
        elements.stage.addEventListener("touchstart", (event) => {
          const touch = event.changedTouches[0];
          state.touchStart = { x: touch.clientX, y: touch.clientY };
        }, { passive: true });
        elements.stage.addEventListener("touchend", (event) => {
          if (!state.touchStart) return;
          const touch = event.changedTouches[0];
          const deltaX = touch.clientX - state.touchStart.x;
          const deltaY = touch.clientY - state.touchStart.y;
          state.touchStart = null;
          if (Math.abs(deltaX) < 60 || Math.abs(deltaY) > 70) return;
          goToSlide(state.index + (deltaX < 0 ? 1 : -1));
        }, { passive: true });
      }

      function initialize() {
        bindEvents();
        try {
          const contentNode = document.getElementById("roadshow-content");
          if (!contentNode) throw new Error("缺少内联内容节点 roadshow-content");
          const content = JSON.parse(contentNode.textContent || "");
          validateContent(content);
          state.content = content;
          elements.riskNotice.textContent = content.deck.risk_notice;
          setReadingMode(window.matchMedia("(pointer: coarse) and (max-width: 760px)").matches);
          elements.brandName.textContent = content.deck.short_title || content.deck.title;
          elements.deckVersion.textContent = `ROADSHOW · PRODUCT v${content.deck.product_version || content.deck.content_version}`;
          buildOverview();
          elements.loadingState.hidden = true;
          elements.slideHost.hidden = false;
          [elements.overviewButton, elements.notesButton, elements.printButton, elements.fullscreenButton]
            .forEach((button) => { button.disabled = false; });
          goToSlide(indexFromHash());
        } catch (error) {
          showError(error);
        }
      }

      initialize();
    })();
  </script>
</body>
</html>
