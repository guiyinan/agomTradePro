groups:
  - name: web_to_tui_migration_readiness
    rules:
      - record: web_to_tui:entry_samples_14d
        expr: |
          sum by (task_key) (
            increase(web_to_tui_migration_events_total{event_type="entry"}[14d])
          )

      - record: web_to_tui:legacy_entry_ratio_14d
        expr: |
          sum by (task_key) (
            increase(web_to_tui_migration_events_total{
              surface="classic",
              event_type="entry"
            }[14d])
          )
          /
          clamp_min(
            sum by (task_key) (
              increase(web_to_tui_migration_events_total{event_type="entry"}[14d])
            ),
            1
          )

      - record: web_to_tui:execution_error_ratio_14d
        expr: |
          sum by (surface, task_key) (
            increase(web_to_tui_migration_events_total{
              event_type="execution",
              outcome=~"client_error|server_error"
            }[14d])
          )
          /
          clamp_min(
            sum by (surface, task_key) (
              increase(web_to_tui_migration_events_total{
                event_type="execution",
                outcome=~"success|client_error|server_error"
              }[14d])
            ),
            1
          )

      - record: web_to_tui:task_request_samples_14d
        expr: |
          sum by (surface, task_key) (
            increase(web_to_tui_migration_events_total{
              surface="classic",
              event_type=~"entry|execution",
              outcome=~"success|client_error|server_error"
            }[14d])
            or
            increase(web_to_tui_migration_events_total{
              surface="tui",
              event_type="execution",
              outcome=~"success|client_error|server_error"
            }[14d])
          )

      - record: web_to_tui:task_request_error_ratio_14d
        expr: |
          sum by (surface, task_key) (
            increase(web_to_tui_migration_events_total{
              surface="classic",
              event_type=~"entry|execution",
              outcome=~"client_error|server_error"
            }[14d])
            or
            increase(web_to_tui_migration_events_total{
              surface="tui",
              event_type="execution",
              outcome=~"client_error|server_error"
            }[14d])
          )
          /
          clamp_min(
            web_to_tui:task_request_samples_14d,
            1
          )

      - alert: WebToTuiLegacyEntryRatioHigh
        expr: |
          web_to_tui:legacy_entry_ratio_14d > 0.05
          and on (task_key)
          web_to_tui:entry_samples_14d >= 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Classic entry ratio remains above the M5 threshold"
          description: "Task {{ $labels.task_key }} has a 14-day Classic ratio of {{ $value | humanizePercentage }}"

      - alert: WebToTuiErrorRateRegression
        expr: |
          web_to_tui:task_request_error_ratio_14d{surface="tui"}
          - on (task_key)
          web_to_tui:task_request_error_ratio_14d{surface="classic"} > 0.005
          and on (task_key)
          web_to_tui:task_request_samples_14d{surface="tui"} >= 20
          and on (task_key)
          web_to_tui:task_request_samples_14d{surface="classic"} >= 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "TUI task error rate exceeds the Classic baseline"
          description: "Task {{ $labels.task_key }} exceeds the 0.5 percentage-point M5 allowance"

  - name: agomtradepro_alerts
    rules:
      # 5xx 激增告警
      - alert: High5xxRate
        expr: |
          sum(rate(api_request_total{status_code=~"5.."}[5m]))
          / sum(rate(api_request_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate detected"
          description: "5xx error rate is {{ $value | humanizePercentage }}"

      # 任务堆积告警
      - alert: CeleryTaskBacklog
        expr: sum(celery_queue_length) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Celery task backlog detected"
          description: "{{ $value }} tasks pending"

      # 审计写入异常告警
      - alert: AuditWriteFailure
        expr: |
          sum(rate(audit_write_total{status="failure"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Audit write failures detected"
          description: "Audit log write is failing"

      # API 响应时间告警
      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(api_request_latency_seconds_bucket[5m])) by (le, endpoint)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "P95 latency is {{ $value }}s"

      # 数据采集失败告警
      - alert: DataCollectionFailure
        expr: |
          sum(rate(data_collection_total{status="failure"}[10m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Data collection failures detected"
          description: "Data collection failure rate is {{ $value | humanizePercentage }}"

      # Qlib 推理失败告警
      - alert: QlibInferenceFailure
        expr: |
          sum(rate(qlib_inference_total{status="failure"}[5m])) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Qlib inference failures detected"
          description: "Qlib inference failure rate is {{ $value | humanizePercentage }}"

      # 数据库连接池告警
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          sum(db_connections_total{status="active"}) > 100
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Connection pool usage is {{ $value | humanizePercentage }}"

      # Redis 连接告警
      - alert: RedisConnectionFailure
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis connection lost"
          description: "Redis is not responding"

      # 磁盘空间告警
      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"
