global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: agomtradepro
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: agomtradepro
    metrics_path: /metrics/
    scheme: http
    static_configs:
      - targets:
          - web:8000

