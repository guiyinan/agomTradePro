services:
  runtime_ns:
    image: ${RUNTIME_NS_IMAGE:-alpine:3.20}
    restart: unless-stopped
    command:
      - sh
      - -c
      - trap 'exit 0' TERM INT; while true; do sleep 3600; done
    mem_limit: 32m
    cpus: 0.1
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 300m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agomtradepro}
      POSTGRES_USER: ${POSTGRES_USER:-agomtradepro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agomtradepro} -d ${POSTGRES_DB:-agomtradepro}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-768m}
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "5"

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    pid: "service:runtime_ns"
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REALTIME_WEBSOCKET_ENABLED: ${REALTIME_WEBSOCKET_ENABLED:-True}
      APP_BASE_URL: ${APP_BASE_URL:-}
      AGOMTRADEPRO_BASE_URL: ${AGOMTRADEPRO_BASE_URL:-http://web:8000}
      AGOMTRADEPRO_API_TOKEN: ${AGOMTRADEPRO_API_TOKEN:-}
      AGOMTRADEPRO_USERNAME: ${AGOMTRADEPRO_USERNAME:-}
      AGOMTRADEPRO_PASSWORD: ${AGOMTRADEPRO_PASSWORD:-}
      AGOMTRADEPRO_AUDIT_TIMEOUT_SECONDS: ${AGOMTRADEPRO_AUDIT_TIMEOUT_SECONDS:-5.0}
      AGOMTRADEPRO_AUDIT_MAX_ATTEMPTS: ${AGOMTRADEPRO_AUDIT_MAX_ATTEMPTS:-2}
      AGOMTRADEPRO_AUDIT_RETRY_BACKOFF_SECONDS: ${AGOMTRADEPRO_AUDIT_RETRY_BACKOFF_SECONDS:-0.25}
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-False}
      TUI_ACTION_MAX_CONCURRENCY: ${TUI_ACTION_MAX_CONCURRENCY:-6}
      TUI_ACTION_ACQUIRE_TIMEOUT_SECONDS: ${TUI_ACTION_ACQUIRE_TIMEOUT_SECONDS:-3.0}
      TERMINAL_AGENT_MAX_CONCURRENCY: ${TERMINAL_AGENT_MAX_CONCURRENCY:-1}
      TERMINAL_AGENT_EXECUTION_TIMEOUT_SECONDS: ${TERMINAL_AGENT_EXECUTION_TIMEOUT_SECONDS:-60.0}
      TERMINAL_AGENT_LEASE_GRACE_SECONDS: ${TERMINAL_AGENT_LEASE_GRACE_SECONDS:-30}
      TERMINAL_AGENT_ORPHAN_AFTER_SECONDS: ${TERMINAL_AGENT_ORPHAN_AFTER_SECONDS:-90}
      TERMINAL_AGENT_MAX_TURNS: ${TERMINAL_AGENT_MAX_TURNS:-4}
      TERMINAL_AGENT_MCP_CLIENT_TIMEOUT_SECONDS: ${TERMINAL_AGENT_MCP_CLIENT_TIMEOUT_SECONDS:-20.0}
      TERMINAL_AGENT_INTERNAL_API_TIMEOUT_SECONDS: ${TERMINAL_AGENT_INTERNAL_API_TIMEOUT_SECONDS:-8.0}
      TERMINAL_AGENT_INTERNAL_MAX_RETRIES: ${TERMINAL_AGENT_INTERNAL_MAX_RETRIES:-0}
      TERMINAL_AGENT_AUDIT_TIMEOUT_SECONDS: ${TERMINAL_AGENT_AUDIT_TIMEOUT_SECONDS:-2.0}
      TERMINAL_AGENT_AUDIT_MAX_ATTEMPTS: ${TERMINAL_AGENT_AUDIT_MAX_ATTEMPTS:-1}
      # TAR-01 contract flags are explicit, but queued admission/worker remain
      # disabled unless a reviewed deployment explicitly authorizes both paths.
      TERMINAL_RUNTIME_AUTHORIZED: ${TERMINAL_RUNTIME_AUTHORIZED:-false}
      TERMINAL_RUNTIME_ROLE: ${TERMINAL_RUNTIME_ROLE:-legacy_inline}
      TERMINAL_QUEUED_INTAKE_ENABLED: ${TERMINAL_QUEUED_INTAKE_ENABLED:-false}
      TERMINAL_QUEUED_WORKER_ENABLED: ${TERMINAL_QUEUED_WORKER_ENABLED:-false}
      TERMINAL_LEGACY_INLINE_ENABLED: ${TERMINAL_LEGACY_INLINE_ENABLED:-true}
      TERMINAL_EMERGENCY_STOP: ${TERMINAL_EMERGENCY_STOP:-false}
      TERMINAL_PER_USER_QUEUED_LIMIT: ${TERMINAL_PER_USER_QUEUED_LIMIT:-4}
      TERMINAL_GLOBAL_QUEUED_LIMIT: ${TERMINAL_GLOBAL_QUEUED_LIMIT:-40}
      TERMINAL_PER_USER_ACTIVE_LIMIT: ${TERMINAL_PER_USER_ACTIVE_LIMIT:-1}
      TERMINAL_GLOBAL_ACTIVE_LIMIT: ${TERMINAL_GLOBAL_ACTIVE_LIMIT:-4}
      TERMINAL_LEGACY_INLINE_CONCURRENCY: ${TERMINAL_LEGACY_INLINE_CONCURRENCY:-1}
      TERMINAL_LEGACY_INLINE_TIMEOUT_SECONDS: ${TERMINAL_LEGACY_INLINE_TIMEOUT_SECONDS:-60}
      # Keep the synchronous fallback bounded; production settings still
      # hard-disable inline Qlib inference regardless of environment input.
      ALPHA_ALLOW_INLINE_INFERENCE: ${ALPHA_ALLOW_INLINE_INFERENCE:-false}
      ALPHA_SIMPLE_MAX_POOL_SIZE: ${ALPHA_SIMPLE_MAX_POOL_SIZE:-120}
      # web/celery share runtime_ns; killing Daphne from a healthcheck can
      # leave the web container alive without an HTTP process. Let Docker
      # report unhealthy and keep recovery under the deploy supervisor.
      WEB_HEALTH_SELF_TERMINATE_AFTER_FAILURES: ${WEB_HEALTH_SELF_TERMINATE_AFTER_FAILURES:-0}
      AGOM_BUILD_IDENTITY_PATH: /app/.agom-build-identity.json
      AGOM_RELEASE_MANIFEST_PATH: /run/agomtradepro/release-manifest.json
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AGOMTRADEPRO_ENCRYPTION_KEY: ${AGOMTRADEPRO_ENCRYPTION_KEY:-}
      AGOMTRADEPRO_CHECK_DEPLOY_ON_START: ${AGOMTRADEPRO_CHECK_DEPLOY_ON_START:-0}
      AGOMTRADEPRO_AUTO_MIGRATE_ON_START: ${AGOMTRADEPRO_AUTO_MIGRATE_ON_START:-0}
      AGOMTRADEPRO_BOOTSTRAP_ON_START: ${AGOMTRADEPRO_BOOTSTRAP_ON_START:-0}
      AGOMTRADEPRO_COLLECTSTATIC_ON_START: ${AGOMTRADEPRO_COLLECTSTATIC_ON_START:-0}
      AGOMTRADEPRO_SETUP_SCHEDULE_ON_START: ${AGOMTRADEPRO_SETUP_SCHEDULE_ON_START:-0}
      AGOMTRADEPRO_ENSURE_SUPERUSER_ON_START: ${AGOMTRADEPRO_ENSURE_SUPERUSER_ON_START:-0}
      AGOMTRADEPRO_BOOTSTRAP_ALPHA_ON_START: ${AGOMTRADEPRO_BOOTSTRAP_ALPHA_ON_START:-0}
      AGOMTRADEPRO_BOOTSTRAP_ALPHA_UNIVERSES: ${AGOMTRADEPRO_BOOTSTRAP_ALPHA_UNIVERSES:-csi300}
      AGOMTRADEPRO_BOOTSTRAP_ALPHA_TOP_N: ${AGOMTRADEPRO_BOOTSTRAP_ALPHA_TOP_N:-30}
      MACRO_SYNC_HOUR: ${MACRO_SYNC_HOUR:-8}
      MACRO_SYNC_MINUTE: ${MACRO_SYNC_MINUTE:-5}
      DAPHNE_APPLICATION_CLOSE_TIMEOUT: ${DAPHNE_APPLICATION_CLOSE_TIMEOUT:-10}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      SECURE_SSL_REDIRECT_EXEMPT_HOSTS: ${SECURE_SSL_REDIRECT_EXEMPT_HOSTS:-127.0.0.1,localhost,web}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-True}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-True}
    volumes:
      - sqlite_data:/app/data
      - var_data:/app/var
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ${AGOM_BACKUP_DIR:-/opt/agomtradepro/backups/database}:/app/backups/database
      - ../.agom-release-manifest.json:/run/agomtradepro/release-manifest.json:ro
    depends_on:
      runtime_ns:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "sh docker/healthcheck-web.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: ${WEB_MEMORY_LIMIT:-1g}
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  celery_worker:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    pid: "service:runtime_ns"
    command: ["celery", "-A", "core", "worker", "-l", "info", "-Q", "${CELERY_WORKER_QUEUES:-celery,qlib_infer,qlib_train}", "--concurrency", "${CELERY_WORKER_CONCURRENCY:-1}", "--max-tasks-per-child", "${CELERY_WORKER_MAX_TASKS_PER_CHILD:-1}"]
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REALTIME_WEBSOCKET_ENABLED: ${REALTIME_WEBSOCKET_ENABLED:-True}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_BASE_URL: ${APP_BASE_URL:-}
      AGOMTRADEPRO_BASE_URL: ${AGOMTRADEPRO_BASE_URL:-http://web:8000}
      AGOMTRADEPRO_API_TOKEN: ${AGOMTRADEPRO_API_TOKEN:-}
      AGOMTRADEPRO_USERNAME: ${AGOMTRADEPRO_USERNAME:-}
      AGOMTRADEPRO_PASSWORD: ${AGOMTRADEPRO_PASSWORD:-}
      AGOMTRADEPRO_AUDIT_TIMEOUT_SECONDS: ${AGOMTRADEPRO_AUDIT_TIMEOUT_SECONDS:-5.0}
      AGOMTRADEPRO_AUDIT_MAX_ATTEMPTS: ${AGOMTRADEPRO_AUDIT_MAX_ATTEMPTS:-2}
      AGOMTRADEPRO_AUDIT_RETRY_BACKOFF_SECONDS: ${AGOMTRADEPRO_AUDIT_RETRY_BACKOFF_SECONDS:-0.25}
      QLIB_PREDICTION_BATCH_SIZE: ${QLIB_PREDICTION_BATCH_SIZE:-500}
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AGOMTRADEPRO_ENCRYPTION_KEY: ${AGOMTRADEPRO_ENCRYPTION_KEY:-}
      TERMINAL_RUNTIME_AUTHORIZED: ${TERMINAL_RUNTIME_AUTHORIZED:-false}
      TERMINAL_QUEUED_WORKER_ENABLED: ${TERMINAL_QUEUED_WORKER_ENABLED:-false}
      TERMINAL_AGENT_ORPHAN_AFTER_SECONDS: ${TERMINAL_AGENT_ORPHAN_AFTER_SECONDS:-90}
      AGOM_BUILD_IDENTITY_PATH: /app/.agom-build-identity.json
      AGOM_RELEASE_MANIFEST_PATH: /run/agomtradepro/release-manifest.json
      AGOMTRADEPRO_AUTO_MIGRATE_ON_START: "0"
      AGOMTRADEPRO_BOOTSTRAP_ON_START: "0"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SECURE_SSL_REDIRECT_EXEMPT_HOSTS: ${SECURE_SSL_REDIRECT_EXEMPT_HOSTS:-127.0.0.1,localhost,web}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-True}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-True}
    volumes:
      - sqlite_data:/app/data
      - var_data:/app/var
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ${AGOM_BACKUP_DIR:-/opt/agomtradepro/backups/database}:/app/backups/database
      - ../.agom-release-manifest.json:/run/agomtradepro/release-manifest.json:ro
    depends_on:
      runtime_ns:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    # QLib inference can legitimately exceed 2 GiB RSS for a full portfolio
    # universe.  Keep concurrency at one and recycle the child after each task,
    # but leave enough cgroup headroom to prevent SIGKILL/OOM during inference.
    mem_limit: ${CELERY_WORKER_MEMORY_LIMIT:-4g}
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "5"

  terminal_agent_worker:
    extends:
      service: celery_worker
    command:
      - celery
      - -A
      - core
      - worker
      - -l
      - info
      - -Q
      - terminal_agent
      - --concurrency
      - ${TERMINAL_WORKER_CONCURRENCY:-4}
      - --prefetch-multiplier
      - "1"
      - --max-tasks-per-child
      - ${TERMINAL_WORKER_MAX_TASKS_PER_CHILD:-100}
    environment:
      TERMINAL_RUNTIME_AUTHORIZED: ${TERMINAL_RUNTIME_AUTHORIZED:-false}
      TERMINAL_RUNTIME_ROLE: queued_worker
      TERMINAL_QUEUED_WORKER_ENABLED: ${TERMINAL_QUEUED_WORKER_ENABLED:-false}
      TERMINAL_AGENT_ORPHAN_AFTER_SECONDS: ${TERMINAL_AGENT_ORPHAN_AFTER_SECONDS:-90}
      TERMINAL_AGENT_MAX_CONCURRENCY: ${TERMINAL_WORKER_CONCURRENCY:-4}
    mem_limit: ${TERMINAL_WORKER_MEMORY_LIMIT:-2g}
    cpus: ${TERMINAL_WORKER_CPUS:-2.0}

  celery_beat:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    pid: "service:runtime_ns"
    command: ["celery", "-A", "core", "beat", "-l", "info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    environment:
      DJANGO_SETTINGS_MODULE: core.settings.production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REALTIME_WEBSOCKET_ENABLED: ${REALTIME_WEBSOCKET_ENABLED:-True}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_BASE_URL: ${APP_BASE_URL:-}
      AGOMTRADEPRO_BASE_URL: ${AGOMTRADEPRO_BASE_URL:-http://web:8000}
      AGOMTRADEPRO_API_TOKEN: ${AGOMTRADEPRO_API_TOKEN:-}
      AGOMTRADEPRO_USERNAME: ${AGOMTRADEPRO_USERNAME:-}
      AGOMTRADEPRO_PASSWORD: ${AGOMTRADEPRO_PASSWORD:-}
      AGOMTRADEPRO_AUDIT_TIMEOUT_SECONDS: ${AGOMTRADEPRO_AUDIT_TIMEOUT_SECONDS:-5.0}
      AGOMTRADEPRO_AUDIT_MAX_ATTEMPTS: ${AGOMTRADEPRO_AUDIT_MAX_ATTEMPTS:-2}
      AGOMTRADEPRO_AUDIT_RETRY_BACKOFF_SECONDS: ${AGOMTRADEPRO_AUDIT_RETRY_BACKOFF_SECONDS:-0.25}
      SECRET_KEY: ${SECRET_KEY:-}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
      AGOMTRADEPRO_ENCRYPTION_KEY: ${AGOMTRADEPRO_ENCRYPTION_KEY:-}
      AGOM_BUILD_IDENTITY_PATH: /app/.agom-build-identity.json
      AGOM_RELEASE_MANIFEST_PATH: /run/agomtradepro/release-manifest.json
      AGOMTRADEPRO_AUTO_MIGRATE_ON_START: "0"
      AGOMTRADEPRO_BOOTSTRAP_ON_START: "0"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SECURE_SSL_REDIRECT_EXEMPT_HOSTS: ${SECURE_SSL_REDIRECT_EXEMPT_HOSTS:-127.0.0.1,localhost,web}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-True}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-True}
    volumes:
      - sqlite_data:/app/data
      - var_data:/app/var
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ../.agom-release-manifest.json:/run/agomtradepro/release-manifest.json:ro
    depends_on:
      runtime_ns:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    mem_limit: ${CELERY_BEAT_MEMORY_LIMIT:-512m}
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rsshub:
    image: ${RSSHUB_IMAGE:-diygod/rsshub:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://redis:6379/2
      LISTEN_INADDR_ANY: "1"
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:1200/healthz', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1));\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 500m

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 200m

volumes:
  sqlite_data:
  postgres_data:
  var_data:
  redis_data:
  static_data:
  media_data:
  caddy_data:
  caddy_config:
